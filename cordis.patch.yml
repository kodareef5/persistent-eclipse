              ## 3. Frontiers — borrow the failure, change the architecture

              New products rarely invent entirely new security primitives. They compose old ones across boundaries: proxy/origin, tenant/cache, callback/queue, agent/tool, sandbox/host, browser/local service, CI/release. Ask whether the *same assumption* survives when a component, principal, timing, or trust direction changes. AI-connected systems add natural-language input as a new route into conventional privileged APIs; inspect the tool and identity boundary, not just the prompt.

              ### Architectural layers · Frontiers

              | Layer | L1 · Notice | L2 · Connect | L3 · Transpose |
              | --- | --- | --- | --- |
              | Component boundary | Identify two components handling one input. | Compare their assumptions, identities, and representations. | What new meaning appears only when they are chained? |
              | Protocol boundary | Find an upgrade, downgrade, adapter, proxy, or translation. | Compare framing, canonicalization, and error semantics. | Can a message be valid to one peer and dangerous to another? |
              | Principal boundary | Map user, tenant, service, device, agent, and operator. | Follow who delegates to whom and with which credentials. | Can a low-trust principal induce an action by a stronger one? |
              | Storage boundary | Compare cache, database, object store, index, export. | Identify key, ACL, retention, and serialization mismatch. | Is deleted or private information still exposed by a derivative? |
              | Time boundary | Find scheduler, retry, callback, eventual consistency. | Compare validation and later use states. | Can permission or ownership change between them? |
              | Execution boundary | Find sandbox, process, container, host, CI runner. | Identify the host-side functions that cross it. | Does a safe sandbox expose a trusted file or tool transfer escape hatch? |
              | Human/agent boundary | List untrusted prompts, retrieved content, and callable tools. | Map credentials and the final API guard. | Does natural language become an unintended capability? |
              | Device/browser boundary | Inspect extension, webview, localhost server, deep link. | Compare origin policy, IPC auth, and native privileges. | What changes when remote pages can influence local processes? |
              | Release boundary | Trace dev, build, signing, registry, install, update. | Compare artifact provenance and authority at each hop. | Which build-time input quietly becomes production execution? |
              | Research boundary | Find a known published mechanism. | Remove product-specific details, keep the invariant. | Where is that invariant newly fragile because the architecture changed? |

              ### Architecture seam bank · Frontiers

              | Architecture / shift | The fragile assumption to question |
              | --- | --- |
              | CDN → reverse proxy → origin | Who decides canonical path, method, scheme, host, request length, and cache key? |
              | HTTP/2 or HTTP/3 → HTTP/1 translation | Does a frame/body/request mean exactly the same thing after downgrade? |
              | OAuth / OIDC federation | Are issuer, audience, redirect target, session binding, and client identity independently validated? |
              | SAML / XML signatures | Does the verified element equal the element from which identity is extracted? |
              | Multi-tenant SaaS | Is tenant identity carried through joins, exports, analytics, queues, and search indexes? |
              | GraphQL and subscriptions | Does authorization cover each resolver, nested edge, and long-lived update stream? |
              | WebSocket / SSE sessions | Is a connection's authority reconsidered after role changes or token expiry? |
              | Edge workers and durable state | Can replicas, caches, or eventual-consistency reads resurrect revoked permission? |
              | Queue → worker | Does the worker re-evaluate authorization, or trust historical queue metadata forever? |
              | Webhooks and event bridges | Are source authenticity, event type, replay, and side-effect idempotency independent? |
              | Background reports and exports | Can broad service credentials expose records a requester could not fetch directly? |
              | Object storage and signed URLs | Do key prefixes, expiry, method, content type, and owner have consistent meaning? |
              | Upload → preview / scan / transcode | Can post-processing encounter active content or filesystem paths absent from the original ingress? |
              | Archive / package extraction | Do path normalization and symlinks change the destination after checks? |
              | Search / ORM / vector index | Can filter expressions reveal hidden rows, associations, rankings, or metadata? |
              | Client-side routing → API | Are browser path/string assumptions reused as server authorization? |
              | Native desktop app → localhost bridge | Does the local server independently authenticate callers or trust its UI? |
              | Mobile deep link → privileged activity | Can external origin-controlled data invoke account-bound native operations? |
              | Plugin and extension ecosystem | Are plugin permissions, provenance, tool naming, and upgrades bound to what was reviewed? |
              | CI → artifact → release | Can untrusted repository events, dependencies, or build scripts influence signing and publishing? |
              | Container sandbox → host helper | Which copying, logging, networking, and file paths can a sandbox task ask the host to perform? |
              | API compatibility adapter | Is an old default, `null` interpretation, or fallback still accepted without its original guard? |
              | Multi-region replication | Can ownership, deletion, or revocation race against stale readers or asynchronous cleanup? |
              | Rate limiting / billable APIs | Is the cheaply accepted request expensive after nested parsing, fan-out, or retries? |
              | Error / telemetry pipeline | Can logs, debug traces, alerts, or exceptions cross principal or secret boundaries? |
              | Cryptographic wrapper | Is the intended nonce, key separation, tag, or canonical byte string preserved by every binding? |
              | Config-as-code and policy-as-code | Do generated and runtime policies grant the same authority across environments? |

              ### AI-adjacent boundary bank · Frontiers

              | Surface | What makes it interesting | Generating question |
              | --- | --- | --- |
              | Retrieved pages and RAG | Untrusted prose enters planning context. | Can a retrieved instruction be mistaken for an authorized user request? |
              | Tool response content | A nominally factual tool result can address the agent. | Is a tool's output able to change plans or permissions unrelated to its data? |
              | MCP tool descriptions | Tool metadata tells the model when and how to act. | Could a newly installed or updated tool claim authority it never earned? |
              | MCP token passthrough | Credential audiences and downstream identities may differ. | Are incoming tokens explicitly issued for this resource rather than another API? |
              | MCP local Inspector / dev proxies | Local testing helpers sometimes wrap process execution. | Who can reach the local proxy and invoke its privileged methods? |
              | Delegated service identity | The agent may have broad scopes to “help” the user. | What operation can it perform that the requesting actor could not? |
              | Tool schema coercion | Natural-language choices become typed parameters. | Which parameters are treated as trusted just because they are structured? |
              | Sandbox ↔ host file transfer | A safe execution area may have a privileged import/export helper. | Can the agent select host-side paths rather than only sandbox paths? |
              | Code interpreter / shell tool | The model's suggestion reaches OS processes. | Which checks are independent of the model's instruction compliance? |
              | Agent-readable repo instructions | A PR, README, issue, or dependency can contain role-like prose. | Can attacker-controlled project text influence a coding agent's privileged step? |
              | AI in CI/CD | Event messages become agent prompts inside runners. | What untrusted event data is combined with repository write or secret permissions? |
              | Long-term agent memory | Summaries and learned facts outlive a source session. | Can a one-time untrusted input be promoted into a persistent instruction? |
              | Agent-to-agent delegation | One agent may summarize untrusted text for another. | Is the original trust label lost during handoff or compaction? |
              | Retrieval indexing / vector filter | “Search” systems may evaluate expressions or expose metadata. | Can a model-selected filter query reach an interpreter or cross-tenant index? |
              | Summarization → action | An assistant may summarize then call email, calendar, or CRM APIs. | Where is a source document promoted from evidence into authorization? |
              | Dynamic tool registry | Available tools change across versions or sessions. | Is consent bound to the precise tool identity, permissions, and implementation? |
              | Browser agents | Page text, pixels, links, and focus state are model input. | Can a page influence higher-privilege actions outside its browser origin? |
              | OCR / transcription / multimodal input | Hidden or incidental content can be interpreted as text instructions. | Does the system preserve where an instruction came from? |
              | Content filters as sole defense | Model refusals cannot enforce resource isolation. | Is the forbidden action impossible at the final API even if the model requests it? |
              | Context truncation / compaction | Critical constraints may leave the active context. | Do tool-side permissions survive irrespective of context-window state? |
              | Agent-side package installation | Suggested dependencies cross into build-time code. | Who vets provenance and install hooks before an agent executes them? |
              | Model-generated code / queries | Generated syntax may be used as policy or executed expressions. | Does the destination parser enforce a narrower capability than the model can express? |
              | Continuous agents and schedules | Authority and goals persist as external state changes. | Will a deferred action recheck scope, access, and owner intent? |
              | Shared agent workspaces | Files, sessions, embeddings, and tool outputs mix. | Can one project, principal, or tenant plant data seen by another? |
              | AI-derived remediation | An auto-fix may only block one visible payload. | Did the patch enforce an invariant or merely appease the current detector? |
              | AI usage / inference quotas | Tasks can amplify expensive tool calls and nested model work. | Are costs and concurrency bounded per principal at the executor? |

