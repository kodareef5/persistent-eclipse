                | Public artifact | What it might tell you | Better question than “is this vulnerable?” |
                | --- | --- | --- |
                | Closed, unmerged security hardening PR | A protection was considered but not integrated; reasons may be sound. | Which exact threat was rejected, and does today's architecture change that reasoning? |
                | PR marked “too breaking” | Compatibility blocked a stricter interpretation or authorization rule. | Which mode still accepts ambiguous or legacy inputs? |
                | Review thread asking “what about X?” | A reviewer named a branch the final patch may or may not cover. | Did the code or tests resolve **that** objection? |
                | A comment saying “callers must validate” | Validation was deliberately pushed out of a helper. | Enumerate callers: do they enforce the same contract? |
                | “Security fix” PR with a single added test | The test reveals a decisive precondition, not necessarily the whole bug class. | Which neighboring state or representation is absent from the test? |
                | Refactor PR with hundreds of unrelated changes | Equivalent behavior is hard to review when code moves and changes simultaneously. | Which new invariant was smuggled in as a supposedly mechanical edit? |
                | PR to replace a native parser with a binding | Threat moves from one parser and ABI to another. | Does the wrapper keep length, ownership, and error contracts intact? |
                | “Only affects Windows” or “only in CI” comment | Platform-specific runtime details alter the safety model. | What other platform or deployment reproduces the necessary condition? |
                | Feature request blocked on auth design | A missing permission model can be visible before the feature ships. | Did the eventual implementation resolve or postpone the question? |
                | “This is a dependency bug” closure | The vulnerable assumption may live at the package boundary. | Does the caller constrain its dependency, or trust an unsupported behavior? |
                | Stale PR with an almost-finished fix | The attempted repair documents a suspected invariant. | Is the concern still real on the pinned head, or now irrelevant? |
                | Backport bot PR with conflict resolutions | Mechanical application of patches can alter important context. | Was the original guard adapted to the old branch's call graph? |
                | Generated-code PR with no generated diff | Commit review may not show what will run after code generation. | What does the released artifact actually contain? |
                | Lockfile-only PR | Transitive versions change without a visible source diff. | Which parser, plugin, or lifecycle hook changed behavior underneath the application? |
                | Security-related test marked flaky or skipped | A critical state may be hard to reproduce or low-frequency. | What condition is skipped, and does the production path still exercise it? |
                | Maintainer discussion about trusted proxy headers | Security may rely on topology, not on the application alone. | Which deployment configuration is actually supported and enforced? |
                | Fix to one sibling implementation | Another language binding, CLI, or worker path may remain inconsistent. | Which sibling implements the same semantic contract independently? |
                | Review of unfamiliar third-party contributions | An innocuous change can have downstream release consequences. | What changed in the build or packaging boundary? [libarchive PR 1609](https://github.com/libarchive/libarchive/pull/1609), [subsequent revert PR 2101](https://github.com/libarchive/libarchive/pull/2101) |
                | Issue closed as “won't fix” | The maintainer may have accepted a limited threat model. | Does that limitation still match the documented supported deployment? |
                | PR fixes a symptom, not the data model | State is patched near one consumer instead of at its origin. | Which other consumer still interprets the old state? |

                **Useful public places:** repository [Pull requests](https://docs.github.com/en/pull-requests) and [Issues](https://docs.github.com/en/issues), [ecosyste.ms issue/PR index](https://issues.ecosyste.ms/), downstream distro patch series on [lore.kernel.org](https://lore.kernel.org/), linked GHSA fix references. A PR thread is evidence of *discussion*, not of an exploitable present-day defect.
              code.seams.md: |
                ### Trust-boundary seams · Code

                | Seam | Source clue | Generating question |
                | --- | --- | --- |
                | Actor versus object | IDs from request bodies, routes, jobs | Is access checked against the *resolved object*, not merely the caller's role? |
                | Tenant versus shared cache | Cache keys omit account, policy, or locale | Can a response computed for one principal be reused for another? |
                | OAuth audience | Token checked for signature and expiry | Is the token issued for this exact resource, tenant, and operation? |
                | Identity propagation | `userId` copied into async jobs, webhook contexts | Is the original actor still valid when the worker executes? |
                | Parser versus validator | Decode, normalize, or coerce after approval | Can two consumers disagree on paths, headers, types, or duplicate fields? |
                | Signature versus meaning | Signed object parsed twice or transformed | Does the verifier authorize the *same* object the business logic acts upon? |
                | URL versus destination | Redirect, DNS, or proxy resolution after URL check | Which resolved host and address will actually be contacted? |
                | Path versus filesystem | Join, canonicalize, symlink, unzip, rename | Does the effective filesystem target stay inside the intended root? |
                | Upload versus derivative | Thumbnail, preview, OCR, conversion, transcoding | Is a supposedly inert upload parsed again with stronger privileges? |
                | Input versus interpreter | Query-builder, template, `eval`, `exec`, shell glue | Where does data become a program or a privileged expression? |
                | Structured versus raw | Header/string construction, CSV, XML, JSON, YAML | Is escaping performed for the *next* parser, not the previous one? |
                | Proxy versus origin | Route, content length, hostname, scheme | Do intermediaries and origin agree on the request's identity and boundaries? |
                | Cache key versus content | Path, query, header, status, `Vary` | Which content variants collapse into one reusable cache entry? |
                | Sync versus async | Background queue, retry, fan-out, webhook | Did authorization bind to the enqueue event rather than the eventual action? |
                | Retry versus uniqueness | Idempotency keys, dedup tables, partial writes | Can a failure or duplicate cause a one-time operation to happen twice? |
                | Revocation versus persistence | Tokens, sessions, signed URLs, persistent jobs | Which retained capability still functions after its owner loses access? |
                | Quota versus resource | Expansion loops, decompression, nested structures | Does a small accepted input consume unbounded shared work? |
                | Status versus side effect | Error handlers, aborts, transaction boundaries | Can the action succeed before the request is reported as failed? |
                | Validation versus mutable state | File swapped, object updated, cache refreshed | Can the subject change between inspection and use? |
                | Confused helper | Admin CLI exposed via web, daemon, local bridge | Does a weakly authenticated interface wrap a privileged helper? |
                | Secrets versus telemetry | Error bodies, logs, traces, task outputs | Can sensitive values cross into a lower-trust audience through diagnostics? |
                | Ownership versus lifetime | Callbacks, async closures, reference counting | Can a still-reachable object outlive the validity of its data or policy? |
                | Safe wrapper versus native | FFI, extensions, codecs, database drivers | Does the wrapper's input contract survive its native-language boundary? |
                | Isolation versus restore | Export/import, backup, snapshot, migration | Does rebuilding state bypass the checks used for normal writes? |
                | Package versus execution | Install hooks, builds, plugins, updates | Which supposedly passive input is actually executed at install or load time? |
                | Browser versus local host | Webviews, deep links, localhost RPC, extensions | Is the caller authenticated where the privileged local action is received? |
                | Search versus visibility | ORM joins, filters, ranking, full-text indexes | Can an authorized query reveal facts about inaccessible records? |
                | Internal versus external flags | `debug`, `internal`, `trusted`, forwarded headers | Who can make the application believe a request is internal? |
              code.variants.md: |
                ### Variant and inversion moves · Code

                | Move | Turn one candidate into a better question |
                | --- | --- |
                | Same sink, new source | What other ingress path reaches this operation? |
                | Same source, new sink | Where else is this partially trusted value consumed? |
                | Parallel implementation | Is there a CLI, RPC, batch, admin, mobile, or worker version of the same operation? |
                | Sibling package | Did a fork, binding, port, or vendored copy inherit the flawed assumption? |
                | Same protocol, other parser | Compare producer/consumer behavior across languages and versions. |
                | Invert direction | If upload is constrained, what about download, sync, export, or restore? |
                | Invert principal | Does the same code behave differently for owner, collaborator, guest, service, or revoked user? |
                | Invert lifecycle | Does create differ from update, clone, transfer, deletion, or recovery? |
                | Change timing | Could a queued, replayed, resumed, or raced action see different authorization? |
                | Change error mode | What happens on timeout, malformed-but-accepted input, partial success, and retry? |
                | Remove middle layer | What assumption depends on a CDN, gateway, browser, or proxy that might be absent? |
                | Add middle layer | Can two correct components disagree when composed? |
                | Change representation | Test the *idea* under alternate encodings, normalization, serialization, or path schemes. |
                | Compose benign effects | Can two independently permissible operations cross a boundary in sequence? |
                | Minimize the claim | Which single actor, resource, and security decision would establish actual impact? |
              ecosystem.community.md: |
                ### Public side streets, archives, and specialist hangouts · Ecosystem

                | Corner to read | Who / what shows up | Inspiration to bring back |
                | --- | --- | --- |
                | [Phrack issue archive](https://archives.phrack.org/issues/) | Decades of low-level exploit and system-internals writing. | What old boundary or trick disappeared from fashion but not from software? |
                | [PoC or GTFO archive](https://pocorgtfo.reilly.io/) | Weird machines, bizarre file formats, reproducible demonstrations. | Can a “harmless” artifact have two valid meanings? |
                | [Corkami docs](https://github.com/corkami/docs) | Byte-level oddities, executable formats, PDF tricks, packers. | Which assumption about a file header or layout is too simple? |
                | [USENIX WOOT](https://www.usenix.org/conference/woot26) | Peer-reviewed offensive research and open proceedings. | Which technique is demonstrated in a controlled model but unexplored in an adjacent product? |
                | [OffensiveCon archive](https://www.offensivecon.org/) | Advanced exploitation and reverse-engineering talks; see the Archive navigation. | What uncommon primitive, compiler behavior, or target class suggests a new seam? |
                | [CCC talk archive](https://media.ccc.de/) | Hardware, protocols, privacy, retrocomputing, protocol research. | Which supposedly settled interface has surprising historical behavior? |
                | [CTFtime writeups](https://ctftime.org/writeups) | Challenge authors and solvers publish clever constraint bypasses. | Which trick transfers to real code **only after** checking the missing assumptions? |
                | [r/netsec](https://www.reddit.com/r/netsec/) | Curated disclosures and technical writeups with comments. | What did the community question about the claimed preconditions? |
                | [r/ReverseEngineering](https://www.reddit.com/r/ReverseEngineering/) | Binary research, tool internals, firmware, reversing writeups. | Where does the shipped binary tell a different story than source? |
                | [Lobsters / security](https://lobste.rs/t/security) | Practitioner-heavy technical links and threaded disagreement. | Which rebuttal or follow-up is more useful than the headline? |
                | [oss-security](https://www.openwall.com/lists/oss-security/) | Original OSS disclosures, rebuttals, affected-version debates. | Was the public exploit description narrower than the root cause? |
                | [SecLists archives](https://seclists.org/) | Full Disclosure, legacy Bugtraq, tool-development lists, RSS. | Which old patch/discussion exposes a still-relevant platform quirk? |
                | [Linux kernel mailing-list archive](https://lore.kernel.org/lkml/) | Patch reviews, ABI contracts, hardening debates; access may vary. | Which safety rule exists only as an argument in a review thread? |
                | [GitHub Issues and Discussions](https://github.com/features/issues) | Maintainer design decisions, platform-specific bug reports, proposed fixes. | What unfinished feature or closed “won't fix” changes the threat model? |
                | [ecosyste.ms issues](https://issues.ecosyste.ms/) | Cross-forge issue and PR metadata. | Which symptom appears independently in two related projects? |
                | [OSS-Fuzz project issues](https://github.com/google/oss-fuzz/issues) | Public fuzz harness and coverage problems, project setup discussions. | Which complex parser mode has coverage in name only? |
                | [Google Project Zero RCA corpus](https://googleprojectzero.github.io/0days-in-the-wild/) | Root causes, timeline, variant context for exploited bugs. | What earlier patch made the bug class look closed? |
                | [ZDI research and advisories](https://www.zerodayinitiative.com/) | Vendor-independent disclosures, contest research, patch analysis. | Which arbitrary file or object primitive becomes dangerous under a privileged service? |
                | [GitHub Security Lab archive](https://securitylab.github.com/research-archive/) | Source-backed multi-project investigations, CodeQL writeups. | Does a framework-specific model reveal variants no generic check can see? |
                | [HackerOne public Hacktivity](https://hackerone.com/hacktivity) | Disclosed bounty reports with preconditions and triage context. | What crossed-principal consequence separated a real issue from a self-only bug? |
                | [Pentester Land writeups directory](https://pentester.land/) | Handpicked bug bounty and coordinated-disclosure articles. | Which one unusual application behavior defeated the usual recipe? |
                | [PortSwigger Research](https://portswigger.net/research) | New protocol, parser, browser, cache, and data-model techniques. | Which research lineage has more variants than its best-known payload? |
                | [PayloadsAllTheThings](https://github.com/swisskyrepo/PayloadsAllTheThings) | Broad public catalog of edge cases and test concepts. | What *semantic* behavior is behind a bypass, not just what string worked? |
                | [OpenSSF malicious packages](https://github.com/ossf/malicious-packages) | Public package incident datasets and taxonomy debates. | What is the actual publisher, installer, or manifest trust boundary? |
                | [OpenSSF package analysis](https://github.com/ossf/package-analysis) | Public package behavior-analysis work and case studies. | Did a package's behavior change in a way the source diff hides? |

                These are public research communities and archives—not invitations to access private channels, stolen data, or systems outside the mission. Historic writeups and contest puzzles are **idea generators**; modern reachability must be established in actual code.
              ecosystem.dependencies.md: |
                ### Dependency, distribution, and supply-chain lenses · Ecosystem

                | L1 · Trace | L2 · Difference to notice | L3 · Strange question | Source shelf |
                | --- | --- | --- | --- |
                | Direct dependency | Why the app imports it and which entrypoints are used. | Does the app actually reach the vulnerable function or only carry its version? | [deps.dev](https://deps.dev/) |
                | Transitive dependency | A risky package enters through multiple parents or feature groups. | Does one parent supply the guard that another omits? | [Open Source Insights documentation](https://docs.deps.dev/) |
                | Reverse dependents | A small library underpins many unrelated products. | Which integration uses it in the least expected privilege context? | [packages.ecosyste.ms](https://packages.ecosyste.ms/) |
                | Dependency version swap | Minor upgrades change parsers, exceptions, and defaults. | Which old caller contract was never revisited? | [deps.dev](https://deps.dev/) |
                | Public/private registry preference | Same logical name may resolve from more than one registry. | Is the resolution policy unambiguous in every CI and production installer? | [Dependency confusion research](https://medium.com/@alex.birsan/dependency-confusion-how-i-hacked-into-apple-microsoft-and-dozens-of-other-companies-4a5d60fec610) |
                | Install-time script | Code executes when building or installing rather than when imported. | Does the team's code review include the package's installation lifecycle? | [OpenSSF Package Analysis](https://github.com/ossf/package-analysis) |
                | Vendored library copy | Upstream patch and local fork can drift silently. | Which bug was fixed in upstream but reappears in an edited copy? | [GitHub code search](https://github.com/features/code-search) |
                | Registry archive versus Git tag | Published files may include extra or missing generated code. | What was *shipped*, not merely committed? | [xz original disclosure](https://openwall.com/lists/oss-security/2024/03/29/4) |
                | Platform-specific optional dependency | Installed only on one OS, CPU, feature, or container image. | Does the rarely used path have an entirely different input contract? | [deps.dev](https://deps.dev/) |
                | Package maintainer transfer | Publisher identity or release tooling changes without code changes. | What evidence ties the new artifact to the expected source and maintainer? | [OpenSSF malicious packages](https://github.com/ossf/malicious-packages) |
                | Malicious package report | An observed ecosystem tactic has an attributable artifact. | Which *trust assumption* failed, beyond the package name itself? | [OpenSSF malicious packages](https://github.com/ossf/malicious-packages) |
                | Lockfile and resolver behavior | Same manifest can resolve different graph under differing tooling. | Which dependency is actually installed in the deployment under review? | [Open Source Insights](https://deps.dev/) |
                | Container base image | OS libraries and loaders differ from application lockfiles. | Does a patched app still ship an affected native library or helper? | [OSV](https://osv.dev/) |
                | Copy of reference crypto code | Algorithms may match but parameters, key IDs, and bytes differ. | Did a wrapper preserve domain separation and exact signed representation? | [GitHub Security Lab archive](https://securitylab.github.com/research-archive/) |
                | Code generator/runtime pair | Generated clients may be built with different version or template. | Do the generated objects enforce the server's updated protocol assumptions? | [MCP SDK siblings](https://github.com/modelcontextprotocol) |
                | Dependency test corpus | Tests may exercise only tiny grammar slices or happy states. | What input shape is valid but never reaches the interesting code? | [Google structure-aware fuzzing](https://github.com/google/fuzzing/blob/master/docs/structure-aware-fuzzing.md) |
                | Advisory version ranges | Multiple ecosystems describe affected ranges differently. | Which exact pinned commit was fixed and what *call path* was affected? | [OSV data](https://google.github.io/osv.dev/data/) |
                | Release CI signing and publishing | Source, build job, provenance record, and registry upload have different principals. | Which one can replace the artifact after review? | [OpenSSF Package Analysis](https://github.com/ossf/package-analysis) |
                | Popularity / blast radius | One small dependency can reach many applications through a framework. | Does an unusual downstream use turn a modest defect into a stronger boundary crossing? | [ecosyste.ms](https://packages.ecosyste.ms/) |
                | Dependency issue or stalled fix | Upstream maintainer knows an edge but chose not to change semantics. | Does the application unknowingly assume the behavior was repaired? | [ecosyste.ms issues](https://issues.ecosyste.ms/) |

                A dependency advisory is a lead. The dependency's **reachability, configuration, affected revision, and actual caller semantics** decide whether it matters.
              ecosystem.examples.md: |
                ### Public-to-source inspiration · Ecosystem

                | Public artifact | What it actually shows | Transfer question |
                | --- | --- | --- |
                | [PortSwigger 2025 annual selections](https://portswigger.net/research/top-10-web-hacking-techniques-of-2025) | Multiple original research lines revolve around parser disagreement, caches, normalization, ORM query behavior, and side channels. | What *new* component boundary creates the same discrepancy? |
                | [Google Project Zero RCA template](https://googleprojectzero.github.io/0days-in-the-wild/0day-RCAs/template.html) | Explicit slots for introducing commits, exploit flows, nearby variants, and structural fixes. | Which introducing decision survives elsewhere after the public fix? |
                | [Microsoft GRUB2/U-Boot/Barebox analysis](https://www.microsoft.com/en-us/security/blog/2025/03/31/analyzing-open-source-bootloaders-finding-vulnerabilities-faster-with-ai/) | AI-aided code similarity helped expand one parser investigation to other bootloaders. | Does this project's dependency graph include a copied or reimplemented parser? |
                | [GitHub Advisory DB](https://github.com/github/advisory-database) + [OSV](https://google.github.io/osv.dev/data/) | Records package scopes and often links commits, but does not establish actual usage in every product. | What exact deployed/imported revision matters here? |
                | [HackerOne Hacktivity](https://hackerone.com/hacktivity) | Publicly disclosed reports can reveal unexpected prerequisite chains. | Which prerequisite can be reached by a harmless-looking adjacent feature? |
                | [OSS-Fuzz](https://github.com/google/oss-fuzz) + [Google's AI-target study](https://security.googleblog.com/2024/11/leveling-up-fuzzing-finding-more.html) | Different harnesses discover different states even for heavily fuzzed APIs. | Which input format or configuration flag isn't covered by existing tests? |
                | [MCP Inspector GHSA-7f8r-222p-6f5g](https://github.com/advisories/GHSA-7f8r-222p-6f5g) | Historical, patched flaw in authentication between Inspector client and its proxy (fixed in 0.14.1). | Which local/dev helper relies on “only the UI calls this” instead of enforcing caller identity? |
              ecosystem.layers.md: |
                ### Public-research layers · Ecosystem

                | Layer | L1 · Notice | L2 · Connect | L3 · Invent |
                | --- | --- | --- | --- |
                | Advisories | Find an affected component and fixed version. | Read its actual patch and threat model. | Search for equivalent code or a missing invariant outside the fixed path. |
                | Releases | Find behavior changes and newly supported modes. | Compare docs, tests, migration notes, defaults. | What new trust boundary did the feature quietly introduce? |
                | Discussion | Look for repeated maintainer or user complaints. | Tie the symptom to source and configuration. | Could a reliability edge case also break security under another principal? |
                | Community | Find disclosed reports and research writeups. | Extract the minimal root cause, not the payload. | Transpose it to a different stack where the same assumption exists. |
                | Dependencies | Map libraries, bindings, forks, and consumers. | Compare patched and unpatched release trains. | Does the upstream fix leave a different consumer-side hole? |
                | History | Look at TODOs, security fixes, reversions, regressions. | Locate the exact code era and compatibility constraints. | Which invariant kept changing because nobody owned it end to end? |
                | Research trends | Read conference, academy, and specialist collections. | Cluster recurring mechanisms across products. | Where has a newly popular architecture recreated an old boundary mistake? |
                | AI adoption | Notice new agents, plugins, CI assistants, MCP bridges. | Identify permissions, tool arguments, credentials, and data sources. | Can untrusted content influence a privileged action the tool itself should reject? |
                | Priority | Identify popular or exposed components from public facts. | Distinguish reachability, dependents, and maintenance signals. | Where might a narrow root cause generalize without assuming every user is vulnerable? |
              ecosystem.neighbors.md: |
                ### Related projects and commercial neighbors · Ecosystem

                | Relationship to the target | Where to look | Transferable question |
                | --- | --- | --- |
                | Direct competitor | A differently implemented product with the same promise. | What security invariant must **both** solve, and which design avoids it entirely? |
                | Open-core / enterprise counterpart | Public OSS code, edition flags, premium plugin interfaces, docs. | What crosses from unprivileged community code into paid administrative capability? |
                | Historically related fork | [Valkey](https://github.com/valkey-io/valkey) and [Redis](https://github.com/redis/redis) are a concrete fork lineage. | How do diverging changes alter protocol, persistence, and client assumptions? Not an allegation about either project. |
                | Specification siblings | [MCP Python SDK](https://github.com/modelcontextprotocol/python-sdk) and [TypeScript SDK](https://github.com/modelcontextprotocol/typescript-sdk). | Does the same normative requirement have identical failure and auth semantics across languages? |
                | Reverse-proxy alternatives | [Envoy](https://github.com/envoyproxy/envoy), [Traefik](https://github.com/traefik/traefik), [Caddy](https://github.com/caddyserver/caddy). | Which forwarded-header, routing, URL, or protocol rule differs among peers? |
                | Auth-provider alternatives | [Keycloak](https://github.com/keycloak/keycloak), [ZITADEL](https://github.com/zitadel/zitadel). | How is tenant scoping, audience, session invalidation, and delegated identity represented differently? |
                | Hosted service versus self-host edition | Deployment manifests, SaaS docs, image entrypoints, upgrade guidance. | What assumption is provided by the cloud edge but absent in self-hosting? |
                | Backend library versus language wrapper | Native library plus Python/Ruby/JS bindings. | Can a safe public API call a native entry with a weaker lifetime or length contract? |
                | CLI versus HTTP/API server | Shared business helpers reached through different front doors. | Do CLI privileges inadvertently flow into server-exposed helpers? |
                | Official SDK versus third-party SDK | Client construction, retry logic, signing, pagination, OAuth renewal. | Does the third-party binding reimplement validation or trust tokens differently? |
                | Plugin/extension marketplace | Public extension repos, examples, loaders, permissions, update metadata. | Who actually controls executable code loaded into the trusted host? |
                | Vendor appliance versus upstream OSS | Firmware, distro patches, vendor forks, packaged third-party components. | Which upstream fix or build option was lost in the shipped variant? |
                | Container image versus source repository | Dockerfile, image entrypoint, installed system packages, bundled binaries. | Is the deployed execution graph the one a source reviewer expects? |
                | Cloud operator versus emulator | Local test environments, emulators, compatibility shims. | Is a security decision simulated locally but implemented differently in production? |
                | Replacement project after license split | Migration/compatibility docs and import/export adapters. | Which old behavior is explicitly preserved even when the security architecture changed? |
                | Shared protocol, distinct transport | HTTP, WebSocket, SSE, stdio, message bus, RPC variants. | Are identity, framing, and errors invariant under transport swaps? |
                | Same component in a different business product | Search [source symbol](https://github.com/features/code-search) or [ecosystem dependents](https://deps.dev/). | Does the host product trust a helper more than the original library intended? |
                | Merchant integrations and paid connectors | Billing, CRM, identity, messaging, payments, admin exports. | Which connector acts with service-wide power on user-controlled records? |
                | Reference implementation versus rewrite | Specs, compliance suites, migration notes, deprecation logs. | What edge behavior was copied intentionally, and what assumption was accidentally omitted? |
                | Public competitor's security fix | Fix diff, postmortem, tests, release notes. | Can the *mechanism* transfer to another implementation without sharing code? |

                Related does **not** mean vulnerable. Cross-project comparison is especially useful for discovering *missing questions*, not asserting parity of bugs.
              ecosystem.newsletters.md: |
                ### Ongoing reading: newsletters and live research feeds · Ecosystem

                | Source | Rhythm / emphasis | Read it for | Turn a story into this question |
                | --- | --- | --- | --- |
                | [tl;dr sec](https://tldrsec.com/t/Newsletter) | Weekly; curated AppSec, cloud, tools, research, agent security. | Underappreciated technical papers and tools. | Which linked *primary source* documents a reusable failure mechanism? |
                | [CloudSecList](https://cloudseclist.com/) | Weekly; cloud-native plus AI intersection. | Cloud IAM, infrastructure changes, design pitfalls. | Which new cloud feature changes an old permission or isolation boundary? |
                | [Intigriti Bug Bytes](https://www.intigriti.com/researchers/blog/bug-bytes) | Monthly; bug-bounty writeups, research, tool releases. | Practical, disclosed cases with strange preconditions. | What was the one nonobvious transition that made the bug work? |
                | [Risky Bulletin](https://risky.biz/newsletters/) | Frequent; incidents, vulnerabilities, research, policy. | Early signals and incident threads to follow to original disclosures. | What architectural mistake does the incident imply, and which detail remains unverified? |
                | [SANS @RISK](https://www.sans.org/newsletters) | Weekly; new flaws and attack vectors. | Technical summaries of recent classes. | What other component implements the same vulnerable rule? |
                | [SANS NewsBites](https://www.sans.org/newsletters/newsbites) | Semiweekly; expert-annotated news. | Context and disagreement about high-profile incidents. | What would an experienced maintainer say limits this claim? |
                | [Vulnerable U](https://www.vulnu.com/t/newsletter) | Weekly; practitioner roundup. | Interesting incident oddities and new research links. | What is unusual about the object, workflow, or environment in this story? |
                | [Last Week in AWS](https://www.lastweekinaws.com/newsletter/) | Weekly; AWS feature, service, and product shifts. | Non-security release changes that move auth, networking, and metadata assumptions. | What security property could change even though the announcement isn't about security? |
                | [Krebs on Security](https://krebsonsecurity.com/) | Investigative stories as published. | Supply-chain, account, operational, and identity narratives. | Which product assumption failed before the incident became visible? |
                | [The Record](https://therecord.media/) | Ongoing cyber reporting. | Attribution context, incident timelines, and vendor responses. | What technical source or advisory can confirm the asserted mechanism? |
                | [ZDI RSS](https://www.zerodayinitiative.com/rss/) | Advisory and research feeds. | Public vulnerability patterns and unusual vendor software. | Which reported primitive has a parallel in an open component? |
                | [oss-security archive](https://www.openwall.com/lists/oss-security/) | Disclosures and follow-up threads as published. | Precise version ranges, maintainer correction, variant discussions. | Did follow-up replies materially narrow or expand the original claim? |
                | [SecLists / RSS](https://seclists.org/) | Ongoing public mailing-list mirrors. | Niche vulnerabilities and older technical context. | Is an old edge case still alive in a compatibility layer? |
                | [GitHub Security Lab](https://securitylab.github.com/research/) | Research articles as published. | CodeQL, source-based bugs, framework-level variants. | Which helper or source/sink is missing from current tools? |
                | [PortSwigger research archive](https://portswigger.net/research) | Individual papers and annual technique rankings. | New interpretations of old web/protocol interactions. | Which one of the paper's original assumptions exists in the target's architecture? |
                | [Project Zero research](https://projectzero.google/) | Technical posts and RCA case studies. | Root causes, exploit constraints, failed mitigations. | Why did nearby fixes fail to eliminate the class? |

                Cadence is a guide, not a promise; publication schedules and links can change. **Don't ingest a headline as a finding**: follow the original advisory, patch, issue, or researcher writeup before carrying an idea into the lab.
              ecosystem.searches.md: |
                ### Query seeds · Ecosystem

                | Lens | Public search or code-search seed | What to extract |
                | --- | --- | --- |
                | Security-sensitive history | `repo:OWNER/REPO "authorization"` | Relevant call paths and dates; inspect source. |
                | Owner checks | `repo:OWNER/REPO "tenantId"` | Where IDs are derived versus accepted from callers. |
                | Trust assertions | `repo:OWNER/REPO "trusted"` | Which code asserts a boundary, and on what basis. |
                | Dangerous repair TODOs | `repo:OWNER/REPO "TODO" "validate"` | Comments near source, not proof of exploitability. |
                | Workflow agents | `repo:OWNER/REPO path:.github/workflows "pull_request_target"` | Event permissions and untrusted text crossing into tools. |
                | Native seams | `repo:OWNER/REPO "unsafe"` | Caller invariants and external data reaching the block. |
                | Shared helper usage | `"FUNCTION_OR_SYMBOL" "PACKAGE_OR_FRAMEWORK"` | External wrappers, forks, and alternate callers. |
                | Fix archaeology | `"PACKAGE" "security" "backport"` | Patch provenance and alternate stable branches. |
                | Ecosystem variants | `"LIBRARY" "parser" "normalization"` | Competing parsing and validation semantics. |
                | Release seams | `"FRAMEWORK" "cache" "regression"` | Changed caching contracts and error behavior. |
                | Community disclosure | `"PRODUCT" "disclosed" "authorization"` | Public reports with real actor/impact conditions. |
                | Agent adoption | `"FRAMEWORK" "MCP" "security" "tools"` | New delegated actions and credentials. |
                | Cross-language equivalent | `"PROTOCOL" "implementation" "incompatible"` | Known parser or state differences to test locally. |
                | Official spec tension | `"PROTOCOL" "MUST NOT" "compatibility"` | Where normative requirements meet legacy support. |


                | PR arguments | `repo:OWNER/REPO is:pr is:closed "authorization"` | Review dissent, guard placement, and final patch fate. |
                | Unmerged fixes | `repo:OWNER/REPO is:pr is:closed "security"` | Candidate defenses that did not ship; check each PR status. |
                | Maintainer tradeoff | `"PROJECT" "compatibility" "security" "pull request"` | What was deliberately left less strict, and why? |
                | Package graph | `"PACKAGE" "depends on" "LIBRARY"` | Direct, transitive, and reverse dependents; confirm via deps.dev. |
                | Commercial neighbor | `"PRODUCT" "alternative" "self-hosted" "GitHub"` | Find an independent implementation of the same security contract. |
                | Fork ancestry | `"PROJECT" "fork" "security fix"` | Locate diverged release trees and unported repairs. |
                | Release-vs-source | `"PROJECT" "release tarball" "generated"` | Published archive, checksums, and generated-code discrepancies. |
                | Old public discussions | `site:seclists.org "LIBRARY"` | Earlier variants, surprises, or disputed mitigations. |
                | OSS disclosure conversations | `site:openwall.com/lists/oss-security "PACKAGE"` | Original report, follow-ups, affected-version disagreements. |
                | Historic technical tricks | `site:archives.phrack.org "PARSER"` | Out-of-fashion technical ideas to reinterpret against modern designs. |
                | Long-form conference papers | `site:usenix.org/conference/woot "TECHNOLOGY"` | Research assumptions, architecture, and untested extensions. |
                | Cross-language SDKs | `"PROTOCOL" "Python" "TypeScript" "conformance"` | Normative differences between independent implementations. |
                | Modern agent adaptation | `"MCP" "localhost" "auth" "issue"` | Where classic browser/local trust mistakes may resurface. |

                `OWNER/REPO`, `PACKAGE`, etc. are placeholders; some strings target GitHub Code Search, others ordinary web search. Search results are **leads**, not findings. Prefer specific source commits and primary discussion over snippets or AI summaries.
              ecosystem.signals.md: |
                ### OSINT signals without cargo-culting the rumor · Ecosystem

                | Public signal | Why it is interesting | What would ground it |
                | --- | --- | --- |
                | Security fix with a small, vague changelog | Root cause may be clearer in code than prose. | Fixed and parent commits, release tags, regression test. |
                | New authentication-related tests | Someone recently tightened an expected invariant. | Test assertions and all alternate handlers. |
                | A bug fix backported unevenly | Different branches may not share the same implementation. | Compare *each* supported branch, not commit hashes alone. |
                | A fork lagging upstream | Patches, defaults, or build flags may diverge. | Actual fork revision and its exposure or use. |
                | Repeated “works only behind proxy” discussion | The threat model may depend on deployment topology. | Config, trusted headers, route enforcement. |
                | A documentation warning | Maintainers may be describing a real footgun. | Find which API behavior the warning refers to. |
                | A changed default | The secure behavior may be opt-in in older deployments. | Versioned config, default constructor, migration path. |
                | Removed “experimental” label | A feature is entering wider or less reviewed environments. | Public release and any new privilege-bearing integrations. |
                | Frequent auth or serializer refactors | Security assumptions may have moved between layers. | Before/after call graph and error-path equivalence. |
                | A regression reported only in one language binding | Shared protocol may be implemented differently. | Language-specific parser and cross-language conformance tests. |
                | A maintainer disputes exploitability | Environment or actor assumptions may be disputed. | Their concrete counterargument and a source-backed reachability map. |
                | Public discussion of high CPU or memory usage | Resource cost may cross a multi-user boundary. | Reachable input, shared resource, actual limits. |
                | Package copied into multiple ecosystems | A single parser family can produce variants. | Vendored revisions, ported logic, usage contracts. |
                | A “works around” patch rather than invariant fix | The symptom may have been filtered, not removed. | What input equivalence class the filter excludes. |
                | Unfinished TODO near a guard | Deferred logic may be an intentional limitation. | Caller responsibility, tests, current release behavior. |
                | A new webhook, queue, or import path | The same action is now reachable indirectly. | Origin authentication and final action authorization. |
                | AI coding agent newly added to CI | Natural-language PR text may reach privileged tools. | Trigger, prompt construction, token perms, sandbox settings. |
                | MCP server or plugin grows more tools | Delegation surface and scope are changing. | Tool schemas, auth, host helpers, permission gates. |
                | An apparent zero-click claim online | High attention can hide unclear preconditions. | Primary disclosure, affected revision, counterevidence. |
                | High-severity report with no clear affected principal | Some issues are reliability or self-impact only. | Independent principal, violated control, source-visible result. |
              ecosystem.sources.md: |
                ### Source collections and what to mine · Ecosystem

                | Collection | Material worth reading | Good question to carry into code |
                | --- | --- | --- |
                | [GitHub Advisory Database](https://github.com/github/advisory-database) | GHSA records, affected versions, references, fix commits. | What *behavioral invariant* changed in the patch? |
                | [OSV.dev data](https://google.github.io/osv.dev/data/) | Cross-ecosystem advisories, commit/version ranges, recent modifications. | Do sibling packages have different affected ranges or fixes? |
                | [Google security-research](https://github.com/google/security-research) | Public advisories, patches, root-cause material, associated PoCs. | Which named primitive recurs in another subsystem? |
                | [Project Zero RCA template](https://googleprojectzero.github.io/0days-in-the-wild/0day-RCAs/template.html) | Root cause, introducing/fixing commits, variants, exploit flows. | What *introduced* the assumption and where else might it live? |
                | [OSS-Fuzz](https://github.com/google/oss-fuzz) | Fuzzer/project coverage, harnesses, fixed bug writeups. | Which API, mode, or state is underrepresented by current harnesses? |
                | [Trail of Bits skills](https://github.com/trailofbits/skills) | Source context, differential review, variants, sharp edges, agentic CI. | Which reading lens applies to this architecture? |
                | [Trail of Bits Testing Handbook](https://github.com/trailofbits/testing-handbook) | Fuzzing, CodeQL, Semgrep, cryptographic and native-code testing. | Which assumption is amenable to local property or differential testing? |
                | [GitHub Security Lab / CodeQL](https://codeql.github.com/docs/codeql-overview/about-codeql/) | Data-flow models, variant analysis, framework-specific findings. | Which source or sink is invisible to generic rules? |
                | [Cloudflare security-audit-skill](https://github.com/cloudflare/security-audit-skill) | Trust-boundary-first prompts and domain-specific threat lenses. | Who loses control of what, rather than which CWE name matches? |
                | [PortSwigger technique archive](https://portswigger.net/research/top-10-web-hacking-techniques) | Annual judged collections and full nominated research. | What surprising parser, cache, or browser behavior could transfer? |
                | [PortSwigger 2025 selections](https://portswigger.net/research/top-10-web-hacking-techniques-of-2025) | Parser differences, Unicode normalization, ORM leakage, cache chains. | Which “safe” abstraction conceals a composition flaw? |
                | [HackerOne Hacktivity](https://hackerone.com/hacktivity) | Disclosed public bug-bounty reports and real preconditions. | Which decisive step turns an ordinary bug into cross-principal impact? |
                | [oss-security archive](https://www.openwall.com/lists/oss-security/) | Public disclosures, patch links, maintainer follow-ups. | Were adjacent components fixed differently or not discussed? |
                | [Assetnote Wordlists](https://wordlists.assetnote.io/) | Technology-specific endpoint and content naming conventions. | What hidden-but-intended route types or version families exist in *source*? |
                | [Nuclei template collection](https://github.com/projectdiscovery/nuclei-templates) | Community pattern descriptions and public template history. | What assumptions do detection templates make about environment or versions? |
                | [GitHub Code Search](https://github.com/features/code-search) | Cross-repo symbols, library usage, copied code and comments. | Who embeds this risky helper, and how is it called? |
                | [MITRE ATLAS data](https://github.com/mitre-atlas/atlas-data) | AI attack cases and tactics; latest release is versioned. | Which AI-specific entry reaches a conventional privileged operation? |
                | [OWASP Agentic Security](https://genai.owasp.org/initiatives/agentic-security-initiative/) | Agentic application risks, MCP guidance, emerging controls. | Where do agent instructions, tools, and identities cross trust domains? |
                | [MCP security best practices](https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/docs/2026-07-28/tutorials/security/security_best_practices.mdx) | Token audiences, consent, confused deputy, local/remote trust. | Is authorization enforced on the *resource server* and exact action? |
                | [Trail of Bits agentic-actions-auditor](https://github.com/trailofbits/skills/blob/main/plugins/agentic-actions-auditor/skills/agentic-actions-auditor/SKILL.md) | AI agent steps in CI, untrusted PR/issue data, inherited privileges. | Does event content become instructions to an agent with repo secrets or write access? |
                | [OWASP Q3 2026 AI exploit roundup](https://genai.owasp.org/2026/10/08/genai-and-agentic-ai-exploit-roundup-q3-2026/) | Incident/disclosure summaries for AI apps and connected tools. | Which transitions are documented and which are analyst inference? |
              frontier.ai.md: |
                ### AI-adjacent boundary bank · Frontiers

                | Surface | What makes it interesting | Generating question |
                | --- | --- | --- |
                | Retrieved pages and RAG | Untrusted prose enters planning context. | Can a retrieved instruction be mistaken for an authorized user request? |
                | Tool response content | A nominally factual tool result can address the agent. | Is a tool's output able to change plans or permissions unrelated to its data? |
                | MCP tool descriptions | Tool metadata tells the model when and how to act. | Could a newly installed or updated tool claim authority it never earned? |
                | MCP token passthrough | Credential audiences and downstream identities may differ. | Are incoming tokens explicitly issued for this resource rather than another API? |
                | MCP local Inspector / dev proxies | Local testing helpers sometimes wrap process execution. | Who can reach the local proxy and invoke its privileged methods? |
                | Delegated service identity | The agent may have broad scopes to “help” the user. | What operation can it perform that the requesting actor could not? |
                | Tool schema coercion | Natural-language choices become typed parameters. | Which parameters are treated as trusted just because they are structured? |
                | Sandbox ↔ host file transfer | A safe execution area may have a privileged import/export helper. | Can the agent select host-side paths rather than only sandbox paths? |
                | Code interpreter / shell tool | The model's suggestion reaches OS processes. | Which checks are independent of the model's instruction compliance? |
                | Agent-readable repo instructions | A PR, README, issue, or dependency can contain role-like prose. | Can attacker-controlled project text influence a coding agent's privileged step? |
                | AI in CI/CD | Event messages become agent prompts inside runners. | What untrusted event data is combined with repository write or secret permissions? |
                | Long-term agent memory | Summaries and learned facts outlive a source session. | Can a one-time untrusted input be promoted into a persistent instruction? |
                | Agent-to-agent delegation | One agent may summarize untrusted text for another. | Is the original trust label lost during handoff or compaction? |
                | Retrieval indexing / vector filter | “Search” systems may evaluate expressions or expose metadata. | Can a model-selected filter query reach an interpreter or cross-tenant index? |
                | Summarization → action | An assistant may summarize then call email, calendar, or CRM APIs. | Where is a source document promoted from evidence into authorization? |
                | Dynamic tool registry | Available tools change across versions or sessions. | Is consent bound to the precise tool identity, permissions, and implementation? |
                | Browser agents | Page text, pixels, links, and focus state are model input. | Can a page influence higher-privilege actions outside its browser origin? |
                | OCR / transcription / multimodal input | Hidden or incidental content can be interpreted as text instructions. | Does the system preserve where an instruction came from? |
                | Content filters as sole defense | Model refusals cannot enforce resource isolation. | Is the forbidden action impossible at the final API even if the model requests it? |
                | Context truncation / compaction | Critical constraints may leave the active context. | Do tool-side permissions survive irrespective of context-window state? |
                | Agent-side package installation | Suggested dependencies cross into build-time code. | Who vets provenance and install hooks before an agent executes them? |
                | Model-generated code / queries | Generated syntax may be used as policy or executed expressions. | Does the destination parser enforce a narrower capability than the model can express? |
                | Continuous agents and schedules | Authority and goals persist as external state changes. | Will a deferred action recheck scope, access, and owner intent? |
                | Shared agent workspaces | Files, sessions, embeddings, and tool outputs mix. | Can one project, principal, or tenant plant data seen by another? |
                | AI-derived remediation | An auto-fix may only block one visible payload. | Did the patch enforce an invariant or merely appease the current detector? |
                | AI usage / inference quotas | Tasks can amplify expensive tool calls and nested model work. | Are costs and concurrency bounded per principal at the executor? |
              frontier.architecture.md: |
                ### Architecture seam bank · Frontiers

                | Architecture / shift | The fragile assumption to question |
                | --- | --- |
                | CDN → reverse proxy → origin | Who decides canonical path, method, scheme, host, request length, and cache key? |
                | HTTP/2 or HTTP/3 → HTTP/1 translation | Does a frame/body/request mean exactly the same thing after downgrade? |
                | OAuth / OIDC federation | Are issuer, audience, redirect target, session binding, and client identity independently validated? |
                | SAML / XML signatures | Does the verified element equal the element from which identity is extracted? |
                | Multi-tenant SaaS | Is tenant identity carried through joins, exports, analytics, queues, and search indexes? |
                | GraphQL and subscriptions | Does authorization cover each resolver, nested edge, and long-lived update stream? |
                | WebSocket / SSE sessions | Is a connection's authority reconsidered after role changes or token expiry? |
                | Edge workers and durable state | Can replicas, caches, or eventual-consistency reads resurrect revoked permission? |
                | Queue → worker | Does the worker re-evaluate authorization, or trust historical queue metadata forever? |
                | Webhooks and event bridges | Are source authenticity, event type, replay, and side-effect idempotency independent? |
                | Background reports and exports | Can broad service credentials expose records a requester could not fetch directly? |
                | Object storage and signed URLs | Do key prefixes, expiry, method, content type, and owner have consistent meaning? |
                | Upload → preview / scan / transcode | Can post-processing encounter active content or filesystem paths absent from the original ingress? |
                | Archive / package extraction | Do path normalization and symlinks change the destination after checks? |
                | Search / ORM / vector index | Can filter expressions reveal hidden rows, associations, rankings, or metadata? |
                | Client-side routing → API | Are browser path/string assumptions reused as server authorization? |
                | Native desktop app → localhost bridge | Does the local server independently authenticate callers or trust its UI? |
                | Mobile deep link → privileged activity | Can external origin-controlled data invoke account-bound native operations? |
                | Plugin and extension ecosystem | Are plugin permissions, provenance, tool naming, and upgrades bound to what was reviewed? |
                | CI → artifact → release | Can untrusted repository events, dependencies, or build scripts influence signing and publishing? |
                | Container sandbox → host helper | Which copying, logging, networking, and file paths can a sandbox task ask the host to perform? |
                | API compatibility adapter | Is an old default, `null` interpretation, or fallback still accepted without its original guard? |
                | Multi-region replication | Can ownership, deletion, or revocation race against stale readers or asynchronous cleanup? |
                | Rate limiting / billable APIs | Is the cheaply accepted request expensive after nested parsing, fan-out, or retries? |
                | Error / telemetry pipeline | Can logs, debug traces, alerts, or exceptions cross principal or secret boundaries? |
                | Cryptographic wrapper | Is the intended nonce, key separation, tag, or canonical byte string preserved by every binding? |
                | Config-as-code and policy-as-code | Do generated and runtime policies grant the same authority across environments? |
              frontier.classics.md: |
                ### Historical hacks worth stealing ideas from · Frontiers

                | Published case / original source | The surprising mechanism | L3 · Modern question to borrow |
                | --- | --- | --- |
                | [Ken Thompson's Trusting Trust, revisited](https://research.swtch.com/nih) | A compiler binary can carry behavior absent from apparently clean source. | What trusted build/tool component can change the meaning of reviewed inputs? |
                | [xz/liblzma backdoor disclosure, 2024](https://www.openwall.com/lists/oss-security/2024/03/29/4) | The release tarball contained a build-stage change absent from the ordinary Git source view. | Are provenance, tests, release artifacts, and executed objects the same thing? |
                | [Dependency confusion, 2021](https://medium.com/@alex.birsan/dependency-confusion-how-i-hacked-into-apple-microsoft-and-dozens-of-other-companies-4a5d60fec610) | Package resolution crossed an internal/public naming boundary. | Which name or identifier is considered private without enforcing a unique authority? |
                | [HTTP request smuggling research lineage](https://portswigger.net/research/request-smuggling) | Front and back servers disagree about message framing. | Which two components still disagree about where one operation ends? |
                | [HTTP/1.1 must die, 2025](https://portswigger.net/research/http1-must-die) | Compatibility workarounds leave deeper framing ambiguity alive. | Does a middleware “mitigation” remove the invariant violation or only familiar examples? |
                | [Orange Tsai: path normalization research, 2018](https://blog.orange.tw/posts/2018-08-how-i-chained-4-bugs-features-into-rce-on-amazon/) | Several parsers attach different meanings to the same path. | Is approval performed over the same final representation that execution uses? |
                | [Practical web cache poisoning, 2018](https://portswigger.net/research/practical-web-cache-poisoning) | An unkeyed input affects cached output consumed by a different audience. | Which per-user inputs are missing from a shared cache or AI response key? |
                | [Zip Slip disclosure, 2018](https://snyk.io/blog/zip-slip-vulnerability/) | Archive entry names can affect filesystem locations after unpacking. | Do installers, dataset imports, and artifact restorers apply the same destination rule? |
                | [Corkami's Mitra polyglots](https://github.com/corkami/mitra) | One byte sequence can be valid under more than one file format. | Can a scanner approve one interpretation while a later component acts on another? |
                | [Heartbleed, 2014](https://heartbleed.com/) | A declared length was trusted more than the bytes actually present. | Which length, count, or pointer was supplied by a different trust domain? |
                | [Log4j security advisories](https://logging.apache.org/security.html) | Diagnostic logging can unexpectedly invoke interpreter-like behavior. | What other “observation only” subsystem can evaluate, resolve, or fetch? |
                | [Shellshock (CVE-2014-6271)](https://nvd.nist.gov/vuln/detail/CVE-2014-6271) | Environment data could be parsed as executable shell content in affected Bash versions. | Which boundary reclassifies passive metadata into a command or program? |
                | [Cloudflare parser memory leak report, 2017](https://blog.cloudflare.com/incident-report-on-memory-leak-caused-by-cloudflare-parser-bug/) | A parsing edge leaked unrelated memory into responses. | Which high-performance wrapper processes many tenants with shared native state? |
                | [Project Zero Rowhammer research, 2015](https://projectzero.google/2015/03/exploiting-dram-rowhammer-bug-to-gain.html) | Hardware disturbance crossed an apparent memory isolation boundary. | Is an isolation guarantee dependent on lower-layer behavior it doesn't control? |
                | [Spectre and Meltdown, 2018](https://spectreattack.com/) | Microarchitectural side effects leak data despite architectural access rules. | What timing, size, or resource side channel survives an otherwise correct permission check? |
                | [DNS rebinding / browser-origin advisories](https://www.kb.cert.org/vuls/id/652514) | Network destination and browser-origin trust can diverge over time. | Which localhost bridge assumes browser requests cannot originate from an attacker? |
                | [GitHub Security Lab: The weakest link](https://securitylab.github.com/research/the-weakest-link/) | A shared library's design choice undermined multiple consumers. | Which trusted dependency has a security footgun that several wrappers inherited? |
                | [ZDI: turning file deletes into stronger primitives](https://www.zerodayinitiative.com/blog/2022/3/16/abusing-arbitrary-file-deletes-to-escalate-privilege-and-other-great-tricks) | A weak-looking filesystem capability becomes more powerful when combined with system behavior. | What unexpected *second component* acts on the state left by a weak primitive? |
                | [Google structure-aware fuzzing](https://github.com/google/fuzzing/blob/master/docs/structure-aware-fuzzing.md) | Generic fuzzing misses states that require valid structured input or action sequences. | Which input path is “fuzzed” but never reaches its difficult states? |
                | [PortSwigger 2025 technique winners](https://portswigger.net/research/top-10-web-hacking-techniques-of-2025) | Unicode, ORM, XS-Leaks, caches, and error oracles produce fresh results from old ingredients. | Which commonplace operation becomes informative or dangerous only when combined with another? |

                The point is **mechanism transfer**, not replaying an old payload or implying modern targets share the original bug. Years name the published research or disclosure, not affected product versions.
              frontier.crossovers.md: |
                ### Crossover prompts · Frontiers

                | Pair of ideas | New question |
                | --- | --- |
                | Parser differential × agent tool arguments | Does the model's structured value mean something different to the execution tool? |
                | Cache-key confusion × tenant search | Could a private search result be reused without its original principal filter? |
                | Source/sink analysis × new framework | Which framework-specific APIs should be modeled as security-sensitive sinks? |
                | Release diffs × vendor forks | Did a security fix preserve its invariant across bindings and backports? |
                | SSRF / URL parsing × retrieval agent | Does the final fetch obey a host policy independent of LLM-generated URLs? |
                | Localhost trust × desktop AI assistants | Is there a UI-only assumption in a service now exposed to browser-origin requests? |
                | OAuth audience × MCP delegation | Do client, MCP server, and downstream API each enforce their own token audience? |
                | Time-of-check × scheduled agent | Does a permission revoked today still authorize tomorrow's queued action? |
                | Untrusted document × persistent memory | Can external material survive as future authority without provenance? |
                | Archive parsing × AI file ingestion | Does an upload's secondary extraction/parsing escape its original file constraints? |
                | Browser-origin restrictions × remote-control tools | Can a browser agent invoke a local capability the webpage itself lacks? |
                | Failure retry × expensive inference | Can a minor malformed task repeatedly consume shared compute or quota? |
                | Privileged host helper × sandbox | Which copy, logging, or networking operation bypasses the intended isolation? |
                | Error oracle × search filters | Can returned errors, sizes, or timing reveal facts about inaccessible records? |
                | Multilingual stack × canonicalization | Does a proxy, SDK, and database interpret identifier/path bytes the same way? |
                | Human approval × dynamic tools | What happens if the user approved one tool schema but the implementation later changes? |
                | AI-generated fix × semantic variant | Which related path remains vulnerable because only a payload signature was blocked? |
                | “Safe” read-only tool × transitive action | Does reading a document trigger fetches, conversions, plugin hooks, or other side effects? |
