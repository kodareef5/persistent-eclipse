continue;\n    if (ids.has(id)) { warnings.push(`Duplicate claim ${id}; counted once`); continue; }\n    ids.add(id); counts[state] = (counts[state] ?? 0) + 1;\n    notes.push({id, state, path: slash(relative(lab, file))});\n  }\n  const artifacts = Object.fromEntries(['reviews', 'reports', 'runs', 'patches'].map(name => [name, files(join(lab, '.research', name)).length]));\n  return {notes, counts, artifacts, warnings};\n}\n\nexport function reportData(lab, {publish = false} = {}) {\n  const logs = [], warnings = [];\n  const collection = join(lab, '.research', 'local', 'collection.json');\n  if (regular(collection)) {\n    try { const status = JSON.parse(readFileSync(collection, 'utf8')); warnings.push(...status.warnings.map(w => `Collection ${status.at}: ${w}`)); }\n    catch { warnings.push('The last collection status could not be read'); }\n  }\n  for (const file of files(join(lab, '.research', 'local', 'sessions'), f => f.endsWith('.jsonl'))) {\n    try { const log = readLog(file); logs.push(log); warnings.push(...log.warnings); } catch (e) { warnings.push(e.message); }\n  }\n  const indexed = indexedLogs(lab); logs.push(...indexed.logs); warnings.push(...indexed.warnings, ...indexed.logs.flatMap(log => log.warnings));\n  const receipts = [];\n  for (const file of [...files(join(lab, '.research', 'local', 'search'), f => f.endsWith('.json')), ...files(join(lab, '.research', 'intel'), f => /search-[^/]+\\.json$/.test(f))]) {\n    try {\n      const r = JSON.parse(readFileSync(file, 'utf8')), originFile = file + '.origin';\n      if (r.model && r.retrieved) receipts.push({receipt: r, origin: regular(originFile) ? JSON.parse(readFileSync(originFile, 'utf8')) : null});\n    } catch { warnings.push(`Unreadable search receipt: ${relative(lab, file)}`); }\n  }\n  const localUsage = aggregate(logs, receipts);\n  if (publish) publishActivity(lab, localUsage.receipts, localUsage.turns);\n  const shared = readShared(lab), usage = aggregate(logs, receipts, shared.calls, shared.turns);\n  warnings.push(...shared.warnings);\n  if (usage.searchReconciliation.incomplete) warnings.push(`${usage.searchReconciliation.incomplete} search receipt(s) have both legacy and incomplete or conflicting attempt records; totals may overlap until the evidence is resolved`);\n  if (usage.attributionConflicts) warnings.push(`${usage.attributionConflicts} conflicting origin receipts; that work is counted once as unattributed`);\n  usage.sessions.forEach(s => { s.path = slash(relative(lab, s.file)); });\n  const record = researchRecord(lab);\n  const recent = (git(lab, ['log', '-12', '--format=%h%x09%aI%x09%s']) ?? '').split('\\n').filter(Boolean).map(line => { const [commit, time, ...subject] = line.split('\\t'); return {commit, time, subject: subject.join(' ')}; });\n  const days = {};\n  for (const line of (git(lab, ['log', '--since=14 days ago', '--format=%cI']) ?? '').split('\\n').filter(Boolean)) { const day = line.slice(0,10); days[day] = (days[day] ?? 0) + 1; }\n  const status = (git(lab, ['status', '--porcelain=v1', '-z']) ?? '').split('\\0').filter(Boolean);\n  let dirty = 0;\n  for (let i = 0; i < status.length; i++) { dirty++; if (/[RC]/.test(status[i].slice(0,2))) i++; }\n  const touched = (git(lab, ['log', '-20', '--format=', '--name-only']) ?? '').split('\\n').filter(Boolean);\n  const paths = Object.create(null); touched.forEach(p => { paths[p] = (paths[p] ?? 0) + 1; });\n  return {format: 'pe-activity/1', generated: new Date().toISOString(), lab: basename(lab), identity: git(lab, ['config', 'pe.lab']) || null,\n    git: {head: git(lab, ['rev-parse', '--short', 'HEAD']), branch: git(lab, ['branch', '--show-current']), commits: Number(git(lab, ['rev-list', '--count', 'HEAD']) ?? 0),\n      dirty, recent, days,\n      paths: Object.entries(paths).sort((a,b) => b[1]-a[1]).slice(0,8)},\n    usage, collective: collective(lab, usage, shared, producer(lab, false, true)),\n    record, warnings: [...warnings, ...record.warnings]};\n}\n\nconst compact = n => n == null ? '?' : n >= 1e6 ? `${(n/1e6).toFixed(2)}M` : n >= 1e3 ? `${(n/1e3).toFixed(1)}K` : `${n}`;\nexport function usageBreakdown(data) {\n  const groups = new Map();\n  for (const c of data.usage.receipts) {\n    const labels = {mission:c.mission || 'unknown', packRevision:c.packRevision || 'unknown', agent:c.taskId && c.taskId !== 'unknown' ? c.taskId : `${c.role || 'unknown'} ${c.session?.slice(0,8) || ''}`.trim(), workType:c.workType || 'unknown', session:c.session, model:`${c.provider}/${c.model}`, effort:c.effort, kind:c.kind, costKind:c.costKind || 'unknown'};\n    const key=JSON.stringify(labels);\n    if(!groups.has(key))groups.set(key,{...labels,calls:0,sums:{},coverage:{}});\n    const row=groups.get(key);row.calls++;\n    for(const field of ['input','output','cacheRead','cacheWrite','total','cost'])if(c[field]!=null){row.sums[field]=(row.sums[field]||0)+c[field];row.coverage[field]=(row.coverage[field]||0)+1;}\n  }\n  return [...groups.values()];\n}\n\nexport function renderReport(data, {from = '.research/local'} = {}) {\n  const u = data.usage, g = data.git, c = data.collective;\n  const byLab = c.labs.flatMap(lab => lab.models.map(r => ({...r, lab: lab.label})));\n  const rows = byLab.map(r => {\n    const val = k => `${compact(r.sums[k])}${r.coverage[k] && r.coverage[k] < r.calls ? '*' : ''}`;\n    return [clean(r.lab), clean(`${r.provider}/${r.model}`), clean(r.effort), clean(r.kind), String(r.calls), val('input'), val('cacheRead'), val('cacheWrite'), val('output'), val('reasoning'), val('total')];\n  });\n  const table = [['LAB', 'MODEL', 'EFFORT', 'WORK', 'CALLS', 'UNCACHED', 'CACHE HIT', 'CACHE WRITE', 'OUTPUT', 'REASONING', 'TOTAL'], ...rows];\n  const widths = table[0].map((_, i) => Math.max(...table.map(r => r[i].length)));\n  const formatted = table.map(row => row.map((v,i) => v.padEnd(widths[i])).join('  ').trimEnd());\n  const effort = [['LAB', 'SESSIONS', 'CALLS', 'TOKENS', 'ACCOUNTED', 'LATEST RECEIPT'], ...c.labs.map(lab => [clean(lab.label), lab.calls == null ? '?' : String(lab.sessions),\n    lab.calls == null ? '?' : String(lab.calls), lab.calls == null || !lab.metered ? '?' : compact(lab.tokens) + (lab.metered < lab.calls ? '*' : ''),\n    lab.calls == null ? 'not shared' : `${lab.metered}/${lab.calls}`, lab.local ? 'local + shared' : lab.updated?.slice(0,16).replace('T',' ') ?? 'unknown'])];\n  const ew = effort[0].map((_,i) => Math.max(...effort.map(r => r[i].length)));\n  const lines = [`# ${clean(data.lab)} \u00b7 collective lab activity`, '', `As of ${data.generated}. Viewed from: ${clean(data.identity || 'unnamed')}.`, '', '```text',\n    `EFFORT  ${c.metered ? compact(c.tokens) : '?'} tokens recorded  ${c.metered}/${u.calls} calls have total accounting  ${c.sessions} sessions`,\n    ...effort.map(row => row.map((v,i) => v.padEnd(ew[i])).join('  ').trimEnd()), '',\n    `GIT     ${g.head ?? 'no commits'}  ${clean(g.branch || 'detached / unborn')}  ${g.commits} commits  ${g.dirty} changed paths`, '', 'COMMITS / last 14 days'];\n  for (const [day, n] of Object.entries(g.days).sort()) lines.push(`  ${day}  ${'#'.repeat(Math.min(n, 40))}${n > 40 ? '+' : ''} ${n}`);\n  if (!Object.keys(g.days).length) lines.push('  none recorded');\n  lines.push('', 'RECORD / shared current states', ...Object.entries(data.record.counts).map(([s,n]) => `  ${clean(s).padEnd(20)} ${n}`),\n    `  claims               ${data.record.notes.length}`, ...Object.entries(data.record.artifacts).map(([s,n]) => `  ${s.padEnd(20)} ${n} files`), '', ...formatted, '```', '',\n    `${u.calls} recorded calls across the available lab receipts; ${u.unmetered} lack input/output accounting. ${u.sessions.length} conversations are retained on this machine.`, '',\n    '`?` means unknown; `*` is a partial sum. Reasoning is part of output, never added again. Effort is the recorded setting, not a comparison of model capability.', '',\n    'Totals combine local records with receipts received through sync. Other labs may have newer work that has not arrived yet. Unattributed work counts once without guessing its lab; \u201cnot shared\u201d means missing accounting, not zero effort. Counts describe activity, not research quality.', '');\n  if (u.searchReconciliation?.reconciled) lines.push(`${u.searchReconciliation.reconciled} legacy search observation(s) reconciled with their complete attempt receipts; historical files are retained.`, '');\n  for (const row of u.rows.filter(r => r.coverage.cost)) lines.push(`- ${clean(row.provider)}/${clean(row.model)} (${clean(row.effort)}, ${clean(row.kind)}): $${row.sums.cost.toFixed(4)} ${row.costKind}; cost available for ${row.coverage.cost}/${row.calls} calls.`);\n  lines.push('', '## Missions and agents', '', '| Mission / revision | Agent | Model | Effort | Work / lens | Calls | Input | Output | Cache read / write | Cost |', '| --- | --- | --- | --- | --- | ---: | ---: | ---: | --- | --- |');\n  for (const r of usageBreakdown(data)) {\n    const value = k => !r.coverage[k] ? '?' : compact(r.sums[k]) + (r.coverage[k] < r.calls ? '*' : '');\n    lines.push(`| ${clean(r.mission)} / ${clean(r.packRevision.slice(0,12))} | ${clean(r.agent)} | ${clean(r.model)} | ${clean(r.effort)} | ${clean(r.kind)} / ${clean(r.workType)} | ${r.calls} | ${value('input')} | ${value('output')} | ${value('cacheRead')} / ${value('cacheWrite')} | ${r.coverage.cost ? '$'+r.sums.cost.toFixed(4)+' '+r.costKind+' ('+r.coverage.cost+'/'+r.calls+')' : '?'} |`);\n  }\n  lines.push('', '## Recent commits', '', ...g.recent.map(c => `- ${c.commit} \u00b7 ${clean(c.time)} \u00b7 ${clean(c.subject)}`), '', '## Frequently changed paths', '',\n    ...g.paths.map(([p,n]) => `- ${clean(p)} \u00b7 touched in ${n} of the last 20 commits`), '', '## Tools / local transcripts', '',\n    ...Object.entries(u.tools).sort((a,b) => b[1]-a[1]).map(([name,n]) => `- ${clean(name)}: ${n}`), '', '## Findings', '',\n    ...data.record.notes.map(n => `- [${clean(n.id)}](${link(relative(from, n.path))}) \u00b7 ${clean(n.state)}`), '', '## Conversations / retained here', '',\n    ...u.sessions.map(s => `- [${clean(s.runtime)} ${clean(s.id)}](${link(relative(from, s.path))}) \u00b7 ${clean(s.role)} \u00b7 ${s.calls} calls (${s.unmetered} unmetered)${s.parent ? ` \u00b7 parent ${clean(s.parent)}` : ''}`));\n  if (data.warnings.length) lines.push('', '## Gaps', '', ...data.warnings.map(w => `- ${clean(w)}`));\n  return lines.join('\\n') + '\\n';\n}\n\nconst refreshed = new Map();\nexport function refreshReport(lab, force = false) {\n  if (!historyEnabled(lab) || (!force && Date.now() - (refreshed.get(lab) ?? 0) < 300000)) return;\n  const data = reportData(lab, {publish: true});\n  atomic(join(localDir(lab), 'ACTIVITY.md'), renderReport(data));\n  writeActivity(lab, data, {local: true});\n  refreshed.set(lab, Date.now());\n}\n\nexport function writeActivity(lab, data, {local = false} = {}) {\n  // Build only from the same sanitized receipts another clone can read. This\n  // excludes native IDs, transcript links, Git subjects, and local diagnostics.\n  const shared = readShared(lab), usage = aggregate([], [], shared.calls, shared.turns);\n  // Committed views use only shared inputs, never this clone's label, logs or clock.\n  // Capture controls affect new receipts, not rebuilding already shared history.\n  if (!local && !shared.snapshots.length && !shared.warnings.length) return;\n  const sharedData = local ? data : {usage, collective: collective(lab, usage, shared, null, false)};\n  const root = join(lab, local ? '.research/local/activity' : '.research/activity');\n  const write = (name, body) => {\n    const file = join(root, name);\n    if (!regular(file) || readFileSync(file, 'utf8') !== body) atomic(file, body);\n  };\n  const overview = activityView(sharedData);\n  const warnings = [...shared.warnings];\n  if (usage.searchReconciliation.incomplete) warnings.push(`${usage.searchReconciliation.incomplete} search receipt(s) have incomplete or conflicting attempt records; totals may overlap`);\n  const gaps = warnings.length ? '\\n## Entries needing attention\\n\\n' + warnings.map(w => `- ${clean(w)}`).join('\\n') + '\\n' : '';\n  write('README.md', activityMarkdown(overview, {overall: true}) + gaps);\n  write('overview.svg', activityChart(overview));\n  for (const lab of overview.labs) {\n    const view = activityView(sharedData, lab.id), name = activityFile(lab.id);\n    write(`labs/${name}.md`, activityMarkdown(view, {chart: `${name}.svg`}) + gaps);\n    write(`labs/${name}.svg`, activityChart(view));\n  }\n}\n\n// Automatic scans and Git work run on another event loop. Only one report per\n// lab runs at a time; shutdown requests one final pass after any in-flight scan.\nconst background = new Map();\nexport function scheduleReport(lab, force = false) {\n  if (!historyEnabled(lab)) return Promise.resolve();\n  const active = background.get(lab);\n  if (active) { if (force) active.again = true; return active.promise; }\n  if (!force && Date.now() - (refreshed.get(lab) ?? 0) < 300000) return Promise.resolve();\n  const state = {again: false};\n  state.promise = (async () => {\n    do {\n      state.again = false;\n      await new Promise((resolve, reject) => {\n        // import.meta.url also works for DSH's trusted embedded data URL module.\n        const worker = new Worker(`const {workerData} = require('node:worker_threads');\n          import(workerData.module).then(m => m.refreshReport(workerData.lab, true));`,\n          {eval: true, execArgv: [], workerData: {module: import.meta.url, lab}});\n        worker.once('error', reject);\n        worker.once('exit', code => code ? reject(new Error(`History report worker exited ${code}`)) : resolve());\n      });\n      refreshed.set(lab, Date.now());\n    } while (state.again);\n  })().finally(() => background.delete(lab));\n  background.set(lab, state);\n  return state.promise;\n}\n\nasync function fileHash(file) {\n  const hash = createHash('sha256');\n  for await (const chunk of createReadStream(file)) hash.update(chunk);\n  return hash.digest('hex');\n}\n\nfunction conversation(log) {\n  const lines = [`# ${log.runtime} conversation ${clean(log.header.id)}`, '',\n    `Role: ${clean(log.meta?.role ?? log.header.origin ?? 'unknown')}. Parent: ${clean(log.meta?.parentSession ?? log.header.parentSession ?? 'none recorded')}.`, '',\n    'Recorded messages and tool events follow. This is the runtime log, including any thinking content the provider exposed; it does not reveal unrecorded internal reasoning.', ''];\n  for (const event of log.events) {\n    const text = JSON.stringify(event, null, 2), fence = '`'.repeat(Math.max(3, ...[...text.matchAll(/`+/g)].map(m => m[0].length + 1)));\n    lines.push(`## ${clean(event.timestamp ?? event.time ?? '')} \u00b7 ${clean(event.message?.role ?? event.type)}`, '', `${fence}json`, text, fence, '');\n  }\n  return lines.join('\\n');\n}\n\n// A directory is intentional: inspect and verify it before compressing or sharing.\n// Symlinks are recorded, never followed or materialized during archive creation.\nexport async function archive(lab, destination, {include = [], includeCaches = false} = {}) {\n  lab = realpathSync(lab);\n  let out = resolve(destination);\n  if (within(lab, out) || within(out, lab)) throw new Error('Choose an archive destination outside the lab and its parents');\n  if (existsSync(out)) throw new Error(`Archive destination already exists: ${out}`);\n  mkdirSync(dirname(out), {recursive: true});\n  out = join(realpathSync(dirname(out)), basename(out));\n  if (within(lab, out) || within(out, lab)) throw new Error('Choose an archive destination outside the lab and its parents');\n  const staging = mkdtempSync(join(dirname(out), '.pe-archive-'));\n  const manifest = {format: 'pe-archive/1', started: new Date().toISOString(), source: lab, head: git(lab, ['rev-parse', 'HEAD']),\n    files: [], links: [], omitted: [], repositories: [], warnings: [], extras: []};\n  const caches = new Set(['node_modules', '.lake', '__pycache__', '.cache']);\n  const emit = (name, body) => { const path = join(staging, name); mkdirSync(dirname(path), {recursive: true}); writeFileSync(path, body, {mode: 0o600, flag: 'wx'}); };\n  const copy = async (source, target, top = false) => {\n    const stat = lstatSync(source), rel = slash(relative(staging, target));\n    if (stat.isSymbolicLink()) { manifest.links.push({path: rel, target: readlinkSync(source)}); return; }\n    if (stat.isDirectory()) {\n      mkdirSync(target, {recursive: true, mode: 0o700});\n      if (existsSync(join(source, '.git')) || (top && git(source, ['rev-parse', '--show-toplevel']) === source)) {\n        const index = manifest.repositories.length, root = `repositories/${index}`, head = git(source, ['rev-parse', 'HEAD']);\n        const repo = {path: rel, head, branch: git(source, ['branch', '--show-current']), bundle: null};\n        manifest.repositories.push(repo);\n        emit(`${root}/staged.patch`, execFileSync('git', ['-C', source, 'diff', '--cached', '--binary'], {maxBuffer: 128 * 1024 * 1024}));\n        emit(`${root}/unstaged.patch`, execFileSync('git', ['-C', source, 'diff', '--binary'], {maxBuffer: 128 * 1024 * 1024}));\n        emit(`${root}/status.txt`, (git(source, ['status', '--porcelain=v1']) ?? '') + '\\n');\n        if (head) {\n          const name = `${root}/history.bundle`;\n          execFileSync('git', ['-C', source, 'bundle', 'create', join(staging, name), '--all', 'HEAD'], {stdio: ['ignore', 'pipe', 'pipe']});\n          execFileSync('git', ['-C', source, 'bundle', 'verify', join(staging, name)], {stdio: ['ignore', 'pipe', 'pipe']});\n          repo.bundle = name;\n        }\n      }\n      for (const name of readdirSync(source).sort()) {\n        const path = join(source, name), dest = join(target, name);\n        const reason = name === '.git' ? 'Git refs and reachable history are in a bundle; local Git config and reflogs are not copied'\n          : !includeCaches && caches.has(name) && lstatSync(path).isDirectory() ? 'rebuildable cache (use --include-caches to retain)'\n          : null;\n        if (reason) { manifest.omitted.push({path: slash(relative(staging, dest)), reason}); continue; }\n        await copy(path, dest);\n      }\n    } else if (stat.isFile()) {\n      mkdirSync(dirname(target), {recursive: true});\n      copyFileSync(source, target);\n      const after = lstatSync(source);\n      if (stat.size !== after.size || stat.mtimeMs !== after.mtimeMs) manifest.warnings.push(`Changed while copying: ${rel}`);\n    } else manifest.omitted.push({path: rel, reason: 'socket, device, or other non-file'});\n  };\n  try {\n    await copy(lab, join(staging, 'workspace'), true);\n    for (const [i, requested] of include.entries()) {\n      const source = resolve(requested);\n      if (within(source, staging) || within(source, out)) throw new Error('An extra path would include the archive itself');\n      const target = `extras/${i}/${basename(source)}`;\n      await copy(source, join(staging, target), true);\n      manifest.extras.push({source, path: target});\n    }\n    const snapshotLab = join(staging, 'workspace');\n    const retained = retainIndexed(lab, snapshotLab);\n    manifest.warnings.push(...retained.warnings);\n    // An archive must read its own copies, never follow pointers back to this machine.\n    rmSync(join(snapshotLab, '.research', 'local', 'index'), {recursive: true, force: true});\n    // Use the copied logs so the report and conversation views describe this snapshot.\n    const data = reportData(snapshotLab);\n    data.lab = basename(lab); data.identity = git(lab, ['config', 'pe.lab']) || null;\n    data.git = reportData(lab).git;\n    emit('ACTIVITY.md', renderReport(data, {from: '.'}).replaceAll('](.research/', '](workspace/.research/'));\n    const index = ['# Conversations', '', 'Raw records and readable copies of the collected sessions.', ''];\n    for (const file of files(join(snapshotLab, '.research', 'local', 'sessions'), f => f.endsWith('.jsonl'))) {\n      try {\n        const log = readLog(file), name = basename(file, '.jsonl');\n        emit(`conversations/${name}.md`, conversation(log));\n        if (log.runtime === 'pi') emit(`conversations/${name}.pi.jsonl`, [log.header, ...log.events].map(json).join('\\n') + '\\n');\n        else emit(`conversations/${name}.dsh.json`, JSON.stringify({header: log.header, events: log.events, metadata: log.meta}, null, 2) + '\\n');\n        index.push(`- [${clean(log.runtime)} ${clean(log.header.id)}](${name}.md) \u00b7 [raw snapshot](../workspace/.research/local/sessions/${basename(file)})`);\n        manifest.warnings.push(...log.warnings);\n      } catch (e) { manifest.warnings.push(e.message); }\n    }\n    emit('conversations/INDEX.md', index.join('\\n') + '\\n');\n    // Include the exact standalone verifier used to create the archive.\n    emit('history.mjs', readFileSync(fileURLToPath(import.meta.url)));\n    emit('activity.mjs', readFileSync(new URL('./activity.mjs', import.meta.url)));\n    emit('README.md', `# ${clean(basename(lab))} archive\\n\\nSaved ${new Date().toISOString()}. This is a private snapshot, not the small publication pack.\\n\\n- [Activity](ACTIVITY.md)\\n- [Conversations](conversations/INDEX.md)\\n- [Manifest](manifest.json): hashes, omitted paths, symlinks, repositories, and extra inputs.\\n- workspace/: files as copied, including uncommitted and ignored work.\\n- repositories/: Git bundles plus staged and unstaged binary patches. Bundles include refs and reachable commits, not reflogs or unreachable objects.\\n\\nVerify with \\`node history.mjs verify .\\`. To compress after inspection, run \\`tar -czf ../lab-archive.tar.gz .\\` from this directory.\\n\\nRestore each repository by cloning its bundle into a fresh directory, checking out its recorded HEAD, and overlaying the corresponding workspace files (including deletions shown by status.txt). To restore staging, apply staged.patch with \\`git apply --cached\\`; the workspace copy already contains both staged and unstaged changes. Symlinks are listed in the manifest and need to be recreated deliberately.\\n\\nPi native JSONL copies are in conversations/. DSH snapshots preserve headers and events for inspection or a version-aware importer; they are not DSH's on-disk database format. Resuming depends on a compatible runtime and tools. Running processes, credentials from outside the lab, and provider state are not captured.\\n\\nInline attachments and workspace files travel with the archive. External file references need an explicit --include when making it; references inside arbitrary tool output are not automatically followed. Capture at a quiet moment for a consistent snapshot. Files changing during capture are flagged where detected; this is not an atomic filesystem snapshot.\\n\\nFull transcripts and ignored files may contain private material. Review a separate copy before publishing.\\n`);\n    manifest.finished = new Date().toISOString();\n    const endHead = git(lab, ['rev-parse', 'HEAD']);\n    if (endHead !== manifest.head) manifest.warnings.push(`HEAD changed during capture: ${manifest.head} -> ${endHead}`);\n    for (const file of files(staging)) manifest.files.push({path: slash(relative(staging, file)), bytes: lstatSync(file).size, mode: lstatSync(file).mode & 0o777, sha256: await fileHash(file)});\n    emit('manifest.json', JSON.stringify(manifest, null, 2) + '\\n');\n    await verifyArchive(staging);\n    // Reserve the destination exclusively; never merge into or overwrite another archive.\n    mkdirSync(out, {mode: 0o700});\n    for (const name of readdirSync(staging)) renameSync(join(staging, name), join(out, name));\n    rmSync(staging, {recursive: true});\n    return {path: out, files: manifest.files.length, warnings: manifest.warnings, sha256: await fileHash(join(out, 'manifest.json'))};\n  } catch (e) { rmSync(staging, {recursive: true, force: true}); throw e; }\n}\n\nexport async function verifyArchive(directory) {\n  const root = resolve(directory), manifest = JSON.parse(readFileSync(join(root, 'manifest.json'), 'utf8'));\n  if (manifest.format !== 'pe-archive/1' || !Array.isArray(manifest.files)) throw new Error('Unrecognized archive manifest');\n  const expected = new Set(['manifest.json']);\n  for (const entry of manifest.files) {\n    if (typeof entry.path !== 'string' || entry.path.split('/').some(p => !p || p === '.' || p === '..') || entry.path.includes('\\\\') || isAbsolute(entry.path) || expected.has(entry.path)) throw new Error('Unsafe or duplicate archive path');\n    expected.add(entry.path);\n    let at = root;\n    for (const part of entry.path.split('/')) { at = join(at, part); if (lstatSync(at).isSymbolicLink()) throw new Error(`Unexpected symlink: ${entry.path}`); }\n    if (!regular(at) || lstatSync(at).size !== entry.bytes || await fileHash(at) !== entry.sha256) throw new Error(`Hash or size mismatch: ${entry.path}`);\n  }\n  const inspect = dir => { for (const name of readdirSync(dir)) { const file = join(dir, name), stat = lstatSync(file);\n    if (stat.isSymbolicLink()) throw new Error(`Unexpected symlink: ${relative(root, file)}`);\n    if (stat.isDirectory()) inspect(file);\n    else if (!stat.isFile() || !expected.has(slash(relative(root, file)))) throw new Error(`Unlisted archive file: ${relative(root, file)}`);\n  } };\n  inspect(root);\n  return {files: manifest.files.length, warnings: manifest.warnings ?? []};\n}\n\nasync function main(args) {\n  const [command, ...rest] = args;\n  if (command === 'verify') { if (rest.length !== 1) throw new Error('verify needs an archive directory'); console.log(JSON.stringify(await verifyArchive(rest[0]), null, 2)); return; }\n  const lab = labRoot();\n  if (!lab) throw new Error('Run this inside a lab with .research/LAB.md');\n  if (command === 'collect') { if (rest.length) throw new Error('collect takes no arguments'); console.log(JSON.stringify(collect(lab), null, 2)); refreshReport(lab, true); return; }\n  if (command === 'report') {\n    if (rest.some(a => !['--json', '--write'].includes(a))) throw new Error('report accepts --json or --write');\n    const data = reportData(lab, {publish: rest.includes('--write') && historyEnabled(lab)});\n    if (rest.includes('--write')) { const file = join(localDir(lab), 'ACTIVITY.md'); atomic(file, renderReport(data)); writeActivity(lab, data); console.log(file); }\n    else console.log(rest.includes('--json') ? JSON.stringify({...data, activity: activityView(data)}, null, 2) : renderReport(data));\n    return;\n  }\n  if (command === 'archive') {\n    const destination = rest.shift();\n    if (!destination || destination.startsWith('--')) throw new Error('archive needs a new destination directory');\n    const options = {include: [], includeCaches: false};\n    while (rest.length) { const arg = rest.shift(); if (arg === '--include-caches') options.includeCaches = true;\n      else if (arg === '--include' && rest[0] && !rest[0].startsWith('--')) options.include.push(rest.shift()); else throw new Error(`Unknown archive argument: ${arg}`); }\n    const collected = collect(lab); const result = await archive(lab, destination, options);\n    console.log(JSON.stringify({...result, collectionWarnings: collected.warnings}, null, 2)); return;\n  }\n  throw new Error('Usage: node history.mjs collect | report [--write|--json] | archive DIR [--include PATH] [--include-caches] | verify DIR');\n}\n\nfunction isCommand() {\n  try { return import.meta.url === pathToFileURL(realpathSync(process.argv[1])).href; }\n  catch { return false; }\n}\nif (isCommand()) {\n  main(process.argv.slice(2)).catch(e => { console.error(`history: ${e.message}`); process.exitCode = 1; });\n}\n", "activity.mjs": "// Pure views over sanitized receipts. No transcript reads, clocks, or model calls.\n// The same numbers feed Git-readable Markdown/SVG, Pi, and the DSH card.\nconst finite = n => typeof n === 'number' && Number.isFinite(n) && n >= 0;\nexport const timestamp = value => {\n  if (value == null || value === '') return null;\n  const n = typeof value === 'number' ? value : Date.parse(value);\n  return finite(n) && n <= 8.64e15 ? n : null;\n};\nconst fields = ['input', 'output', 'cacheRead', 'cacheWrite', 'total'];\nconst sum = values => values.reduce((a, b) => a + b, 0);\nconst quantile = (values, p) => {\n  if (!values.length) return null;\n  const ordered = [...values].sort((a, b) => a - b);\n  return ordered[Math.max(0, Math.ceil(ordered.length * p) - 1)];\n};\nconst promptTokens = call => [call.input, call.cacheRead, call.cacheWrite].every(finite)\n  ? call.input + call.cacheRead + call.cacheWrite : null;\nconst duration = turn => timestamp(turn.started) != null && timestamp(turn.ended) >= timestamp(turn.started)\n  && turn.ended != null && !turn.disputed ? timestamp(turn.ended) - timestamp(turn.started) : null;\nconst label = value => String(value ?? 'unknown').replace(/[\\x00-\\x1f\\x7f]/g, ' ');\nconst md = value => label(value).replace(/[|<>`\\[\\]\\\\]/g, c => ({'|':'\\\\|','<':'&lt;','>':'&gt;','`':\"'\",'[':'\\\\[',']':'\\\\]','\\\\':'\\\\\\\\'}[c]));\nconst xml = value => label(value).replace(/[<>&\"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;',\"'\":'&apos;'}[c]));\nexport const compact = n => n == null ? '?' : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M`\n  : n >= 1e3 ? `${(n / 1e3).toFixed(1)}K` : String(Math.round(n));\nexport const span = ms => ms == null ? '?' : ms < 1000 ? `${Math.round(ms)}ms`\n  : ms < 60000 ? `${(ms / 1000).toFixed(1)}s` : ms < 3600000 ? `${(ms / 60000).toFixed(1)}m` : `${(ms / 3600000).toFixed(1)}h`;\nconst percent = n => n == null ? '?' : `${(n * 100).toFixed(1)}%`;\nexport const activityFile = id => id.replace(/[^a-zA-Z0-9_-]/g, '_');\nconst bounds = values => values.reduce((range, value) => [Math.min(range[0], value), Math.max(range[1], value)], [Infinity, -Infinity]);\n\n// Sweep intervals by session, so parallel work adds agent time but not elapsed\n// time. Duplicate/overlapping intervals from one session occupy one lane.\nexport function concurrency(turns) {\n  const events = new Map();\n  for (const t of turns) {\n    if (duration(t) == null) continue;\n    for (const [time, delta] of [[timestamp(t.started), 1], [timestamp(t.ended), -1]]) {\n      if (!events.has(time)) events.set(time, []);\n      events.get(time).push([t.session || t.identity, delta]);\n    }\n  }\n  const active = new Map();\n  let peak = 0, elapsedMs = 0, agentMs = 0, previous = null;\n  for (const [time, changes] of [...events].sort((a, b) => a[0] - b[0])) {\n    if (previous != null) {\n      if (active.size) elapsedMs += time - previous;\n      agentMs += (time - previous) * active.size;\n    }\n    for (const [id, delta] of changes) {\n      const n = (active.get(id) || 0) + delta;\n      if (n) active.set(id, n); else active.delete(id);\n    }\n    peak = Math.max(peak, active.size);\n    previous = time;\n  }\n  return {peak, elapsedMs, agentMs};\n}\n\nfunction summarize(calls, turns) {\n  const sums = {}, coverage = {};\n  for (const field of fields) {\n    const values = calls.map(c => c[field]).filter(finite);\n    sums[field] = values.length ? sum(values) : null;\n    coverage[field] = values.length;\n  }\n  const costs = {};\n  for (const kind of ['reported', 'estimate']) {\n    const values = calls.filter(c => c.costKind === kind && finite(c.cost)).map(c => c.cost);\n    costs[kind] = {value: values.length ? sum(values) : null, calls: values.length};\n  }\n  const prompts = calls.filter(c => promptTokens(c) != null);\n  const denominator = sum(prompts.map(promptTokens));\n  const completed = turns.filter(t => duration(t) != null), durations = completed.map(duration);\n  const sessions = new Set([...calls, ...turns].map(c => c.session).filter(Boolean));\n  const workers = new Set([...calls, ...turns].filter(c => c.role === 'worker').map(c => c.session).filter(Boolean));\n  return {calls: calls.length, sessions: sessions.size, workers: workers.size, sums, coverage, costs,\n    timedCalls: calls.filter(c => timestamp(c.time) != null).length,\n    cache: {rate: denominator ? sum(prompts.map(c => c.cacheRead)) / denominator : null, calls: prompts.length},\n    context: {median: quantile(prompts.map(promptTokens), .5), p90: quantile(prompts.map(promptTokens), .9)},\n    turns: {count: turns.length, completed: completed.length, unfinished: turns.length - completed.length,\n      medianMs: quantile(durations, .5), p90Ms: quantile(durations, .9)},\n    timing: concurrency(completed), workersTiming: concurrency(completed.filter(t => t.role === 'worker'))};\n}\n\nfunction groups(calls, key) {\n  const by = new Map();\n  for (const c of calls) {\n    const k = key(c);\n    if (!by.has(k)) by.set(k, []);\n    by.get(k).push(c);\n  }\n  return [...by].sort((a, b) => a[0].localeCompare(b[0]))\n    .map(([name, list]) => {\n      const {calls, sums, coverage, costs, cache} = summarize(list, []);\n      return {name, calls, sums, coverage, costs, cache};\n    });\n}\n\nexport function activityView(data, scope = 'all') {\n  const labs = data.collective.labs;\n  const selected = scope === 'all' ? null : labs.find(l => l.id === scope);\n  if (scope !== 'all' && !selected) throw new Error('Unknown activity lab');\n  const belongs = c => !selected || selected.ids.includes(c.origin?.id ?? 'unattributed');\n  const calls = data.usage.receipts.filter(belongs), turns = (data.usage.turns || []).filter(belongs);\n  const labOf = c => labs.find(l => l.ids.includes(c.origin?.id ?? 'unattributed'))?.label ?? 'unattributed';\n  const bySession = new Map();\n  for (const item of [...calls, ...turns]) if (item.session) {\n    if (!bySession.has(item.session)) bySession.set(item.session, {calls: [], turns: []});\n    bySession.get(item.session)[item.started != null ? 'turns' : 'calls'].push(item);\n  }\n  const conversations = [...bySession].map(([id, entries]) => {\n    const all = [...entries.calls, ...entries.turns], first = all[0];\n    const times = all.flatMap(c => [c.time, c.started, c.ended]).map(timestamp).filter(t => t != null);\n    const {calls: count, turns: measured, context} = summarize(entries.calls, entries.turns);\n    const [firstTime, lastTime] = bounds(times);\n    return {id, lab: labOf(first), role: first.role, task: first.taskId || 'unknown',\n      first: times.length ? firstTime : null, last: times.length ? lastTime : null,\n      calls: count, turns: measured, context};\n  }).sort((a, b) => (b.last ?? 0) - (a.last ?? 0) || a.id.localeCompare(b.id));\n  const days = groups(calls.filter(c => timestamp(c.time) != null), c => new Date(timestamp(c.time)).toISOString().slice(0, 10));\n  return {scope, label: selected?.label ?? 'All labs',\n    labs: labs.map(l => ({id: l.id, label: l.label, updated: l.updated, shared: l.calls != null,\n      summary: summarize(data.usage.receipts.filter(c => l.ids.includes(c.origin?.id ?? 'unattributed')),\n        (data.usage.turns || []).filter(t => l.ids.includes(t.origin?.id ?? 'unattributed')))})),\n    summary: summarize(calls, turns), days, conversations,\n    models: groups(calls, c => `${c.provider}/${c.model} \u00b7 ${c.effort} \u00b7 ${c.role}`),\n    missions: groups(calls, c => `${c.mission || 'unknown'} @ ${(c.packRevision || 'unknown').slice(0, 12)}`),\n    agents: groups(calls, c => `${labOf(c)} \u00b7 ${c.role} ${c.taskId && c.taskId !== 'unknown' ? c.taskId : c.session?.slice(0, 8) || ''}`),\n    fleet: turns.filter(t => duration(t) != null).map(t => ({session: t.session, started: t.started, ended: t.ended, lab: labOf(t)}))};\n}\n\nfunction amount(row, field) {\n  return compact(row.sums[field]) + (row.coverage[field] && row.coverage[field] < row.calls ? '*' : '');\n}\nfunction cost(row) {\n  return ['reported', 'estimate'].filter(k => row.costs[k].calls)\n    .map(k => `$${row.costs[k].value.toFixed(4)} ${k} (${row.costs[k].calls}/${row.calls})`).join('; ') || '?';\n}\nfunction table(rows) {\n  return ['| View | Calls | Tokens | Cache hit | Reported / estimated cost |', '| --- | ---: | ---: | ---: | --- |',\n    ...rows.map(r => `| ${md(r.name)} | ${r.calls} | ${amount(r, 'total')} | ${percent(r.cache.rate)} (${r.cache.calls}/${r.calls}) | ${cost(r)} |`)];\n}\n\nexport function activityMarkdown(view, {chart = 'overview.svg', overall = false} = {}) {\n  const s = view.summary;\n  const lines = [`# ${md(view.label)} \u00b7 activity`, '',\n    'Generated from received accounting receipts. Rebuild after merging; commit this page and its charts with the receipts.', '',\n    `![Tokens, cache, costs, and research turns](${chart})`, '',\n    `${s.calls} recorded calls \u00b7 ${s.sessions} observed conversations \u00b7 ${s.workers} worker conversations.`, '',\n    '| Tokens | Uncached input | Output | Cache read | Cache write |', '| ---: | ---: | ---: | ---: | ---: |',\n    `| ${amount(s, 'total')} | ${amount(s, 'input')} | ${amount(s, 'output')} | ${amount(s, 'cacheRead')} | ${amount(s, 'cacheWrite')} |`, '',\n    `Costs: ${cost(s)}. Cache hit rate: ${percent(s.cache.rate)} across ${s.cache.calls}/${s.calls} calls with all input buckets.`, '',\n    `Recorded turns: ${s.turns.completed} complete, ${s.turns.unfinished} with an unknown end. Median ${span(s.turns.medianMs)}; p90 ${span(s.turns.p90Ms)}.`,\n    `Observed elapsed activity: ${s.turns.completed ? span(s.timing.elapsedMs) : '?'}. Summed agent time: ${s.turns.completed ? span(s.timing.agentMs) : '?'}. Peak simultaneous workers: ${s.turns.completed ? s.workersTiming.peak : '?'}.`,\n    `Input context per measured call: median ${compact(s.context.median)}, p90 ${compact(s.context.p90)} tokens.`, '',\n    'Turns are runtime runs that can contain several model calls and tools (Pi agent loops; DSH turns). Elapsed activity is the union of observed intervals, excluding idle gaps; summed agent time includes parallel work. Neither is a deadline or a measure of research quality.', '',\n    `Coverage: ${s.coverage.total}/${s.calls} total-token counts; ${s.timedCalls}/${s.calls} call timestamps. Older receipts may have no timing. Missing values are ?, partial totals carry *. Cache rate is token-weighted cache reads / (uncached input + cache reads + cache writes), using complete input accounting only. Reasoning tokens are already part of output. Costs remain separate reported charges and estimates; unknown costs are not zero.`, ''];\n  if (!s.calls && !s.turns.count) lines.push('No accounting has arrived for this view. Activity remains unknown.', '');\n  if (overall && view.labs.length) lines.push('## Labs', '', '| Lab | Calls | Workers | Tokens | Cache hit | Median turn | Latest received |', '| --- | ---: | ---: | ---: | ---: | ---: | --- |',\n    ...view.labs.map(l => `| [${md(l.label)}](labs/${activityFile(l.id)}.md) | ${l.shared ? l.summary.calls : '?'} | ${l.shared ? l.summary.workers : '?'} | ${amount(l.summary, 'total')} | ${percent(l.summary.cache.rate)} | ${span(l.summary.turns.medianMs)} | ${l.shared ? l.updated || 'unknown' : 'not shared'} |`), '');\n  lines.push('## Models, effort, and roles', '', ...table(view.models), '', '## Missions and revisions', '', ...table(view.missions), '',\n    '<details><summary>Agents and conversations</summary>', '', ...table(view.agents), '',\n    '| Conversation | Lab / role | Calls | Recorded turns | Median / p90 turn | Median input context |', '| --- | --- | ---: | ---: | --- | ---: |',\n    ...view.conversations.map(c => `| ${c.id.slice(0, 8)} | ${md(c.lab)} / ${md(c.role)} | ${c.calls} | ${c.turns.completed}${c.turns.unfinished ? ` + ${c.turns.unfinished} unfinished` : ''} | ${span(c.turns.medianMs)} / ${span(c.turns.p90Ms)} | ${compact(c.context.median)} |`), '', '</details>', '');\n  return lines.join('\\n');\n}\n\n// Standalone, deterministic SVG. Restrict the picture to recent activity while\n// the tables keep all received data. No scripts, external assets, or raw markup.\nexport function activityChart(view) {\n  const out = [], w = 1000;\n  const text = (x, y, value, cls = '') => out.push(`<text x=\"${x}\" y=\"${y}\" class=\"${cls}\">${xml(value)}</text>`);\n  const rect = (x, y, width, height, fill, extra = '') => out.push(`<rect x=\"${x.toFixed(2)}\" y=\"${y.toFixed(2)}\" width=\"${Math.max(0, width).toFixed(2)}\" height=\"${Math.max(0, height).toFixed(2)}\" fill=\"${fill}\" ${extra}/>`);\n  const line = (x1, y1, x2, y2, stroke = '#dce4ed') => out.push(`<path d=\"M${x1},${y1} L${x2},${y2}\" stroke=\"${stroke}\" fill=\"none\"/>`);\n  const s = view.summary, colors = ['#4f67be', '#25a68a', '#86cbb8', '#f0a64d'];\n  text(32, 38, view.label, 'title');\n  text(32, 65, `${s.calls} calls \u00b7 ${s.sessions} conversations \u00b7 ${s.workers} workers \u00b7 ${s.turns.completed} measured turns`, 'sub');\n  const cards = [ ['Recorded tokens', amount(s, 'total')], ['Cache hit', percent(s.cache.rate)],\n    ['Reported cost', s.costs.reported.calls ? '$' + s.costs.reported.value.toFixed(3) : '?'],\n    ['Estimated cost', s.costs.estimate.calls ? '$' + s.costs.estimate.value.toFixed(3) : '?'] ];\n  cards.forEach(([name, value], i) => {\n    rect(32 + i * 240, 87, 222, 78, '#f0f4f9', 'rx=\"10\"');\n    text(46 + i * 240, 111, name, 'sub'); text(46 + i * 240, 145, value, 'metric');\n  });\n  const last = view.days.at(-1)?.name;\n  const days = last ? Array.from({length: 21}, (_, i) => {\n    const date = new Date(Date.parse(last) - (20 - i) * 86400000).toISOString().slice(0, 10);\n    return view.days.find(d => d.name === date) || {name: date, calls: 0, sums: {}, costs: {}, cache: {}};\n  }) : [];\n  const plot = {x: 70, width: 886, step: 886 / 21};\n  text(32, 201, 'Tokens by day \u00b7 last 21 days with received timestamps (UTC)', 'heading');\n  ['Uncached', 'Cache read', 'Cache write', 'Output'].forEach((name, i) => {\n    rect(40 + i * 160, 218, 10, 10, colors[i]); text(56 + i * 160, 228, name, 'sub');\n  });\n  const stacked = ['input', 'cacheRead', 'cacheWrite', 'output'];\n  const maxTokens = Math.max(1, ...days.map(d => sum(stacked.map(f => d.sums[f] || 0))));\n  line(plot.x, 365, 956, 365); text(32, 254, compact(maxTokens), 'tiny');\n  days.forEach((d, i) => {\n    let y = 365;\n    stacked.forEach((f, k) => {\n      const height = (d.sums[f] || 0) / maxTokens * 115;\n      y -= height;\n      rect(plot.x + i * plot.step + 3, y, plot.step - 6, height, colors[k]);\n    });\n    if (i % 4 === 0) text(plot.x + i * plot.step, 386, d.name.slice(5), 'tiny');\n  });\n  if (!days.length) text(70, 300, 'No timestamped calls received yet.', 'sub');\n  text(32, 425, 'Cost by day \u00b7 known charges and estimates remain separate', 'heading');\n  const maxCost = Math.max(.000001, ...days.map(d => sum(['reported', 'estimate'].map(k => d.costs[k]?.value || 0))));\n  line(plot.x, 540, 956, 540);\n  days.forEach((d, i) => {\n    let y = 540;\n    ['reported', 'estimate'].forEach((k, j) => {\n      const height = (d.costs[k]?.value || 0) / maxCost * 85;\n      y -= height;\n      rect(plot.x + i * plot.step + 3, y, plot.step - 6, height, j ? '#c6b4e2' : '#7957a4');\n    });\n  });\n  text(32, 450, '$' + (maxCost === .000001 ? '0' : maxCost.toFixed(3)), 'tiny');\n  text(70, 563, 'Dark: reported \u00b7 light: estimate \u00b7 absent bars may mean missing accounting', 'sub');\n  text(32, 603, 'Cache hit rate \u00b7 token-weighted, complete input accounting only', 'heading');\n  line(plot.x, 702, 956, 702); text(32, 629, '100%', 'tiny'); text(32, 703, '0%', 'tiny');\n  // Separate segments at gaps; a missing bucket must not draw a zero or a bridge.\n  let prev = null;\n  days.forEach((d, i) => {\n    const rate = d.cache.rate;\n    if (rate == null) { prev = null; return; }\n    const x = plot.x + (i + .5) * plot.step, y = 702 - rate * 72;\n    if (prev) line(prev.x, prev.y, x, y, '#16886f');\n    out.push(`<circle cx=\"${x}\" cy=\"${y}\" r=\"3\" fill=\"#16886f\"/>`); prev = {x, y};\n  });\n  const lanes = view.conversations.filter(c => c.turns.completed).slice(0, 16);\n  const laneIds = new Set(lanes.map(l => l.id));\n  const turns = view.fleet.filter(t => laneIds.has(t.session));\n  const ends = turns.flatMap(t => [timestamp(t.started), timestamp(t.ended)]);\n  const [minimum, maximum] = bounds(ends);\n  const hi = ends.length ? maximum : 0, lo = Math.max(ends.length ? minimum : 0, hi - 7 * 86400000);\n  const x = time => 255 + (time - lo) / Math.max(hi - lo, 1) * 701;\n  text(32, 746, 'Research turns \u00b7 16 most recent conversations, up to seven days', 'heading');\n  lanes.forEach((c, i) => {\n    const y = 775 + i * 26;\n    text(32, y + 9, `${c.lab} \u00b7 ${c.role} ${c.task === 'unknown' ? c.id.slice(0, 6) : c.task}`.slice(0, 31), 'tiny');\n    line(255, y + 5, 956, y + 5);\n    for (const t of turns.filter(t => t.session === c.id && timestamp(t.ended) >= lo))\n      rect(x(Math.max(lo, timestamp(t.started))), y, Math.max(2, x(timestamp(t.ended)) - x(Math.max(lo, timestamp(t.started)))), 10,\n        c.role === 'worker' ? '#25a68a' : '#4f67be', 'rx=\"3\"');\n  });\n  const bottom = 797 + Math.max(1, lanes.length) * 26;\n  if (ends.length) { text(255, bottom, new Date(lo).toISOString().slice(0, 16).replace('T', ' '), 'tiny'); text(790, bottom, new Date(hi).toISOString().slice(0, 16).replace('T', ' '), 'tiny'); }\n  else text(70, 790, 'Turn timing will appear as upgraded runtimes record it.', 'sub');\n  const worker = s.workersTiming;\n  text(32, bottom + 40, `Workers: peak ${s.turns.completed ? worker.peak : '?'} simultaneous \u00b7 observed agent time ${s.turns.completed ? span(worker.agentMs) : '?'} \u00b7 elapsed activity ${s.turns.completed ? span(worker.elapsedMs) : '?'}`, 'sub');\n  text(32, bottom + 65, `${s.coverage.total}/${s.calls} token totals \u00b7 ${s.cache.calls}/${s.calls} cache measurements \u00b7 ${s.timedCalls}/${s.calls} timestamps \u00b7 ? unknown \u00b7 * partial`, 'sub');\n  return `<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 ${w} ${bottom + 88}\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">${xml(view.label)} activity</title><desc id=\"desc\">Received tokens, cost, cache rates, and observed research turns. Unknown values are not zero.</desc><style>text{font-family:system-ui,sans-serif;fill:#26374d;font-size:14px}.title{font-size:24px;font-weight:650}.heading{font-size:16px;font-weight:600}.metric{font-size:25px;font-weight:600}.sub{font-size:13px;fill:#53647a}.tiny{font-size:11px;fill:#53647a}</style><rect width=\"100%\" height=\"100%\" fill=\"#fff\" rx=\"12\"/>${out.join('')}</svg>\\n`;\n}\n", "status-report.mjs": "// Usage: node .research/tools/status-report.mjs stats [--lab LAB] [--json]\n//        node .research/tools/status-report.mjs check [--json]\n// Historical replay only. Use history.mjs report for current accounting.\n// stats reproduces the legacy Numbers block: everything since its\n// last one. Notes and inbox use one committed Git snapshot; receipts and disk are live. A number\n// no record supports is left out or marked unknown, never estimated. Receipts carry no\n// time, so the block carries a hidden `<!-- totals: ... -->` line and the next report\n// subtracts it.\n// check lists each lab's newest report that SUMMARY.md does not fold. Exit 1 if any.\n// node status-report.mjs --sha prints the sha256 of this file, to check a copy is exact.\nimport { execFileSync } from \"node:child_process\";\nimport { createHash } from \"node:crypto\";\nimport { existsSync, readFileSync, readdirSync, statfsSync } from \"node:fs\";\nimport { dirname, join, resolve } from \"node:path\";\n\nconst argv = process.argv.slice(2);\nif (argv.includes(\"--sha\")) {\n  const self = readFileSync(process.argv[1], \"utf8\").replace(/\\s+$/, \"\") + \"\\n\";\n  console.log(createHash(\"sha256\").update(self).digest(\"hex\"));\n  process.exit(0);\n}\nconst flag = (name) => { const i = argv.indexOf(name); return i >= 0 ? argv[i + 1] : undefined; };\nconst command = argv[0], asJson = argv.includes(\"--json\");\nconsole.error(\"Historical report helper: these legacy totals mix cost bases and may treat missing peers as zero. Use history.mjs report for current accounting; do not compare its totals by subtraction.\");\nif (command !== \"stats\" && command !== \"check\") {\n  console.error(\"usage: node status-report.mjs stats [--lab LAB] [--json] | check [--json]\");\n  process.exit(2);\n}\n\nlet root = resolve(\".\");\nwhile (!existsSync(join(root, \".research\", \"LAB.md\"))) {\n  if (dirname(root) === root) { console.error(\"status-report: not inside a lab (no .research/LAB.md)\"); process.exit(2); }\n  root = dirname(root);\n}\nconst research = join(root, \".research\");\nconst git = (...args) => {\n  try { return execFileSync(\"git\", args, { cwd: root, encoding: \"utf8\", stdio: [\"ignore\", \"pipe\", \"ignore\"], maxBuffer: 1 << 30 }).trim(); }\n  catch { return undefined; }\n};\nfunction frontmatter(text) {\n  const m = /^---\\n([\\s\\S]*?)\\n---(?:\\n|$)/.exec(text ?? \"\");\n  if (!m) return undefined;\n  const out = {};\n  let open;\n  for (const line of m[1].split(\"\\n\")) {\n    const item = /^\\s+-\\s+(.*)$/.exec(line);\n    if (item && open) { out[open].push(item[1].trim()); continue; }\n    const kv = /^([A-Za-z_][A-Za-z0-9_-]*):\\s*(.*)$/.exec(line);\n    if (!kv) continue;\n    open = kv[2].trim() === \"\" ? kv[1] : undefined;\n    out[kv[1]] = open ? [] : kv[2].trim();\n  }\n  return out;\n}\nconst list = (value) => Array.isArray(value) ? value : /^\\[(.*)\\]$/.exec((value ?? \"\").trim())?.[1].split(\",\").map((s) => s.trim()).filter(Boolean) ?? (value ? [value] : []);\n\n// Status reports: .research/status-reports/<yyyy-mm-ddThhmm>Z-<lab>-<trigger>.md\nconst REPORT_RE = /^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{4}Z)-([a-z][a-z0-9]{1,11})-(housekeeping|goal|asked)\\.md$/;\nconst reportsDir = join(research, \"status-reports\");\nconst reports = existsSync(reportsDir) ? readdirSync(reportsDir).filter((f) => REPORT_RE.test(f)).sort() : [];\nconst newest = new Map(); // lab -> its newest report; names sort by their UTC stamp\nfor (const file of reports) newest.set(REPORT_RE.exec(file)[2], file);\n\nif (command === \"check\") {\n  const page = join(research, \"SUMMARY.md\");\n  const summary = existsSync(page) ? frontmatter(readFileSync(page, \"utf8\")) ?? {} : undefined;\n  const folds = new Set(list(summary?.folds));\n  const here = git(\"config\", \"--get\", \"pe.lab\") || undefined;\n  const unfolded = [...newest.values()].filter((f) => !folds.has(f));\n  if (asJson) console.log(JSON.stringify({ summary: summary !== undefined, by: summary?.by ?? null, unfolded }));\n  else if (!unfolded.length) console.log(`summary: folds every lab's newest report (${newest.size} lab${newest.size === 1 ? \"\" : \"s\"})`);\n  else {\n    const names = unfolded.map((f) => `status-reports/${f}`).join(\", \");\n    console.log(summary === undefined ? `summary: no SUMMARY.md folds ${names} yet; the next report writes it`\n      : `summary: SUMMARY.md${summary.by ? ` (by ${summary.by})` : \"\"} does not fold ${names}; ` +\n        (summary.by && summary.by === here ? \"you wrote it last: fold it in and push again\" : \"its writer folds it in\"));\n  }\n  process.exit(unfolded.length ? 1 : 0);\n}\n\n// Pin the record once: a manager can keep editing or committing while a report runs.\nconst head = git(\"rev-parse\", \"--verify\", \"HEAD\");\nif (!head) { console.error(\"status-report: commit the lab record before reporting\"); process.exit(2); }\nconst paths = (git(\"ls-tree\", \"-r\", \"--name-only\", \"-z\", head, \"--\", \".research\") ?? \"\").split(\"\\0\").filter(Boolean);\nconst recordPaths = paths.filter((p) => /^\\.research\\/(?:LAB\\.md|(?:notes|inbox|status-reports)\\/[^/\\r\\n]+\\.md)$/.test(p));\n// Read the small record files in one Git process, without touching live files or\n// starting a process per note. cat-file frames each blob with its byte length.\nconst record = new Map();\nif (recordPaths.length) {\n  const blobs = execFileSync(\"git\", [\"cat-file\", \"--batch\"], { cwd: root,\n    input: recordPaths.map((p) => `${head}:${p}\\n`).join(\"\"), maxBuffer: 1 << 30 });\n  let offset = 0;\n  for (const path of recordPaths) {\n    const end = blobs.indexOf(10, offset);\n    const [, type, length] = blobs.subarray(offset, end).toString().split(\" \");\n    if (type !== \"blob\" || !/^\\d+$/.test(length)) throw new Error(`cannot read committed record: ${path}`);\n    offset = end + 1;\n    record.set(path, blobs.subarray(offset, offset + Number(length)).toString(\"utf8\"));\n    offset += Number(length) + 1;\n  }\n}\nconst localLab = git(\"config\", \"--get\", \"pe.lab\");\nconst lab = flag(\"--lab\") ?? (localLab || \"lab\");\nconst labText = record.get(\".research/LAB.md\") ?? \"\";\nconst filed = recordPaths.filter((p) => p.startsWith(\".research/status-reports/\")).map((p) => p.split(\"/\").pop()).filter((f) => REPORT_RE.test(f)).sort();\nconst previous = [...filed].reverse().find((f) => REPORT_RE.exec(f)[2] === lab);\nconst priorText = previous ? record.get(`.research/status-reports/${previous}`) : undefined;\nconst prior = priorText === undefined ? undefined : frontmatter(priorText) ?? {};\nlet base = prior?.head && git(\"rev-parse\", \"--verify\", \"--quiet\", `${prior.head}^{commit}`);\nif (prior && !base) base = git(\"log\", \"-1\", \"--format=%H\", \"--diff-filter=A\", head, \"--\", `.research/status-reports/${previous}`);\nconst since = prior ? Date.parse(prior.at ?? \"\") || Date.parse(REPORT_RE.exec(previous)[1].replace(/T(\\d\\d)(\\d\\d)Z$/, \"T$1:$2Z\")) : undefined;\nconst range = base ? [`${base}..${head}`] : [];\nconst count = (...args) => Number(git(\"rev-list\", \"--count\", ...args) ?? NaN);\n\n// Commits. Labs commit as `<lab> (Persistent Eclipse)`; other identities stay unattributed.\nconst author = `^${lab} (Persistent Eclipse)`; // git's basic regex: the parentheses are literal\nconst authors = {};\nfor (const name of (git(\"log\", \"--format=%an\", ...(base ? [`${base}..${head}`] : [head])) ?? \"\").split(\"\\n\").filter(Boolean)) authors[name] = (authors[name] ?? 0) + 1;\nconst commits = {\n  all: { since: base ? count(`${base}..${head}`) : null, total: count(head) },\n  lab: { since: base ? count(`--author=${author}`, `${base}..${head}`) : null, total: count(`--author=${author}`, head) },\n  authors,\n};\n\n// Notes at the pinned commit. A standalone unnamed lab owns its R-<n> notes;\n// a shared record must name their owner under `Unnamed ids:`.\nconst STATES = [\"supported\", \"open\", \"disputed\", \"refuted\", \"superseded\"];\nconst unnamedOwner = /^[ \\t]*Unnamed ids:[ \\t]*([a-z][a-z0-9]{1,11})/m.exec(labText)?.[1];\nconst standalone = !localLab && !flag(\"--lab\") && !paths.some((p) =>\n  p.startsWith(\".research/labs/\") || /^\\.research\\/notes\\/R-[a-z][a-z0-9]*-/.test(p));\nconst ownsUnnamed = unnamedOwner ? unnamedOwner === lab : standalone;\nconst ownId = (id) => new RegExp(`^R-${lab}-[1-9][0-9]*$`).test(id) || (ownsUnnamed && /^R-[1-9][0-9]*$/.test(id));\nconst states = Object.fromEntries(STATES.map((s) => [s, 0])), own = Object.fromEntries(STATES.map((s) => [s, 0]));\nlet ownTotal = 0;\nfor (const path of recordPaths.filter((p) => /^\\.research\\/notes\\/R-[^/]+\\.md$/.test(p))) {\n  const file = path.split(\"/\").pop();\n  const state = frontmatter(record.get(path))?.state;\n  if (state in states) states[state]++;\n  if (ownId(file.slice(0, -3))) { ownTotal++; if (state in own) own[state]++; }\n}\nconst changes = [], delta = Object.fromEntries(STATES.map((s) => [s, 0]));\nlet added = 0, addedOwn = 0;\nif (base) {\n  for (const row of (git(\"diff\", \"--name-status\", \"--no-renames\", ...range, \"--\", \".research/notes\") ?? \"\").split(\"\\n\").filter(Boolean)) {\n    const [status, path] = row.split(\"\\t\");\n    const id = /\\/(R-[^/]+)\\.md$/.exec(path)?.[1];\n    if (!id) continue;\n    const before = status === \"A\" ? undefined : frontmatter(git(\"show\", `${base}:${path}`))?.state;\n    const after = status === \"D\" ? undefined : frontmatter(record.get(path))?.state;\n    if (status === \"A\") { added++; if (ownId(id)) addedOwn++; }\n    if (before === after) continue;\n    if (before in delta) delta[before]--;\n    if (after in delta) delta[after]++;\n    changes.push({ id, from: before ?? \"new\", to: after ?? \"deleted\" });\n  }\n}\n\n// New artifacts since: one per report, review, or intel note; one per run or proof folder.\nconst artifacts = {};\nif (base) {\n  const paths = (git(\"diff\", \"--name-only\", \"--diff-filter=A\", ...range, \"--\", \".research\") ?? \"\").split(\"\\n\").filter(Boolean);\n  for (const [key, folder] of [[\"reports\", \"reports\"], [\"runs\", \"runs\"], [\"reviews\", \"reviews\"], [\"intel\", \"intel\"], [\"patches\", \"patches\"], [\"proofs\", \"lean\"]]) {\n    const hits = paths.filter((p) => p.startsWith(`.research/${folder}/`)).map((p) => p.split(\"/\").slice(0, [\"runs\", \"lean\", \"patches\"].includes(folder) ? 3 : 4).join(\"/\"));\n    artifacts[key] = new Set(hits.filter((p) => folder === \"intel\" ? p.endsWith(\".md\") && !p.endsWith(\"INDEX.md\") : true)).size;\n  }\n}\n\n// Inbox: sent and received since, and what is still open to this lab.\nconst inbox = { sent: base ? 0 : null, received: base ? 0 : null, open: 0 };\nconst fresh = new Set(base ? (git(\"diff\", \"--name-only\", \"--diff-filter=A\", ...range, \"--\", \".research/inbox\") ?? \"\").split(\"\\n\").filter(Boolean).map((p) => p.split(\"/\").pop()) : []);\nfor (const path of recordPaths.filter((p) => p.startsWith(\".research/inbox/\"))) {\n  const file = path.split(\"/\").pop();\n  const fm = frontmatter(record.get(path));\n  if (!fm) continue;\n  const to = list(fm.to), mine = fm.from !== lab && (to.includes(lab) || to.includes(\"all\"));\n  if (fresh.has(file) && fm.from === lab) inbox.sent++;\n  if (fresh.has(file) && mine) inbox.received++;\n  if (mine && fm.state === \"open\") inbox.open++;\n}\n\n// Effort: this lab's receipts from history.mjs. Since is this total minus the last report's.\nlet e