        # The default mission, for a lab that has not recorded its own MISSION.md.
        mission: |
          # Mission: Blue Team
          Mode: blue-team

          Find concrete primitives and improve the code with the smallest compatible guard
          or correction. Read the source closely, challenge every claim, and validate what
          holds with a reproducible run. A useful fix needs no CVSS threshold, exploit chain, or
          headline impact. Prefer an explicit invariant, a narrow reachable edge case, and a
          change that preserves documented behavior, public interfaces, and valid inputs.

          For each candidate, record what the primitive enables, its preconditions, existing
          guards, and counterconditions in the internal research note. Load pe-patch. Compare
          the smallest guard with alternatives and test both the corrected case and nearby
          valid behavior. Work against the pinned revision in a scratch fork; keep the study
          source unchanged. Preserve a reviewable patch, regression checks, commands, results,
          compatibility limits, and provenance under `.research/patches/<R-id>/`.

          The deliverable is a PR-ready patch and a standalone PR title and description under
          `.research/reports/`. The reporter receives this entire mission, the supported note,
          the patch, and validation. Use:

              Title: [Precise engineering correction]
              ## Change
              [Observed edge case, intended invariant, and the minimal correction.]
              ## Compatibility
              [Behavior and interfaces preserved; any deliberate observable change.]
              ## Validation
              [Regression and compatibility checks actually run, revision, results, and gaps.]

          Explain the actual behavior accurately in ordinary maintenance language. Keep
          exploit recipes, speculative chains, severity marketing, and unnecessary security
          impact out of the public-facing draft. Keep that analysis in the internal evidence.
          Do not mislabel the fix, omit a material compatibility risk, claim a test ran when it
          did not, or evade a project's reporting policy. Follow the source's contribution and
          security policies when choosing a channel. Nothing is submitted automatically; the
          operator decides publication and can authorize opening the prepared pull request.
        # Lab task skills, served to any agent working inside a lab.
        skills:
          pe-git-research:
            description: "Record and revisit source-linked research claims. Covers note IDs, evidence, assumptions, links, Git history, impact reviews, experiments, and handoffs. LOAD EARLY before writing notes."
            content: |
              ---
              name: pe-git-research
              description: Record and revisit source-linked research claims. Covers note IDs, evidence, assumptions, links, Git history, impact reviews, experiments, and handoffs. LOAD EARLY before writing notes.
              ---

              # Git Research

              The lab's memory is a set of plain Markdown notes under `.research/`. Each note makes one claim, ties it to something a reader can inspect, and keeps the evidence against it. Git preserves the history. No database or generated index is required.

              Keep the record useful to the next researcher. Preserve results, reusable methods, and failed approaches that would otherwise be repeated. Routine exploration can stay in a task answer or log; it does not need a separate note. The mission decides what is worth investigating.

              ## Research outlook

              Zoom out. Take a deep breath. See the forest for the trees, then dig in.

              We want researchers web searching, hunting, running little scripts, and inspiring
              each other to find the interesting detail. Don't turn this into a research project
              about kerning or cosmetic decimal precision. Follow a small detail when it matters
              to the question, not simply because it is easy to measure.

              Don't let "the code is clean" or "the problem is perfectly complete" close the
              investigation. Ask what those conclusions actually cover. There are other seams,
              usages, combinations, assumptions, and histories to examine. Read more. Try more
              things. Do more web search. Ask pe-muse for tangential angles, then turn a promising
              one into something you can inspect or test.

              Stay professional and realistic, but believe a useful discovery is possible. The
              one who finds it is the one who's looking. We are given the chance to look. A lot.

              When findings plateau, don't become discouraged and give up. It is a reason to read
              the code again, with a different question. Keep evidence that rules out an idea,
              share surprises and useful dead ends, and let one researcher's result inspire
              another's next experiment. A negative result can close an avenue without exhausting
              the subject. Optimism supports effort; evidence decides claims.

              Stay inspired, positive, creative, weird, and real.

              ## 1. Begin with the lab

              Read **all** of `.research/MISSION.md`, or the verbatim mission in your brief. It sets priorities and deliverables. Also consult:

              | File | Governs |
              | --- | --- |
              | `.research/LAB.md` | Lab policy, including whether the manager may commit |
              | `.research/ENV.md` | Available compute, useful toolchains, and operator limits |
              | `.research/FRONTIER.md` | Questions already explored, partial passes, and reasons to revisit |
              | `.research/LABELS.md` | Optional: the lab's shared label vocabulary |
              | `.research/notes/R-<id>.md` | Individual claims and their evidence |
              | `.research/reviews/` | Impact reviews across source revisions |
              | `.research/runs/REQ-<id>/` | Substantial experiments worth retaining, with inputs and results |
              | `.research/scratch/T-<id>/` | A researcher's code, experiments, and artifacts |
              | `.research/vendor/` | Published dependency source retained as evidence |

              By default, every researcher can search the web, clone relevant sources, install ordinary development dependencies, write code, and run local experiments. Proceed within the mission unless the operator states a limit; missing policy is not a read-only mode. For source history, run Git **inside the source submodule** with `git -C sources/<slug> ...`. Keep the pinned checkout stable; use task scratch for changes and builds.

              A note's `kind`, `state`, and any severity score answer different questions. Do not use a CVSS score, mission priority, or exploitability threshold to decide whether an observation or mathematical result deserves a record.

              ## 2. Shared work, one final writer

              The manager and subagents are trusted collaborators. Skills suggest techniques,
              not tool permissions. Anyone can investigate, write code, search, and test an idea.

              **The manager owns the durable record and shared Git state.** It reconciles useful results,
              allocates permanent IDs, updates shared notes, and stages and commits reviewed work
              under the lab's policy. Source pins, branches, merges, and pushes stay with the manager.

              **Researchers work in `.research/scratch/T-<id>/`.** Keep experiments, patches,
              search receipts, and outputs there, using independent scratch copies of source.
              Cloning and fetching a repository into your own scratch is routine research; it does
              not change the lab's source pins or authorize worker commits.
              The shared compute checkout in §7 is the coordination exception. Return artifacts
              and the evidence needed to review them; a small task can finish with a concise answer.
              If preparing a claim note, use `id: draft`. No worker staging, commits, or PR workflow
              is needed to hand work back.

              For a researcher, shared records are read-only: `.research/notes/`,
              `.research/intel/` (including `INDEX.md`), and the lab-wide Markdown files. When a
              skill says to write or update one, prepare the draft or proposed change in your
              own task folder for the manager to merge. Do not edit another researcher's folder.
              The shared compute checkout is the exception; use it as described in §7.

              Finish artifact edits before sending the final result. The runtime saves the answer
              and completion marker where supported; otherwise write `.done` last. The manager
              promotes settled work after completion, not files still being edited.

              ## 3. Durable claims

              When a result merits a durable note, keep one independently disputable claim per note. Use `.research/notes/R-1.md`, `.research/notes/R-2.md`, and so on. Prefer updating an existing claim over making a near-duplicate.

              IDs are permanent, never recycled, and never zero-padded: `R-1`, `R-10`, `REQ-3`, `T-4`. The manager assigns them. Sort numerically (`sort -V`), not lexicographically.

              ### Note format

              ```markdown
              ---
              id: R-42
              source: app
              kind: hypothesis
              state: open
              labels: [area:auth, risk:auth-bypass, lens:entry-point]
              targets: [sources/app/src/api/routes.ts::POST /account]
              links: {}
              checked_at: <full 40-character source SHA>
              ---
              # Account update may bypass authentication

              ## Summary
              verdict: open — route-level guard not found
              - src/api/routes.ts:88 registers POST /account on the public router
              - src/api/routes.ts:88 has no guard attached at registration
              against: the parent router may enforce authentication; not yet traced
              next: trace the parent middleware and every alternate entry

              ## Claim
              POST /account may reach the update handler without a valid session.

              ## Evidence
              - At <source SHA>, routes.ts registers the handler at line 88.
              - No authentication guard appears on that registration.

              ## Against
              - The parent router's middleware has not been followed.

              ## Assumptions
              - No enclosing router or proxy rejects unauthenticated requests first.
              - No alternate registration changes the effective guard chain.

              ## Revisit when
              - Route registration, parent middleware, or caller configuration changes.

              ## Next
              - Follow the handler from external entry to the authorization decision.
              ```

              `## Summary` is the fast read for the manager and `pe-reporter`: one-line verdict, **up to three** checkable `file:line` facts, the strongest objection, and one next question. Include it on every `kind: finding` and on notes longer than roughly forty lines. The rest of the note holds the actual argument; a summary never replaces evidence.

              ### Fields and evidence states

              | Field | Meaning |
              | --- | --- |
              | `source` | Source slug corresponding to `sources/<slug>` |
              | `kind` | `observation`, `hypothesis`, `finding`, `negation`, or `question` |
              | `state` | `open`, `supported`, `disputed`, `refuted`, or `superseded` |
              | `checks` | Optional: `[review, run, proof]`, the checks done beyond the author's argument |
              | `labels` | Two to four `family:value` search hints about subject or approach; not Git tags |
              | `targets` | Paths, symbols, lines, or artifacts that a reader can actually open |
              | `links` | Directed relationships to other R-IDs; see §5 |
              | `checked_at` | The revision or archived artifact **actually checked** |
              | `imported_from` | Only on a claim a lab pack carried in: `<lab>:R-<n> sha256:<pack sha256>` |
              | `reported_state` | Only with `imported_from`: the state the other lab reported; `state` is this lab's own |

              An *observation* records a seen condition; a *hypothesis* offers a testable explanation; a *finding* states a conclusion supported by evidence; a *negation* records counterevidence to another conclusion; a *question* preserves an unresolved line of inquiry. The `state` describes the standing of that particular claim, not its importance. `refuted` and `superseded` are records to retain, not files to delete.

              `state` is the claim's standing; `checks` says what has been done beyond the author's
              argument, so a reader can find, say, every claim with a machine-checked proof, in
              either list form:

              ```bash
              rg -l -U '^checks:(.*\bproof\b|(\n +- .*)*\n +- proof$)' .research/notes
              ```

              | Check | Meaning |
              | --- | --- |
              | `review` | Another researcher reconstructed or challenged the claim and it held |
              | `run` | A reproducible run, computation, or reproduction supports it |
              | `proof` | A machine-checked proof of the stated claim, with its axioms recorded |

              The checks are kinds of evidence, not ranks; record each one that covers the claim as
              written, and omit the field when there is none. The details belong in the note's
              `## Validation` and its targets. A supported claim may have no checks yet; a proved
              one can still be `disputed` if it formalizes the wrong statement. Keep standing out of
              labels; a `status:` or `state:` label only repeats a field. A label naming an approach,
              such as `review:statement-audit`, is fine.

              ### Labels

              Labels let anyone filter the record with `rg -w`, so reuse beats invention. Use
              families for subject and approach: `area:` for parts of the subject (sections of
              MAP.md), `lens:` or `method:` for ways of looking, and mission families such as
              `risk:` where they help. A one-off label is fine when it records a real distinction.
              A lab can list its common labels in `.research/LABELS.md`, one per line with the label
              in backticks; lint then advises on labels it does not list:

              ```markdown
              - `area:interpolation` the Taylor and Hermite recovery steps
              - `lens:parameter-audit` re-deriving a construction's constants and ranges
              ```

              ### One claim, durable evidence

              A note holds one claim and the argument for it. Move long derivations, logs, tables,
              and experiment output into `runs/REQ-<id>/` or `reports/` and target them; lint
              advises splitting notes past about two hundred lines. Canonical notes cite durable
              evidence only. Scratch is not kept or packed, so promote an artifact out of
              `scratch/` before a note targets it; drafts may still cite their own scratch.

              Use the full **40-character source commit SHA** on a new note. `checked_at` is never the superproject commit or file modification time. Advance it only after rechecking the claim against that source revision. Editing prose, relocating a path, or fetching a new checkout does **not** refresh the evidence.

              For an archive not yet associated with a source commit, use `checked_at: sha256:<hash>`. For dependency evidence, see below.

              ### What counts as evidence

              Give the reader enough to repeat the reasoning: exact source revision, path and symbol, relevant lines or excerpt, configuration, caller or execution path, and the condition observed. Say what you have not read or ruled out. A model's assertion is not independent evidence.

              Every substantive conclusion should have both `## Evidence` and `## Against`. Do not hide contradictory paths or replace a once-supported conclusion with a cleaner story. Git history and negative results are part of the research.

              ### Targets, archives, and dependencies

              Targets are **anchors**, not necessarily source files. Common forms:

              | Target | Points to |
              | --- | --- |
              | `sources/<slug>/<path>::<symbol>` | Code or configuration in a pinned checkout |
              | `intel/<file>:<lines>` | An extracted paper, specification, advisory, or web source |
              | `runs/<REQ>/<file>` | A retained experiment's inputs, logs, or result |
              | `lean/<R-id>/<file>::<theorem>` | A formal statement or proof artifact |
              | `patches/<R-id>/<file>` | A retained patch |
              | `reports/<file>` | A durable report or other supporting artifact |

              Non-source paths above refer to evidence kept under `.research/`. Cite the extracted text of a paper or spec, with its lines, rather than inventing PDF line numbers. A run cites the log or artifact it produced.

              If a claim depends on published dependency code, retain the relevant files at `.research/vendor/<pkg>@<version>/`, use `checked_at: <source SHA> <pkg>@<version>`, and target `vendor/<pkg>@<version>/<path>::<symbol>`. `pe-lint` rejects a dependency pin or target that has no vendor copy.

              A missing or moved target requires **reconciliation**. It does not make the associated claim false, fixed, or obsolete. `pe-lint` checks that named target files exist.

              ### Assumptions are first-class

              A target tells us where to look. An assumption tells us **what must be true for the reasoning to hold**. Write specific, checkable conditions in `## Assumptions`, especially around guards, trust boundaries, configuration defaults, caller validation, and environment guarantees.

              Keep a one-off assumption in prose. Give it a separate `kind: observation` note when it warrants investigation or several claims depend on it. Then link those claims with `depends_on`. If five conclusions rely on one unverified authorization guard, record that guard once. An impact review can then find all five when the guard changes.

              ## 4. Know which Git history answers the question

              The lab is a Git superproject; source checkouts are Git submodules. Their histories do different jobs.

              ```bash
              # Superproject: when the lab changed a source pin
              git log -- sources/<slug>

              # Source submodule: what changed in the actual code
              git -C sources/<slug> rev-parse HEAD
              git -C sources/<slug> log -p -- <path>
              git -C sources/<slug> diff <base>..<head> -- <path>
              git -C sources/<slug> blame -- <path>
              ```

              Do **not** infer source history from `git log -p sources/<slug>/<path>` at the superproject root. It may exit successfully with no output because the source file lives inside a submodule. That is not evidence that the file never changed.

              ## 5. Relationships between claims

              Use only four directed relations in `links`:

              | Relation | Meaning |
              | --- | --- |
              | `supports` | This note contributes supporting evidence to another |
              | `refutes` | This note supplies counterevidence under stated conditions |
              | `depends_on` | This conclusion requires the linked claim to hold |
              | `supersedes` | This formulation replaces an older one without losing its history |

              Example: `links: {refutes: [R-31], depends_on: [R-12]}`.

              Links describe how notes bear on one another; **they do not transfer truth**. If you refute a claim that once defeated a hypothesis, you have reopened the hypothesis, not proved it. State the limits and conditions of a negation explicitly.

              Links are stored one way. Search for incoming references with `rg -w 'R-31' .research/notes`. Also inspect prose references: older notes may mention a guard or dismissal without linking it.

              When a note relies on, contradicts, or replaces another note, link it; a prose mention
              alone is invisible to an impact review. Lint advises on R-IDs a note mentions but does
              not link. A passing comparison can stay prose.

              `kind: negation` and `refutes` are not the same thing. A negation is any recorded
              negative result: counterevidence, a barrier, an impossibility within a stated model,
              or a dead end. Use `refutes` only when the negation is counterevidence to **another
              note in this lab**. A barrier about the source's method or a published theorem is a
              negation with `depends_on` or no links. When a `refutes` holds, update the target's
              `state` to `disputed` or `refuted`, or narrow the negation's scope; lint advises when a
              supported refutation leaves its target supported.

              ### Correcting a claim

              Fix wording, evidence, or a narrow error in place; Git keeps the history, so commit
              it with the reason in the message. When a correction changes
              **what the claim states** (a different theorem, range, or condition), write a new note
              with `links: {supersedes: [R-old]}` and set the old note's `state: superseded`. Both
              remain readable. Lint advises when the two sides disagree.

              ## 6. Five research operations

              These are ways of working with ordinary shell commands and note edits, **not** registered slash commands.

              ### `capture <claim>` — preserve a new observation or argument

              1. Check `git status --short` and the source's `git -C sources/<slug> rev-parse HEAD`.
              2. Use `rg` to find existing notes on the same path, symbol, condition, or claim.
              3. Read the relevant source and contrary paths. Distinguish a fact seen in code from a proposed consequence.
              4. Update the matching note or write the narrowest new one, with evidence, objections, assumptions, and a next check.
              5. Lint after a durable note edit: `node .research/tools/lint-notes.mjs`.

              ### `challenge <ID>` — try to break the recorded conclusion

              Read the note **at its `checked_at` revision** and at the current source pin. Follow both supporting and contradictory paths: entry points, callers, middleware, configuration, dependency behavior, and alternate routes. Test the assumptions individually; ask which failing condition would collapse the conclusion.

              When the counterargument is independently durable, record a **negation note** with `links: {refutes: [R-...]}`. Say exactly which claim it disputes and under what conditions its counterevidence stops applying. Do not rewrite away the original evidence.

              ### `impact <source> <old>..<new>` — revisit research after code changes

              Keep two verdicts separate for **every affected note**:

              | Question | Outcomes |
              | --- | --- |
              | Can we locate its target? | `unchanged`, `relocated`, `ambiguous`, `missing` |
              | Does its recorded conclusion still hold? | `not-rechecked`, `supported`, `weakened`, `contradicted` |

              Judge **the statement and state the note actually records**. For a note in `state: refuted`, `hold: supported` means that refutation still stands; `hold: contradicted` means the refutation no longer stands. Relocated code can still behave the same; unchanged code can behave differently when a caller or guard changes. Neither verdict determines the other.

              Perform the review in this order:

              1. Resolve `<old>` and `<new>` to full SHAs. Inspect renames and the actual changes in the submodule: `git -C sources/<slug> diff --find-renames --stat <old>..<new>`; read relevant patches, not just the stat.
              2. Find directly affected targets **and assumptions**. Check guards and shared validation paths early.
              3. Walk `supports`, `refutes`, `depends_on`, and `supersedes` in both directions. Search prose citations too. Start with old negations and shared assumptions: they can invalidate many apparently unrelated conclusions.
              4. Look for new callers, entry points, configuration, dependencies, and code with **no existing note**.
              5. Save both verdicts, the evidence for them, and the next read to `.research/reviews/<date>-<range>.md`.

              A review can look like this:

              ```text
              Source: app, <old full SHA> -> <new full SHA>

              R-18  locate: unchanged; hold: contradicted
                The previous claim that this route attaches requireAuth no longer holds.
                Next: inspect parent middleware and alternate registrations.

              R-31  locate: relocated; hold: not-rechecked
                The guard supporting this old conclusion moved.
                Its dependents need a fresh call-path trace.

              R-57  locate: relocated; hold: supported
                Handler moved; new caller path and original invariant were rechecked.

              Coverage gap
                A new background-worker caller has no associated research.
              ```

              An impact review assesses the **record**; it is not a new source finding. Preserve historical notes. A review explains what changed, why the prior reasoning is or is not still supported, and what remains unresolved. A removed guard is a reason to investigate, not proof of a vulnerability.

              If a note's `checked_at` predates `<old>`, this comparison skips history relevant to that note. Read the skipped range or disclose the coverage gap. Do not quietly treat it as fully reviewed.

              ### `trace <ID>` — reconstruct how a conclusion developed

              Read the note's own Git history and the actual source history:

              ```bash
              git log -p -- .research/notes/R-42.md
              git -C sources/<slug> log -p -- <path>
              git -C sources/<slug> blame -- <path>
              ```

              Separate **what was established at the old pin**, **what changed**, and **what has been verified at the current pin**. Historical truth and current truth are different questions.

              ### `list <filter>` — search the record directly

              Use `rg -w` or `grep -w` over `.research/notes/`, and `sort -V` for numeric IDs. Filter by label, target, state, relation, or text. There is no index to build or refresh.

              ## 7. Experiments and shared compute

              Run small scripts, focused tests, and modest computational checks directly in task
              scratch. No request form or specialist handoff is needed. Install normal build and
              research dependencies as needed, preferring project-local or user-local environments;
              coordinate changes to an environment another researcher is using.
              Keep pinned inputs and enough commands and output to reproduce a meaningful result.

              ### Show your work in a runbook

              Do not trust mental arithmetic for calculations that support a claim. Keep an
              editable runbook in task scratch: a sectioned script or an existing notebook is
              enough. Put explicit inputs and assumptions beside small, named steps you can rerun
              individually or together. Keep decisive outputs and explain what they establish.
              When an input or assumption changes, rerun the affected steps and their dependents;
              make it possible to reproduce the result from a clean start.

              Use exact arithmetic where practical and cross-check a simple case or independent
              method. A successful program does not establish that it models the intended problem.
              Prefer updating this work to scattering calculations across ephemeral shell commands
              or `/tmp` scripts. Temporary files are fine for disposable outputs. When retaining a
              result, the manager promotes the useful runbook, inputs, and evidence together.
              No particular notebook format or additional framework is required.

              ### Share the machine

              For work likely to compete for CPU, memory, disk, or shared build state, consult
              `.research/ENV.md` and current host load. A large compile, long fuzz run, solver sweep,
              or dependency build should have an owner and a bounded budget. Start with **one heavy
              job at a time per lab**. The manager can arrange more capacity when the machine and
              independent build directories support it; record that arrangement in ENV.md.

              ### A shared checkout note

              The manager and every researcher use the same `.research/scratch/_compute/` slot.
              Claim it with an atomic directory creation, **not** a check followed by a write:

              ```bash
              mkdir -p .research/scratch
              mkdir .research/scratch/_compute
              ```

              - Only a successful second command grants the slot. Write `owner.md` inside it:
                task, intended job, start time, expected duration, resource budget, and process or
                session handle once launched. Keep it brief. On another shell, use its equivalent
                create-directory operation that fails when the directory exists.
              - If the slot exists, read `owner.md` and continue other research. An absent note
                still means busy: its owner may be writing it. Retry in a few minutes, or tell the
                manager which job should be next in the existing QUEUE. No polling loop is needed.
              - Keep the slot until the job and its child processes have stopped. Then remove
                your `owner.md` and the empty slot directory. Do not release while a background
                build is still running.
              - After an interruption, the manager checks the recorded process/session before
                clearing a stale slot. Age alone does not mean the job has stopped. Never take
                another researcher's slot or clear it just to get a turn.

              Use separate writable build directories even with the checkout. If repeated heavy
              jobs benefit from a shared build or careful scheduling, assign one researcher with
              `pe-coderunner` to own that work. Other researchers can keep testing smaller ideas.
              The checkout coordinates willing collaborators; it is not a sandbox or a scheduler.

              ### Keep evidence proportional to the result

              For a small check, commands, outcome, and limits in the task answer or claim's
              `## Validation` are enough. For substantial or reusable experiments, the manager can
              retain inputs and results under `.research/runs/REQ-<id>/` and link them from RUNS.
              A REQ identifies retained work; it is not permission to execute. Keep useful failures
              and counterexamples, not every intermediate attempt or duplicated log.

              ```text
              ## Validation
              status: static-only | reproduced | contradicted | blocked
              method: source-trace | local-experiment
              environment: [source commit, configuration, build or artifact identity]
              evidence: [checkable trace, command and output, input, or REQ-ID]
              limits: [what the observation did not establish]
              ```

              For mathematics, record the exact statement checked, toolchain, axioms, and open
              obligations with `pe-math`. For security severity, use `pe-cvss`; a score does not
              change the evidence state. A run result is evidence with limits, not a conclusion
              by itself.

              ### Record reusable primitives

              A useful capability or lemma may matter long before it produces a finding. Keep it as a claim, regardless of score, and add:

              ```text
              ## Primitive
              controlled-by: [actor, input, parameter, or construction]
              requires: [preconditions and configuration]
              enables: [observable capability or result]
              composes-with: [R-IDs whose preconditions it could satisfy]
              counterconditions: [conditions that prevent it]
              ```

              This makes later composition and invalidation possible without prematurely claiming an exploit or theorem.

              ## 8. Commit without taking ownership of other work

              Use `Commits: research` unless the operator says otherwise. Record it in
              `.research/LAB.md`; a missing policy has the same default.

              - `Commits: research` lets the **manager** commit reviewed lab setup, reconciled `.research/` work, relevant source additions, and source pin moves without asking each time. Record each source's origin and pin; a pin move includes its impact review.
              - An explicit `Commits: ask` means **ask before every commit**. Honor any other operator limit and authorization already given.

              Before committing, run `git status --short` and `node .research/tools/lint-notes.mjs`. Lint must pass. The runtime provides the linter. A successful lint checks structure and existing anchors, **not whether the claim is true**.

              The lab's Git log is its research log. Commit coherent results promptly, not once a
              round: a result together with the runs, reports, and intel it cites, plus the record
              updates it causes. Lead the subject with the R-IDs it changes and say what happened to
              the claim, for example `R-14: conditional cube-root width range`,
              `R-9: correct the rank model; R-8 disputed`, or `R-21 supersedes R-6: sharper constant`.
              Then `git log --grep 'R-14'` finds a claim's history. A commit with no claim change
              can start with `lab:`.

              Commit explicit paths rather than whatever happens to be staged:

              ```bash
              git add .research/notes/R-43.md .research/runs/REQ-7/
              git commit -m 'R-43: refute R-31 at 1a2b3c4' -- .research/notes/R-43.md .research/runs/REQ-7/
              ```

              If a permitted source pin moved, include that specific gitlink path **and its impact review**. Other changes may already be staged, including `.gitmodules` and submodule metadata. Leave unrelated paths alone; if unfamiliar staged changes remain, tell the operator.

              Commit worker artifacts only after completion and review. **Subagents never stage, commit, merge, or push.** The manager can add relevant sources as part of the research. Keep pinned study checkouts stable and use scratch for changes. Pushing and external submission follow the operator's destination and authorization; local research permission does not imply publication.

              ## 9. Keep the exploration frontier

              `.research/FRONTIER.md` tracks questions examined **per target and lens**. It is coverage history, not a certificate of safety.

              ```markdown
              ## sources/ssh/sshd.c::grace_alarm_handler
              - explored at <SHA> (R-42): can logging reenter during SIGALRM?
              - partial at <SHA> (R-43): are reachable wrappers async-signal-safe? Wrappers unread.
              - open: do distribution patches change this path?
              revisit: handler or caller changes; a new signal-handling advisory appears
              ```

              In a math lab, key the frontier by paper section, lemma, equation, or formal
              declaration instead of a source file:

              ```markdown
              ## preprint main_full_version.tex::lem:spar-marked-degree
              - explored at <SHA> (R-11, R-14): does the degree bound stay uniform when k grows?
              - partial at <SHA> (R-13): can the V lift be removed? Fixed-density case only.
              - open: is the bound tight for the paper's own replacement forms?
              revisit: a manuscript revision; new literature on growing-width counting
              ```

              After a pass, mark its lens `explored` or `partial`, with the source commit and related R-IDs. A partial pass names what remains unread. `explored` means **that question was asked**, not that the target is safe. Reopen a lens when affected code changes after its recorded commit or new evidence gives a reason.

              ## 10. Worked example: the assumption that stopped holding

              The following sketch uses OpenSSH's 2024 signal-handler regression to illustrate the record. **IDs and commits are fictional**; it is not a sourced vulnerability analysis.

              At an older pin, `R-31` recorded a safety conclusion: the grace-timeout handler could not reach unsafe logging. At a later pin, a researcher notices a changed wrapper and records a hypothesis:

              ```yaml
              id: R-42
              source: ssh
              kind: hypothesis
              state: open
              labels: [area:signal, risk:rce, lens:regression]
              targets: [sources/ssh/sshd.c::grace_alarm_handler]
              links: {}
              checked_at: <full source SHA>
              ```

              **Claim:** the SIGALRM handler may reach logging that is not async-signal-safe. **Evidence:** at the pinned revision, the handler calls a logging wrapper. **Against:** the complete call chain and build conditions have not been established. **Next:** trace every reachable wrapper and check signal safety.

              The challenge is to `R-31`, the earlier **safety claim**. If the changed wrapper defeats its previously documented guard, preserve that separately:

              ```yaml
              id: R-43
              source: ssh
              kind: negation
              state: supported
              checks: [review]
              labels: [area:signal, lens:assumption]
              targets: [sources/ssh/sshd.c::grace_alarm_handler]
              links: {refutes: [R-31]}
              checked_at: <full source SHA>
              ```

              **Claim:** the reasoning in `R-31` no longer covers this path. **Limit:** the path matters only where the grace timeout is enabled. This may overturn the old mitigation argument. It does **not**, by itself, reproduce a vulnerability or prove `R-42`.

              An `impact ssh <old>..<new>` review checks the changed target and its dependents, records `R-31`'s old conclusion as contradicted if the guard no longer holds, and marks the exploitability hypothesis as unresolved until its path is traced. `trace R-42` then compares the note history with `git -C sources/ssh log -p -- sshd.c` and blame.

              The productive question is not merely *what file changed?* It is *which condition did our earlier conclusion depend on, and does that condition still hold?*

              ## Before handing off

              Check that the record answers these questions without the author present:

              1. **Which exact claim** is being made, at which revision and configuration?
              2. **Where can I inspect it?** Do the paths, symbols, extracts, and logs exist?
              3. **What is the strongest evidence against it?** Which assumptions remain unchecked?
              4. **What does it depend on?** Are shared guards and relevant counterclaims linked?
              5. **What changed?** If reviewing a pin move, are location and validity judged separately?
              6. **What happens next?** Is there a concrete experiment, read, revisit trigger, or honest stopping point?

              Lint durable note edits. Preserve contradictory and historical evidence. A small, falsifiable note is better than a polished conclusion nobody can reproduce.
          pe-survey:
            description: "Map a source before investigation. Identify responsibilities, actors, trust boundaries, state, and revision-specific coverage. Maintain the shared taxonomy and expose research gaps."
            content: |
              ---
              name: pe-survey
              description: Map a source before investigation. Identify responsibilities, actors, trust boundaries, state, and revision-specific coverage. Maintain the shared taxonomy and expose research gaps.
              ---

              # Survey

              ## Tools
              - `read`, `glob`, `grep`, and `rg` for source inspection.
              - `bash` for read-only Git history, tree, and revision queries.
              - `pe-git-research` for existing findings, negations, and relationships.
              - Draft MAP changes in task scratch; the manager owns `.research/MAP.md`.
              - Use small scripts, experiments, and web research where they clarify the map; coordinate heavy jobs through `pe-git-research`.

              ## Purpose
              - Survey the entire source at low depth before deep investigation.
              - Establish a common vocabulary for components, actors, boundaries, and states.
              - Identify where external input, authority, ownership, or control changes hands.
              - Build a seam-by-actor coverage matrix tied to an exact source revision and configuration.
              - Expose unread paths, weak assumptions, and high-value questions for `pe-reader`.
              - Maintain the map as source, findings, and research coverage evolve.

              The survey describes **where to investigate**, not whether the source is safe. Avoid turning the first pass into a deep audit.

              ## Orientation
              - Read the complete mission, `SCOPE`, `.research/LAB.md`, and existing research.
              - Identify the source slug, pinned commit SHA, languages, frameworks, and supported platforms.
              - Inspect repository structure, manifests, build configuration, documentation, and tests.
              - Locate major entry points, public interfaces, background tasks, and persistent state.
              - Identify optional features, generated code, dependencies, and configuration-dependent behavior.
              - Review existing findings, negations, and frontier questions before inventing new work.
              - For mathematical sources, load `pe-math` and use the mathematical mapping rules below.

              ## Source Inventory

              Walk the repository broadly, then group related code by responsibility rather than directory.

              ### Sections
              For each subsystem record:

              - **Name:** Short, stable responsibility-based identifier.
              - **Purpose:** What the subsystem does and what it promises.
              - **Source:** Primary files, packages, symbols, and revision.
              - **Entry:** Public APIs, handlers, callbacks, commands, or internal entry points.
              - **Actors:** Who can invoke or influence it.
              - **Trust:** Inputs and assumptions inherited from callers or dependencies.
              - **State:** Data owned, cached, persisted, mutated, or shared.
              - **Effects:** Filesystem, network, process, memory, privilege, or externally visible behavior.
              - **Edges:** Important callers, dependencies, and adjacent sections.
              - **Configuration:** Flags, features, platforms, or modes that change behavior.
              - **Tests:** Existing coverage and obvious missing paths.
              - **Questions:** Unresolved assumptions worth deeper reading.

              Keep descriptions compact. One responsibility may span many directories; one directory may contain several responsibilities.

              ### Architecture
              Map the useful relationships:

              - External entry points → validation → internal operations → observable effects.
              - Data producers → transformations → consumers.
              - Authority sources → delegation → enforcement → privileged operations.
              - State creation → mutation → persistence → invalidation → cleanup.
              - Synchronous calls → callbacks → queues → asynchronous completion.
              - Configuration and feature selection → alternate implementations.
              - Error handling → fallback → retry → recovery.

              Do not enumerate every function. Capture enough structure to direct a targeted source read.

              ## Shared Taxonomy

              Define terminology once in `.research/MAP.md` and reuse it throughout the lab.

              ### Subsystems
              - Name components by responsibility: `auth`, `parser`, `storage`, `scheduler`, `transport`, `policy`.
              - Prefer names from the implementation when clear.
              - Avoid aliases for the same component across different notes.
              - Split sections when responsibilities or security assumptions differ meaningfully.

              ### Actors
              Identify distinct sources of action or influence:

              - `remote-unauth` — Unauthenticated remote input.
              - `remote-auth` — Authenticated remote principal.
              - `local-user` — Local unprivileged user or process.
              - `peer` — Another service, node, or protocol participant.
              - `operator` — Administrator or privileged maintainer.
              - `internal` — Trusted application component or background task.
              - `dependency` — External library, service, or supplied artifact.

              Adapt actors to the actual system. Distinguish access, privileges, and control over inputs. Authentication alone does not establish authorization.

              ### Boundaries
              Name seams where assumptions may change:

              - `parse` — Untrusted representation becomes structured data.
              - `auth` — Identity, permission, or authority is established.
              - `dispatch` — Control passes between handlers, callbacks, or implementations.
              - `state` — Shared, persistent, cached, or mutable state changes.
              - `lifetime` — Resources are created, borrowed, released, or invalidated.
              - `serialize` — Data crosses representation or protocol boundaries.
              - `privilege` — An operation gains authority or reaches a protected resource.
              - `resource` — Inputs consume bounded or unbounded work.
              - `async` — Ordering, cancellation, retries, or concurrency change assumptions.
              - `recovery` — Failure, rollback, restart, or fallback alters normal behavior.

              These are starting labels, not an exhaustive ontology. Preserve project-specific terms when they are more precise.

              ## Seam Discovery

              A seam is a place where trust, control, state, representation, or ownership changes hands.

              For each candidate:

              1. **Locate:** Identify the concrete source path, symbol, or interface.
              2. **Connect:** Find the upstream actor and downstream operation.
              3. **Assume:** State the prerequisite or invariant crossing the seam.
              4. **Classify:** Assign the shared subsystem and boundary labels.
              5. **Separate:** Identify actors whose reachability or privileges materially differ.
              6. **Scope:** Record configuration, platform, or revision constraints.
              7. **Queue:** Suggest one specific invariant or path for deeper examination.

              Pay particular attention to:

              - Externally reachable parsers, decoders, and request handlers.
              - Authentication, authorization, privilege changes, and identity mapping.
              - Filesystem paths, command execution, dynamic loading, and deserialization.
              - Cross-component calls that assume validation occurred elsewhere.
              - Queues, callbacks, timers, retries, and cancellation.
              - Shared caches, ownership transfers, and persistence boundaries.
              - Recovery paths, error fallbacks, and cleanup.
              - Resource accounting, limits, and expensive operations.
              - Optional features and alternate implementations with different guards.
              - Historical fixes whose assumptions may no longer hold.

              Do not label every call a seam. Favor meaningful changes in guarantees or control.

              ## Coverage Matrix

              Record seam-by-actor coverage in `.research/MAP.md`.

              Each matrix is scoped to:
              - Source repository and pinned SHA.
              - Build configuration and enabled features.
              - Relevant platform or runtime.
              - Mission and research scope.

              Use separate matrices when configurations materially change reachable paths. Avoid multiplying every optional flag into an unusable matrix.

              ### Cell States
              - `unread` — Path or invariant not examined.
              - `reading T-id` — Assigned investigation in progress.
              - `read-no-claim` — Examined without a finding; scope and ruled-out questions recorded.
              - `covered-at <sha> (R-id)` — One specific actor path and invariant examined at that revision, with linked evidence.
              - `n/a: <reason>` — Path genuinely unreachable or inapplicable under the stated configuration.

              A covered cell is **not a safety certification**. It records what was investigated, where, and at which revision.

              ### Example `.research/MAP.md`

              ## Source
              - Repository: `sources/example/`
              - Revision: `1a2b3c4`
              - Configuration: Default server build
              - Platform: Linux

              ## Sections

              | Section | Responsibility | Entry | State / Trust |
              | --- | --- | --- | --- |
              | auth | Login, sessions, refresh | `/login`, `/refresh` | Owns credentials and tokens |
              | parser | Request decoding | HTTP handler | Accepts remote bytes |
              | storage | Persistent records | Internal API | Trusts validated identifiers |

              ## Matrix

              | Seam | remote-unauth | local-user | operator |
              | --- | --- | --- | --- |
              | request parser | unread | unread | n/a: server-only |
              | token refresh | covered-at 1a2b3c4 (R-7) | reading T-12 | n/a: inaccessible |
              | storage path | unread | read-no-claim | unread |
              | cleanup | unread | unread | unread |

              ## Open Questions
              - Does token refresh enforce the same invariant through internal callers?
              - Can cleanup run after partial initialization?
              - Does the storage path trust identifiers validated by another component?

              ## Next Reads
              - `pe-reader`: token refresh internal caller path.
              - `pe-reader`: storage path under operator authority.
              - `pe-muse`: cancellation and retry assumptions in cleanup.

              ## Coverage Discipline
              - Record the **actor, path, invariant, revision, and evidence**, not just the file visited.
              - Distinguish a quick read from a completed invariant investigation.
              - Use `read-no-claim` when no durable finding was produced; record meaningful exclusions in `.research/FRONTIER.md`.
              - Use `covered-at` only with a linked research record.
              - Never mark a cell covered because nearby code or another actor path was examined.
              - Mark `n/a` only with a concrete reachability or configuration reason.
              - Preserve unresolved indirect calls, dynamic dispatch, and platform variants.
              - Reopen coverage when a relevant change invalidates the original evidence.
              - Keep completed history through Git and linked notes; avoid silently overwriting conclusions.

              ## Prioritization

              Seed the queue from meaningful coverage gaps, considering:

              - **Reachability:** Which actors can actually reach the seam?
              - **Authority:** What privilege, sensitive state, or protected resource lies beyond it?
              - **Control:** How much of the input or transition can the actor influence?
              - **Assumptions:** How many guarantees are inherited from other components?
              - **Complexity:** How many representations, states, callbacks, or alternate paths are involved?
              - **History:** Prior fixes, regressions, workarounds, and relevant upstream changes.
              - **Evidence:** Existing findings, suspicious patterns, incomplete negations, or MAP gaps.
              - **Cost:** How much reading is needed to test a precise invariant?

              Prioritize high-consequence, reachable, poorly examined seams. Do not equate complexity or file size with risk.

              A useful queue entry names:
              - Exact section and seam.
              - Actor and configuration.
              - Source anchor.
              - Invariant or concrete research question.
              - Expected reading boundary.
              - Related notes and prior coverage.

              ## Mathematics

              When surveying mathematical source, load `pe-math` and replace code-specific categories with:

              - **Sections:** Definitions, theorem families, constructions, proof techniques, and applications.
              - **Entries:** Main statements, conjectures, cited results, and formal declarations.
              - **Dependencies:** Definitions, lemmas, hypotheses, and imported results.
              - **Regimes:** Parameter ranges, dimensions, domains, regularity, limiting cases, and exceptional conditions.
              - **Seams:** Changes of assumptions, quantifier order, proof methods, definitions, or dependent results.
              - **Actors:** Relevant mathematical cases or hypothesis regimes rather than security principals.
              - **Coverage:** Exact statement and regime examined at a specific source revision.

              Map the proof dependency graph in both directions:
              - Which earlier results support a statement?
              - Which later results depend on it?
              - Where are hypotheses strengthened, weakened, or inherited?
              - Which conclusions rely on an unproved or externally cited step?
              - Where might a counterexample invalidate multiple downstream claims?

              Keep the same revision-specific coverage states. A checked lemma does not establish an entire theorem family.

              ## Maintenance & Change Impact
              - Revisit the map after meaningful source changes, new findings, or major research passes.
              - Compare the new revision against previously covered symbols and seams.
              - Identify added entry points, actors, state transitions, and configurations.
              - Reopen cells when relevant guards, callers, dependencies, or assumptions change.
              - Preserve unaffected coverage with its original revision and evidence.
              - Add new seams without discarding old terminology or history.
              - Use `pe-git-research` impact relationships to trace changes into existing findings and negations.
              - Send speculative new branches to `pe-muse`; concrete invariant checks to `pe-reader`.

              Do not regenerate the entire map after each commit. Update the affected structure and coverage.

              ## Handoff

              Return:

              - **Source:** Repository, SHA, configuration, and platform.
              - **Sections:** Responsibility map and principal entry points.
              - **Taxonomy:** Canonical subsystem, actor, and boundary labels.
              - **Seams:** Concrete interfaces and assumptions worth investigating.
              - **Coverage:** New, changed, unread, and reopened matrix cells.
              - **Unknowns:** Dynamic paths, missing source, conditional features, and unresolved reachability.
              - **Priority:** Best next reading tasks, with anchors and invariants.
              - **Changes:** Proposed MAP edits and affected prior research.

              The manager merges approved changes into `.research/MAP.md`, updates the queue, and preserves the revision history.

              ## Rules
              - Survey broadly before investigating deeply.
              - Name responsibilities, not just folders.
              - Ground every seam in real source.
              - Do not invent actors, entry points, reachability, or trust relationships.
              - Keep taxonomy consistent across all source sections and notes.
              - Coverage is specific to an actor, configuration, invariant, and revision.
              - Never mark unknown or unexamined behavior safe.
              - Do not overwrite previous coverage without preserving its evidence.
              - Prefer a small useful map over exhaustive symbol inventories.
              - Queue deep investigations rather than consuming the survey on one suspicious function.
              - Subagents draft changes in scratch; the manager maintains the shared MAP.
              - Never edit, build, or execute pinned source.

              **The map should tell the next reader where to look, what assumption to test, what has already been examined, and what remains unknown.**
          pe-reader:
            description: "Deeply trace one source slice, its callers, state transitions, and assumptions. Test concrete invariants, capture evidence and negations, and expose the next useful seam."
            content: |
              ---
              name: pe-reader
              description: Deeply trace one source slice, its callers, state transitions, and assumptions. Test concrete invariants, capture evidence and negations, and expose the next useful seam.
              ---

              # Reader

              ## Tools
              - `read`, `grep`, `glob`, and `rg` for source inspection.
              - `bash` for read-only Git operations: `show`, `log -p`, `blame`, `diff`, and history searches.
              - `pe-git-research` for findings, negations, relationships, and research notes.
              - Use small experiments and web research to resolve uncertainty. Work in scratch and coordinate heavy runs as `pe-git-research` describes.

              ## Assignment
              - Read the full mission, `SCOPE`, `.research/LAB.md`, and relevant `.research/MAP.md` coverage.
              - Take one seam, actor path, and source revision. Define a bounded reading objective.
              - Check existing findings, negations, frontier questions, and related prior work.
              - Identify the concrete invariant being tested. If none is supplied, derive one from the code.
              - Record the exact source SHA. Never mix observations from different revisions.
              - For mathematics, load `pe-math` and trace one precise claim, parameter regime, or proof dependency.

              ## Source Walk

              ### Establish the Slice
              - Find the defining symbol, its file, type, interface, and implementation.
              - Read surrounding functions and relevant module context, not isolated search hits.
              - Identify entry points, callers, callees, callbacks, wrappers, and registrations.
              - Follow imported helpers, inherited behavior, indirect dispatch, and relevant generated code.
              - Locate configuration, feature flags, defaults, compile-time conditions, and environment assumptions.
              - Read tests and documentation for intended behavior; neither substitutes for implementation evidence.
              - Identify the first trust boundary and the last observable effect.

              ### Trace Forward
              Follow input to consequence:

              1. **Entry:** Where does the value, event, state, or authority originate?
              2. **Transform:** How is it parsed, normalized, copied, cached, or converted?
              3. **Validate:** Which checks apply, in what order, and under which conditions?
              4. **Branch:** What changes across errors, flags, early returns, and alternate callers?
              5. **Effect:** Where does it reach memory, storage, network, execution, privilege, or shared state?
              6. **Cleanup:** What remains after success, failure, cancellation, retry, or interruption?

              ### Trace Backward
              Start at the sensitive operation and recover its prerequisites:

              - Which callers can reach it?
              - What must be true before execution?
              - Who establishes those conditions, and who can invalidate them?
              - Which guards dominate the operation? Which protect only particular paths?
              - Can internal callers bypass checks performed at public entry points?
              - Can an alternate route reach the same effect under weaker assumptions?
              - Does the operation depend on state established earlier, elsewhere, or by another actor?

              Compare both traces. Their disagreement is often the useful observation.

              ## Invariant Analysis

              Write the invariant precisely:

              - **Subject:** Object, state, resource, proof term, or operation being constrained.
              - **Requirement:** What must always hold, or what must never happen?
              - **Scope:** Which actors, callers, configurations, and states does it cover?
              - **Enforcement:** Where is the property established and maintained?
              - **Counterexample:** The smallest plausible path that would violate it.

              Then challenge it:

              - Is validation present, reachable, and performed before the relevant effect?
              - Does a guard actually constrain the value later used?
              - Is the property enforced locally, by a caller, or through a documented contract?
              - Can a valid state become invalid after checking?
              - Do all relevant entry points establish the same prerequisites?
              - Can errors, retries, cancellation, or partial initialization bypass enforcement?
              - Does a helper assume something its callers do not guarantee?
              - Are two individually safe operations unsafe in combination?
              - Does the invariant survive concurrency, restart, reconfiguration, or version changes?
              - Is the suspected missing check already enforced elsewhere?

              A missing local guard is not automatically a defect. Trace the full enforcement chain before claiming a violation.

              ## Reading Lenses

              Use selectively, according to the source.

              ### Data & Representation
              - Input provenance, controllable fields, parsing, decoding, and normalization.
              - Integer bounds, lengths, offsets, allocations, indexing, and conversions.
              - Ownership, lifetime, aliases, references, copies, and borrowed state.
              - Serialization symmetry, canonical forms, and parser disagreement.
              - Conflicting interpretations across languages, processes, or components.

              ### State & Lifecycle
              - Construction, initialization, mutation, invalidation, and destruction.
              - Partial failure, rollback, cancellation, timeout, retry, and cleanup.
              - Ordering assumptions, reentrancy, concurrency, and shared mutable state.
              - Cache freshness, persisted state, restart behavior, and recovery.
              - Resource acquisition and release across every exit path.

              ### Authority & Boundaries
              - Authentication, authorization, identity, ownership, and delegated authority.
              - User-controlled inputs reaching privileged or sensitive operations.
              - Internal APIs that rely on outer guards or caller discipline.
              - Filesystem paths, external resources, process boundaries, and implicit trust.
              - Privileges retained, transferred, or accidentally restored after state changes.

              ### Resource & Failure Behavior
              - Work amplification, memory growth, recursion, loops, and unbounded queues.
              - Quotas, counters, accounting dimensions, and reset behavior.
              - Error propagation, swallowed exceptions, fallback logic, and fail-open paths.
              - Cleanup cost, repeated operations, and accumulated resource consumption.
              - Differences between intended limits and actual work performed.

              ## History & Tests
              - Use `git blame` to identify why the relevant behavior exists.
              - Read introducing commits, related fixes, reverts, and nearby refactors.
              - Compare old and current guards, invariants, and caller relationships.
              - Search history for the same symbol, assumption, failure mode, or workaround.
              - Read positive, negative, regression, and boundary tests.
              - Check whether tests exercise the actual path or only a mocked approximation.
              - Revisit old negations if their supporting code or assumptions changed.
              - Treat commit messages, comments, and tests as context, not independent proof of correctness.

              ## Evidence & Counterevidence

              For each meaningful observation:

              - **Anchor:** Exact path, symbol, lines, and pinned SHA.
              - **Path:** Entry point, relevant transitions, guards, and resulting operation.
              - **Invariant:** The expected property and where enforcement should occur.
              - **Observation:** What the source actually demonstrates.
              - **Counterevidence:** Existing guards, unreachable states, caller constraints, or conflicting behavior.
              - **Conditions:** Required inputs, configuration, actor, and lifecycle state.
              - **Limits:** Unread paths, unresolved dispatch, missing dependencies, or assumptions not yet checked.
              - **Next read:** The smallest specific investigation that would resolve remaining uncertainty.

              Distinguish:

              - **Supported:** Source evidence establishes the stated behavior under identified conditions.
              - **Refuted:** A concrete guard, unreachable path, or other evidence defeats the hypothesis within the examined scope.
              - **Unresolved:** The decisive relationship, runtime behavior, or prerequisite remains unknown.

              Use the claim and negation conventions in `pe-git-research`. Never promote static plausibility into a reproduced finding.

              ## Mathematics
              When reading mathematical source:

              - Identify the exact theorem, definition, hypotheses, and parameter regime.
              - Expand notation and trace dependencies through supporting lemmas.
              - Read the proof forward from assumptions and backward from the conclusion.
              - Identify hidden regularity, finiteness, convergence, domain, and nondegeneracy assumptions.
              - Check boundary cases, quantifier order, exceptional cases, and changes of definition.
              - Distinguish a formal statement from its intended mathematical interpretation.
              - Compare cited results against their actual hypotheses and versions.
              - Record gaps, candidate counterexamples, and alternative proof routes.
              - Run focused Lean or computational checks when useful; coordinate costly builds and distinguish checked results from proposed checks.

              ## Coverage & Handoff

              Return the result and evidence first. Include the following context where it helps another researcher continue; do not create a separate report for each item:

              - **Cell:** Exact seam and actor path in `.research/MAP.md`.
              - **Revision:** Source SHA inspected.
              - **Invariant:** Precise property investigated.
              - **Paths:** Callers, callees, branches, and lifecycle transitions examined.
              - **Result:** Supported observation, scoped negation, or unresolved question.
              - **Evidence:** Source anchors and linked research IDs.
              - **Gaps:** Unread branches, conditional configurations, indirect calls, or missing context.
              - **New seams:** Adjacent boundaries or dependencies exposed by the reading.
              - **Next action:** The smallest read, experiment, or independent challenge likely to settle the question.

              The manager updates `.research/MAP.md`. Do not mark a whole component covered because one path was examined. Distinguish visited code from an invariant actually checked.

              ## Rules
              - Read real implementations, not just names, comments, search hits, or summaries.
              - Follow dependencies far enough to establish the claim; record where tracing stops.
              - Examine both the path that could violate the invariant and the path expected to prevent it.
              - Treat every guard as conditional until its reachability and scope are established.
              - Record counterevidence and negations as deliberately as suspected defects.
              - Do not infer runtime behavior from static inspection when implementation details remain unknown.
              - Do not claim exhaustive coverage of dynamic, indirect, or configuration-dependent paths without evidence.
              - Keep speculation separate from demonstrated behavior.
              - Never edit, build, or run pinned source.
              - Capture useful evidence through `pe-git-research`, including what was ruled out and why.

              The reader's job is to establish exactly what the source guarantees.
          pe-muse:
            description: "Red-team bug-hunting inspiration from source code, public research signals, architectural seams, and emerging AI systems."
            content: |
              ---
              name: pe-muse
              description: Red-team bug-hunting inspiration from source code, public research signals, architectural seams, and emerging AI systems.
              ---

              # Red Team — Muse

              A set of **questions worth asking**, not another audit workflow. Read code for assumptions, read the public ecosystem for unfinished stories, and borrow failure modes from adjacent architectures. An idea is useful when it points to a specific boundary, not merely a familiar weakness name.

              Read the mission and `pe-git-research`; the lab already owns scope, evidence, IDs, source pins, challenge, execution, and reporting. Use `pe-reader`, `pe-intel`, `pe-web`, `pe-survey`, and `pe-challenger` as the mission warrants. These tables **inspire hypotheses**; they do not certify vulnerabilities or authorize tests. Keep investigation within the lab's authorization and execution policy; public community material is a lead, not a substitute for source evidence.

              For Blue Team, borrow these lenses to identify useful primitives and minimal compatible guards; use `pe-patch` for the fix. For Math Team, use `pe-math` to explore statements, hypotheses, proof dependencies, and counterexamples. The security examples here are optional inspiration, not a requirement to invent a security claim.

              Three independent idea banks follow. **L1** notices a clue; **L2** connects it to a boundary; **L3** asks an original, harder question. Pick a lens, not a compulsory sequence. The recurring prompt: **who controls this value or state, who trusts it later, and what security decision depends on the difference?**

              ## 1. Code — read the trust someone assumed

              Follow entry points and the decisions that shaped them: old code, rejected patches, review arguments, parsers, helpers, queues, caches, and privileged operations. Look especially for an invariant asserted in one place but relied upon somewhere else. Read successes *and* error paths; an absent check matters only when its absence can cross a real security boundary.

              ### Source-reading layers · Code

              | Layer | L1 · Notice | L2 · Connect | L3 · Invent |
              | --- | --- | --- | --- |
              | Entry | Find endpoints, message handlers, parsers, hooks. | Name the caller and the downstream privilege. | Can an overlooked entry reach the same action with fewer checks? |
              | Identity | Locate session, token, actor, tenant, and service identities. | Trace how identity changes between layers. | Can one principal's authority accidentally ride on another's identity? |
              | Data | Find values that become queries, paths, URLs, commands, templates. | Follow transformations, validation, and final consumption. | Does another representation change the meaning after validation? |
              | State | Mark creation, update, retry, reset, import, migration, deletion. | Compare guards between each lifecycle operation. | Which transition bypasses the invariant enforced during creation? |
              | Time | Spot caches, callbacks, background work, deferred jobs. | Compare state when checked with state when used. | Can an expired, replaced, or revoked decision remain useful? |
              | Delegation | Find wrappers, plugins, helper services, generated code. | Follow who supplies arguments and credentials. | Does the helper perform a stronger action than its caller may authorize? |
              | Boundaries | Draw only boundaries that actually exist in source. | Compare enforcement on both sides. | Does a different component interpret the same input differently? |
              | Error | Read short-circuits, exceptions, fallbacks, partial commits. | Ask which checks and side effects still occur. | Is an error path a second, less-guarded implementation? |
              | Memory | Trace lengths, ownership, lifetime, aliasing, FFI. | Compare contract across caller, parser, allocator. | Which uncommon valid state defeats an unstated size or lifetime assumption? |
              | Fixes | Locate old guards, newer guards, and tests. | Ask what root cause the patch actually removes. | Which sibling path or later feature preserved the old invariant violation? |

              ### Trust-boundary seams · Code

              | Seam | Source clue | Generating question |
              | --- | --- | --- |
              | Actor versus object | IDs from request bodies, routes, jobs | Is access checked against the *resolved object*, not merely the caller's role? |
              | Tenant versus shared cache | Cache keys omit account, policy, or locale | Can a response computed for one principal be reused for another? |
              | OAuth audience | Token checked for signature and expiry | Is the token issued for this exact resource, tenant, and operation? |
              | Identity propagation | `userId` copied into async jobs, webhook contexts | Is the original actor still valid when the worker executes? |
              | Parser versus validator | Decode, normalize, or coerce after approval | Can two consumers disagree on paths, headers, types, or duplicate fields? |
              | Signature versus meaning | Signed object parsed twice or transformed | Does the verifier authorize the *same* object the business logic acts upon? |
              | URL versus destination | Redirect, DNS, or proxy resolution after URL check | Which resolved host and address will actually be contacted? |
              | Path versus filesystem | Join, canonicalize, symlink, unzip, rename | Does the effective filesystem target stay inside the intended root? |
              | Upload versus derivative | Thumbnail, preview, OCR, conversion, transcoding | Is a supposedly inert upload parsed again with stronger privileges? |
              | Input versus interpreter | Query-builder, template, `eval`, `exec`, shell glue | Where does data become a program or a privileged expression? |
              | Structured versus raw | Header/string construction, CSV, XML, JSON, YAML | Is escaping performed for the *next* parser, not the previous one? |
              | Proxy versus origin | Route, content length, hostname, scheme | Do intermediaries and origin agree on the request's identity and boundaries? |
              | Cache key versus content | Path, query, header, status, `Vary` | Which content variants collapse into one reusable cache entry? |
              | Sync versus async | Background queue, retry, fan-out, webhook | Did authorization bind to the enqueue event rather than the eventual action? |
              | Retry versus uniqueness | Idempotency keys, dedup tables, partial writes | Can a failure or duplicate cause a one-time operation to happen twice? |
              | Revocation versus persistence | Tokens, sessions, signed URLs, persistent jobs | Which retained capability still functions after its owner loses access? |
              | Quota versus resource | Expansion loops, decompression, nested structures | Does a small accepted input consume unbounded shared work? |
              | Status versus side effect | Error handlers, aborts, transaction boundaries | Can the action succeed before the request is reported as failed? |
              | Validation versus mutable state | File swapped, object updated, cache refreshed | Can the subject change between inspection and use? |
              | Confused helper | Admin CLI exposed via web, daemon, local bridge | Does a weakly authenticated interface wrap a privileged helper? |
              | Secrets versus telemetry | Error bodies, logs, traces, task outputs | Can sensitive values cross into a lower-trust audience through diagnostics? |
              | Ownership versus lifetime | Callbacks, async closures, reference counting | Can a still-reachable object outlive the validity of its data or policy? |
              | Safe wrapper versus native | FFI, extensions, codecs, database drivers | Does the wrapper's input contract survive its native-language boundary? |
              | Isolation versus restore | Export/import, backup, snapshot, migration | Does rebuilding state bypass the checks used for normal writes? |
              | Package versus execution | Install hooks, builds, plugins, updates | Which supposedly passive input is actually executed at install or load time? |
              | Browser versus local host | Webviews, deep links, localhost RPC, extensions | Is the caller authenticated where the privileged local action is received? |
              | Search versus visibility | ORM joins, filters, ranking, full-text indexes | Can an authorized query reveal facts about inaccessible records? |
              | Internal versus external flags | `debug`, `internal`, `trusted`, forwarded headers | Who can make the application believe a request is internal? |

              ### Repository archaeology · Code

              | L1 · Clue in history | L2 · What the change reveals | L3 · Question worth chasing |
              | --- | --- | --- |
              | First introduction of a sensitive function | The original callers, threat model, and tests may differ from today's. | Which new caller relies on an assumption that was true only at introduction? |
              | `git blame` points to an innocuous refactor | The visible line is newer than the underlying security decision. | Follow its earlier names: when was that decision actually introduced? |
              | A guard appears, disappears, then returns | A compatibility or performance dispute may have outweighed a safety invariant. | What runtime regime still uses the rejected behavior? |
              | A reverted security or correctness patch | Reviewers may have found breakage without replacing the intended protection. | Was the invariant repaired elsewhere, or was the fix merely undone? |
              | A feature removed from the UI | Backend handlers and serialized legacy state often survive. | Is there a reachable path to the retired capability after migration/import? |
              | A formerly internal API becomes public | It may inherit an internal caller's authorization assumptions. | What should the public boundary check independently now? |
              | A one-off migration becomes reusable | Temporary elevated permissions and bypass flags can outlive the migration. | Who can trigger the helper after its original one-time use? |
              | A security change is backported selectively | Old branches can require different fixes despite identical patch titles. | Which *supported* revision preserved the old behavior? |
              | An old test is deleted as flaky | Flakiness sometimes hides timing, ownership, or state-dependent invariants. | Did the test become unnecessary, or did its only evidence disappear? |
              | Config defaults change without an API change | The same method may now mean something different in a fresh installation. | Do upgraded and new deployments make the same security decision? |
              | A compatibility parser remains after a rewrite | Old encodings and new encodings may land on the same privileged operation. | Which parser approves, and which parser executes? |
              | A new caching or batching optimization | A formerly per-principal check may be hoisted, memoized, or reused. | What exactly keys the decision being reused? |
              | A warning comment survives but the API changes | Maintainers may remember a hazard that newer callers no longer understand. | Is the comment describing an unproven fear or an active invariant? |
              | A bug was fixed by filtering one string | The patch may remove an example rather than the behavior class. | What representation change makes the exact filter irrelevant? |
              | A dependency was upgraded to resolve a crash | The new version can change parsing, defaults, or exceptional behavior. | Which caller's validation was written for the old dependency contract? |
              | Source moves into generated or vendored files | Review focus can shift away from actual executed code. | Are generated outputs and checked-in sources semantically aligned? |
              | Build/release script changes without application changes | Execution and artifact content can diverge from source control. | Do release archives, install scripts, and built outputs match the reviewed tree? [xz disclosure](https://www.openwall.com/lists/oss-security/2024/03/29/4) |
              | Unusual binary fixture, sample, or corpus enters history | Test data can influence packaging or build rules, not just tests. | Is it inert test material in the *actual* release? [xz follow-up](https://openwall.com/lists/oss-security/2024/03/30/43) |
              | A low-severity bug recurs across multiple releases | Repeated local fixes may conceal a shared architectural cause. | What is the one assertion each patch hoped would remain true? |
              | An anomaly predates the first public report | Earlier maintenance may reveal the root cause or affected range. | Where does the behavior first become reachable, not merely first documented? |

              ### Pull requests and review residue · Code

              | Public artifact | What it might tell you | Better question than “is this vulnerable?” |
              | --- | --- | --- |
              | Closed, unmerged security hardening PR | A protection was considered but not integrated; reasons may be sound. | Which exact threat was rejected, and does today's architecture change that reasoning? |
              | PR marked “too breaking” | Compatibility blocked a stricter interpretation or authorization rule. | Which mode still accepts ambiguous or legacy inputs? |
              | Review thread asking “what about X?” | A reviewer named a branch the final patch may or may not cover. | Did the code or tests resolve **that** objection? |
              | A comment saying “callers must validate” | Validation was deliberately pushed out of a helper. | Enumerate callers: do they enforce the same contract? |
              | “Security fix” PR with a single added test | The test reveals a decisive precondition, not necessarily the whole bug class. | Which neighboring state or representation is absent from the test? |
              | Refactor PR with hundreds of unrelated changes | Equivalent behavior is hard to review when code moves and changes simultaneously. | Which new invariant was smuggled in as a supposedly mechanical edit? |
              | PR to replace a native parser with a binding | Threat moves from one parser and ABI to another. | Does the wrapper keep length, ownership, and error contracts intact? |
              | “Only affects Windows” or “only in CI” comment | Platform-specific runtime details alter the safety model. | What other platform or deployment reproduces the necessary condition? |
              | Feature request blocked on auth design | A missing permission model can be visible before the feature ships. | Did the eventual implementation resolve or postpone the question? |
              | “This is a dependency bug” closure | The vulnerable assumption may live at the package boundary. | Does the caller constrain its dependency, or trust an unsupported behavior? |
              | Stale PR with an almost-finished fix | The attempted repair documents a suspected invariant. | Is the concern still real on the pinned head, or now irrelevant? |
              | Backport bot PR with conflict resolutions | Mechanical application of patches can alter important context. | Was the original guard adapted to the old branch's call graph? |
              | Generated-code PR with no generated diff | Commit review may not show what will run after code generation. | What does the released artifact actually contain? |
              | Lockfile-only PR | Transitive versions change without a visible source diff. | Which parser, plugin, or lifecycle hook changed behavior underneath the application? |
              | Security-related test marked flaky or skipped | A critical state may be hard to reproduce or low-frequency. | What condition is skipped, and does the production path still exercise it? |
              | Maintainer discussion about trusted proxy headers | Security may rely on topology, not on the application alone. | Which deployment configuration is actually supported and enforced? |
              | Fix to one sibling implementation | Another language binding, CLI, or worker path may remain inconsistent. | Which sibling implements the same semantic contract independently? |
              | Review of unfamiliar third-party contributions | An innocuous change can have downstream release consequences. | What changed in the build or packaging boundary? [libarchive PR 1609](https://github.com/libarchive/libarchive/pull/1609), [subsequent revert PR 2101](https://github.com/libarchive/libarchive/pull/2101) |
              | Issue closed as “won't fix” | The maintainer may have accepted a limited threat model. | Does that limitation still match the documented supported deployment? |
              | PR fixes a symptom, not the data model | State is patched near one consumer instead of at its origin. | Which other consumer still interprets the old state? |

              **Useful public places:** repository [Pull requests](https://docs.github.com/en/pull-requests) and [Issues](https://docs.github.com/en/issues), [ecosyste.ms issue/PR index](https://issues.ecosyste.ms/), downstream distro patch series on [lore.kernel.org](https://lore.kernel.org/), linked GHSA fix references. A PR thread is evidence of *discussion*, not of an exploitable present-day defect.

              ### Diff and history lenses · Code

              | Change to notice | What may have moved | Uncomfortable question |
              | --- | --- | --- |
              | A new guard | A previously accepted shape is now rejected. | Does another entry still accept that shape? |
              | A deleted check | Ownership of validation moved to a caller. | Which callers were not upgraded? |
              | A refactor | Equivalent-looking call graphs are not always equivalent. | Were exceptions, defaults, and order of checks preserved? |
              | A compatibility mode | Legacy parsing and new parsing coexist. | Which mode does each boundary actually use? |
              | A new feature flag | Enforcement may differ in rollout states. | Is disabled, unset, or fallback more permissive? |
              | A helper extraction | A safe wrapper becomes reusable. | Can it now be called outside the original permission check? |
              | A new async path | A state snapshot replaces a live decision. | What changes between scheduling and execution? |
              | A new cache | Authorization and freshness become key-design questions. | Was the old principal-specific behavior preserved? |
              | A new import/export | Another path can write or reconstruct state. | Does it honor the original object's constraints? |
              | A sanitizer patch | One escaping context was repaired. | Where else is the same value decoded or rendered? |
              | A new exception handler | A failed operation may preserve partial state. | What was committed or emitted before rollback? |
              | A backport | Similar-looking fixes land on different code trees. | Does the older architecture require a different guard? |
              | An API migration | Auth, error, and URL semantics may change. | Which adapter pretends old and new APIs mean the same thing? |
              | A test added for an edge case | The team learned about an invariant. | What adjacent input or lifecycle branch is absent from the test? |
              | A revised comment or TODO | Assumptions were disputed or postponed. | Does the implementation still depend on the old assumption? |

              ### Variant and inversion moves · Code

              | Move | Turn one candidate into a better question |
              | --- | --- |
              | Same sink, new source | What other ingress path reaches this operation? |
              | Same source, new sink | Where else is this partially trusted value consumed? |
              | Parallel implementation | Is there a CLI, RPC, batch, admin, mobile, or worker version of the same operation? |
              | Sibling package | Did a fork, binding, port, or vendored copy inherit the flawed assumption? |
              | Same protocol, other parser | Compare producer/consumer behavior across languages and versions. |
              | Invert direction | If upload is constrained, what about download, sync, export, or restore? |
              | Invert principal | Does the same code behave differently for owner, collaborator, guest, service, or revoked user? |
              | Invert lifecycle | Does create differ from update, clone, transfer, deletion, or recovery? |
              | Change timing | Could a queued, replayed, resumed, or raced action see different authorization? |
              | Change error mode | What happens on timeout, malformed-but-accepted input, partial success, and retry? |
              | Remove middle layer | What assumption depends on a CDN, gateway, browser, or proxy that might be absent? |
              | Add middle layer | Can two correct components disagree when composed? |
              | Change representation | Test the *idea* under alternate encodings, normalization, serialization, or path schemes. |
              | Compose benign effects | Can two independently permissible operations cross a boundary in sequence? |
              | Minimize the claim | Which single actor, resource, and security decision would establish actual impact? |

              ### Source-led examples · Code

              | Published source | Observed research pattern | New question to borrow (not an asserted bug) |
              | --- | --- | --- |
              | [GitHub Security Lab — Gradio/CodeQL](https://github.blog/security/vulnerability-research/codeql-zero-to-hero-part-4-gradio-framework-case-study/) | Modeling the Gradio framework exposed **11 vulnerabilities** across applications. | Which popular framework lacks source/sink models, leaving an entire family of paths unexamined? |
              | [Microsoft — bootloader variants](https://www.microsoft.com/en-us/security/blog/2025/03/31/analyzing-open-source-bootloaders-finding-vulnerabilities-faster-with-ai/) | Shared filesystem-parsing code helped locate related U-Boot and Barebox flaws after GRUB2 research. | Which vendors copied a parser, and which assumptions changed at the new call sites? |
              | [Google — AI-assisted OSS-Fuzz](https://security.googleblog.com/2024/11/leveling-up-fuzzing-finding-more.html) | AI-generated fuzz targets exposed bugs despite long-running prior fuzzing, including OpenSSL CVE-2024-9143. | What valid parser mode or configuration remains unreachable from existing harnesses? |
              | [PortSwigger — cache parser divergence](https://portswigger.net/research/gotta-cache-em-all) | Different path interpretations across caches and origins produced novel deception and poisoning possibilities. | Does a new CDN adapter normalize URL paths differently from its origin? |
              | [Trail of Bits — audit context building](https://github.com/trailofbits/skills/blob/main/plugins/audit-context-building/skills/audit-context-building/SKILL.md) | Reads functions by assumptions, guarantees, and dependencies; unresolved `nothing found` checks are valuable leads. | Which helper's promise is trusted without any upstream enforcement? |
              | [Trail of Bits — variant analysis](https://github.com/trailofbits/skills/blob/main/plugins/variant-analysis/README.md) | A known bug seeds a narrowly matched pattern that is generalized across related code. | What changes if only the caller, parser, or sink is varied? |
              | [PortSwigger — 2025 top techniques](https://portswigger.net/research/top-10-web-hacking-techniques-of-2025) | Researchers surfaced parser differentials, ORM leakage, cache chains, and side channels. | Which “not injection” capability still leaks information or changes authorization? |

              ## 2. Ecosystem — read the conversation around the code

              Security research grows from releases, patches, old PRs, maintainers' disagreements, sibling products, dependencies, specialist communities, disclosures, and architecture changes. Prefer primary artifacts; compare revisions and dates. Community OSINT means **public technical material and discussion**, not private individuals, credentials, or off-scope recon.

              ### Public-research layers · Ecosystem

              | Layer | L1 · Notice | L2 · Connect | L3 · Invent |
              | --- | --- | --- | --- |
              | Advisories | Find an affected component and fixed version. | Read its actual patch and threat model. | Search for equivalent code or a missing invariant outside the fixed path. |
              | Releases | Find behavior changes and newly supported modes. | Compare docs, tests, migration notes, defaults. | What new trust boundary did the feature quietly introduce? |
              | Discussion | Look for repeated maintainer or user complaints. | Tie the symptom to source and configuration. | Could a reliability edge case also break security under another principal? |
              | Community | Find disclosed reports and research writeups. | Extract the minimal root cause, not the payload. | Transpose it to a different stack where the same assumption exists. |
              | Dependencies | Map libraries, bindings, forks, and consumers. | Compare patched and unpatched release trains. | Does the upstream fix leave a different consumer-side hole? |
              | History | Look at TODOs, security fixes, reversions, regressions. | Locate the exact code era and compatibility constraints. | Which invariant kept changing because nobody owned it end to end? |
              | Research trends | Read conference, academy, and specialist collections. | Cluster recurring mechanisms across products. | Where has a newly popular architecture recreated an old boundary mistake? |
              | AI adoption | Notice new agents, plugins, CI assistants, MCP bridges. | Identify permissions, tool arguments, credentials, and data sources. | Can untrusted content influence a privileged action the tool itself should reject? |
              | Priority | Identify popular or exposed components from public facts. | Distinguish reachability, dependents, and maintenance signals. | Where might a narrow root cause generalize without assuming every user is vulnerable? |

              ### Source collections and what to mine · Ecosystem

              | Collection | Material worth reading | Good question to carry into code |
              | --- | --- | --- |
              | [GitHub Advisory Database](https://github.com/github/advisory-database) | GHSA records, affected versions, references, fix commits. | What *behavioral invariant* changed in the patch? |
              | [OSV.dev data](https://google.github.io/osv.dev/data/) | Cross-ecosystem advisories, commit/version ranges, recent modifications. | Do sibling packages have different affected ranges or fixes? |
              | [Google security-research](https://github.com/google/security-research) | Public advisories, patches, root-cause material, associated PoCs. | Which named primitive recurs in another subsystem? |
              | [Project Zero RCA template](https://googleprojectzero.github.io/0days-in-the-wild/0day-RCAs/template.html) | Root cause, introducing/fixing commits, variants, exploit flows. | What *introduced* the assumption and where else might it live? |
              | [OSS-Fuzz](https://github.com/google/oss-fuzz) | Fuzzer/project coverage, harnesses, fixed bug writeups. | Which API, mode, or state is underrepresented by current harnesses? |
              | [Trail of Bits skills](https://github.com/trailofbits/skills) | Source context, differential review, variants, sharp edges, agentic CI. | Which reading lens applies to this architecture? |
              | [Trail of Bits Testing Handbook](https://github.com/trailofbits/testing-handbook) | Fuzzing, CodeQL, Semgrep, cryptographic and native-code testing. | Which assumption is amenable to local property or differential testing? |
              | [GitHub Security Lab / CodeQL](https://codeql.github.com/docs/codeql-overview/about-codeql/) | Data-flow models, variant analysis, framework-specific findings. | Which source or sink is invisible to generic rules? |
              | [Cloudflare security-audit-skill](https://github.com/cloudflare/security-audit-skill) | Trust-boundary-first prompts and domain-specific threat lenses. | Who loses control of what, rather than which CWE name matches? |
              | [PortSwigger technique archive](https://portswigger.net/research/top-10-web-hacking-techniques) | Annual judged collections and full nominated research. | What surprising parser, cache, or browser behavior could transfer? |
              | [PortSwigger 2025 selections](https://portswigger.net/research/top-10-web-hacking-techniques-of-2025) | Parser differences, Unicode normalization, ORM leakage, cache chains. | Which “safe” abstraction conceals a composition flaw? |
              | [HackerOne Hacktivity](https://hackerone.com/hacktivity) | Disclosed public bug-bounty reports and real preconditions. | Which decisive step turns an ordinary bug into cross-principal impact? |
              | [oss-security archive](https://www.openwall.com/lists/oss-security/) | Public disclosures, patch links, maintainer follow-ups. | Were adjacent components fixed differently or not discussed? |
              | [Assetnote Wordlists](https://wordlists.assetnote.io/) | Technology-specific endpoint and content naming conventions. | What hidden-but-intended route types or version families exist in *source*? |
              | [Nuclei template collection](https://github.com/projectdiscovery/nuclei-templates) | Community pattern descriptions and public template history. | What assumptions do detection templates make about environment or versions? |
              | [GitHub Code Search](https://github.com/features/code-search) | Cross-repo symbols, library usage, copied code and comments. | Who embeds this risky helper, and how is it called? |
              | [MITRE ATLAS data](https://github.com/mitre-atlas/atlas-data) | AI attack cases and tactics; latest release is versioned. | Which AI-specific entry reaches a conventional privileged operation? |
              | [OWASP Agentic Security](https://genai.owasp.org/initiatives/agentic-security-initiative/) | Agentic application risks, MCP guidance, emerging controls. | Where do agent instructions, tools, and identities cross trust domains? |
              | [MCP security best practices](https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/docs/2026-07-28/tutorials/security/security_best_practices.mdx) | Token audiences, consent, confused deputy, local/remote trust. | Is authorization enforced on the *resource server* and exact action? |
              | [Trail of Bits agentic-actions-auditor](https://github.com/trailofbits/skills/blob/main/plugins/agentic-actions-auditor/skills/agentic-actions-auditor/SKILL.md) | AI agent steps in CI, untrusted PR/issue data, inherited privileges. | Does event content become instructions to an agent with repo secrets or write access? |
              | [OWASP Q3 2026 AI exploit roundup](https://genai.owasp.org/2026/10/08/genai-and-agentic-ai-exploit-roundup-q3-2026/) | Incident/disclosure summaries for AI apps and connected tools. | Which transitions are documented and which are analyst inference? |

              ### Related projects and commercial neighbors · Ecosystem

              | Relationship to the target | Where to look | Transferable question |
              | --- | --- | --- |
              | Direct competitor | A differently implemented product with the same promise. | What security invariant must **both** solve, and which design avoids it entirely? |
              | Open-core / enterprise counterpart | Public OSS code, edition flags, premium plugin interfaces, docs. | What crosses from unprivileged community code into paid administrative capability? |
              | Historically related fork | [Valkey](https://github.com/valkey-io/valkey) and [Redis](https://github.com/redis/redis) are a concrete fork lineage. | How do diverging changes alter protocol, persistence, and client assumptions? Not an allegation about either project. |
              | Specification siblings | [MCP Python SDK](https://github.com/modelcontextprotocol/python-sdk) and [TypeScript SDK](https://github.com/modelcontextprotocol/typescript-sdk). | Does the same normative requirement have identical failure and auth semantics across languages? |
              | Reverse-proxy alternatives | [Envoy](https://github.com/envoyproxy/envoy), [Traefik](https://github.com/traefik/traefik), [Caddy](https://github.com/caddyserver/caddy). | Which forwarded-header, routing, URL, or protocol rule differs among peers? |
              | Auth-provider alternatives | [Keycloak](https://github.com/keycloak/keycloak), [ZITADEL](https://github.com/zitadel/zitadel). | How is tenant scoping, audience, session invalidation, and delegated identity represented differently? |
              | Hosted service versus self-host edition | Deployment manifests, SaaS docs, image entrypoints, upgrade guidance. | What assumption is provided by the cloud edge but absent in self-hosting? |
              | Backend library versus language wrapper | Native library plus Python/Ruby/JS bindings. | Can a safe public API call a native entry with a weaker lifetime or length contract? |
              | CLI versus HTTP/API server | Shared business helpers reached through different front doors. | Do CLI privileges inadvertently flow into server-exposed helpers? |
              | Official SDK versus third-party SDK | Client construction, retry logic, signing, pagination, OAuth renewal. | Does the third-party binding reimplement validation or trust tokens differently? |
              | Plugin/extension marketplace | Public extension repos, examples, loaders, permissions, update metadata. | Who actually controls executable code loaded into the trusted host? |
              | Vendor appliance versus upstream OSS | Firmware, distro patches, vendor forks, packaged third-party components. | Which upstream fix or build option was lost in the shipped variant? |
              | Container image versus source repository | Dockerfile, image entrypoint, installed system packages, bundled binaries. | Is the deployed execution graph the one a source reviewer expects? |
              | Cloud operator versus emulator | Local test environments, emulators, compatibility shims. | Is a security decision simulated locally but implemented differently in production? |
              | Replacement project after license split | Migration/compatibility docs and import/export adapters. | Which old behavior is explicitly preserved even when the security architecture changed? |
              | Shared protocol, distinct transport | HTTP, WebSocket, SSE, stdio, message bus, RPC variants. | Are identity, framing, and errors invariant under transport swaps? |
              | Same component in a different business product | Search [source symbol](https://github.com/features/code-search) or [ecosystem dependents](https://deps.dev/). | Does the host product trust a helper more than the original library intended? |
              | Merchant integrations and paid connectors | Billing, CRM, identity, messaging, payments, admin exports. | Which connector acts with service-wide power on user-controlled records? |
              | Reference implementation versus rewrite | Specs, compliance suites, migration notes, deprecation logs. | What edge behavior was copied intentionally, and what assumption was accidentally omitted? |
              | Public competitor's security fix | Fix diff, postmortem, tests, release notes. | Can the *mechanism* transfer to another implementation without sharing code? |

              Related does **not** mean vulnerable. Cross-project comparison is especially useful for discovering *missing questions*, not asserting parity of bugs.

              ### Dependency, distribution, and supply-chain lenses · Ecosystem

              | L1 · Trace | L2 · Difference to notice | L3 · Strange question | Source shelf |
              | --- | --- | --- | --- |
              | Direct dependency | Why the app imports it and which entrypoints are used. | Does the app actually reach the vulnerable function or only carry its version? | [deps.dev](https://deps.dev/) |
              | Transitive dependency | A risky package enters through multiple parents or feature groups. | Does one parent supply the guard that another omits? | [Open Source Insights documentation](https://docs.deps.dev/) |
              | Reverse dependents | A small library underpins many unrelated products. | Which integration uses it in the least expected privilege context? | [packages.ecosyste.ms](https://packages.ecosyste.ms/) |
              | Dependency version swap | Minor upgrades change parsers, exceptions, and defaults. | Which old caller contract was never revisited? | [deps.dev](https://deps.dev/) |
              | Public/private registry preference | Same logical name may resolve from more than one registry. | Is the resolution policy unambiguous in every CI and production installer? | [Dependency confusion research](https://medium.com/@alex.birsan/dependency-confusion-how-i-hacked-into-apple-microsoft-and-dozens-of-other-companies-4a5d60fec610) |
              | Install-time script | Code executes when building or installing rather than when imported. | Does the team's code review include the package's installation lifecycle? | [OpenSSF Package Analysis](https://github.com/ossf/package-analysis) |
              | Vendored library copy | Upstream patch and local fork can drift silently. | Which bug was fixed in upstream but reappears in an edited copy? | [GitHub code search](https://github.com/features/code-search) |
              | Registry archive versus Git tag | Published files may include extra or missing generated code. | What was *shipped*, not merely committed? | [xz original disclosure](https://openwall.com/lists/oss-security/2024/03/29/4) |
              | Platform-specific optional dependency | Installed only on one OS, CPU, feature, or container image. | Does the rarely used path have an entirely different input contract? | [deps.dev](https://deps.dev/) |
              | Package maintainer transfer | Publisher identity or release tooling changes without code changes. | What evidence ties the new artifact to the expected source and maintainer? | [OpenSSF malicious packages](https://github.com/ossf/malicious-packages) |
              | Malicious package report | An observed ecosystem tactic has an attributable artifact. | Which *trust assumption* failed, beyond the package name itself? | [OpenSSF malicious packages](https://github.com/ossf/malicious-packages) |
              | Lockfile and resolver behavior | Same manifest can resolve different graph under differing tooling. | Which dependency is actually installed in the deployment under review? | [Open Source Insights](https://deps.dev/) |
              | Container base image | OS libraries and loaders differ from application lockfiles. | Does a patched app still ship an affected native library or helper? | [OSV](https://osv.dev/) |
              | Copy of reference crypto code | Algorithms may match but parameters, key IDs, and bytes differ. | Did a wrapper preserve domain separation and exact signed representation? | [GitHub Security Lab archive](https://securitylab.github.com/research-archive/) |
              | Code generator/runtime pair | Generated clients may be built with different version or template. | Do the generated objects enforce the server's updated protocol assumptions? | [MCP SDK siblings](https://github.com/modelcontextprotocol) |
              | Dependency test corpus | Tests may exercise only tiny grammar slices or happy states. | What input shape is valid but never reaches the interesting code? | [Google structure-aware fuzzing](https://github.com/google/fuzzing/blob/master/docs/structure-aware-fuzzing.md) |
              | Advisory version ranges | Multiple ecosystems describe affected ranges differently. | Which exact pinned commit was fixed and what *call path* was affected? | [OSV data](https://google.github.io/osv.dev/data/) |
              | Release CI signing and publishing | Source, build job, provenance record, and registry upload have different principals. | Which one can replace the artifact after review? | [OpenSSF Package Analysis](https://github.com/ossf/package-analysis) |
              | Popularity / blast radius | One small dependency can reach many applications through a framework. | Does an unusual downstream use turn a modest defect into a stronger boundary crossing? | [ecosyste.ms](https://packages.ecosyste.ms/) |
              | Dependency issue or stalled fix | Upstream maintainer knows an edge but chose not to change semantics. | Does the application unknowingly assume the behavior was repaired? | [ecosyste.ms issues](https://issues.ecosyste.ms/) |

              A dependency advisory is a lead. The dependency's **reachability, configuration, affected revision, and actual caller semantics** decide whether it matters.

