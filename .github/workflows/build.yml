# Build generated artifacts on source/content changes. Heavy tests are manual.
# PE_RUNNER can select a self-hosted runner; PRs always use GitHub-hosted Ubuntu.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - src/README.md
      - src/REMOTE-OPERATOR-COMMS.md
      - src/banner.svg
  pull_request:
    paths-ignore:
      - README.md
      - src/README.md
      - src/REMOTE-OPERATOR-COMMS.md
      - src/banner.svg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

env:
  GENERATED: cordis.patch.yml src/dsh-client.bundle.js src/pack-defaults.json

jobs:
  build:
    runs-on: ${{ github.event_name != 'pull_request' && vars.PE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: python3 src/build.py

      - name: Compare with what was pushed
        id: drift
        run: |
          if [ -z "$(git status --porcelain -- $GENERATED)" ]; then
            echo "Generated files match src/."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short -- $GENERATED
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "::error::Generated files do not match src/. Run python3 src/build.py and commit, or let the main build do it after merge."
            exit 1
          fi
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && [ -n "$before" ] && ! echo "$before" | grep -qx '0*' \
             && [ -n "$(git diff --name-only "$before" "${{ github.sha }}" -- $GENERATED)" ]; then
            echo "::error::This push edits generated files, and they do not match src/. Make the change in src/ (or rebuild after your last src/ edit) and push again."
            exit 1
          fi

      - name: Commit the rebuilt files
        if: steps.drift.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $GENERATED
          git commit -m "Build from ${GITHUB_SHA::7}"
          git push origin HEAD:main
